<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小学数学补课 · 数学知识图谱</title><style>:root{--bg:#f4eee4;--paper:#fffaf2;--ink:#2a211b;--muted:#7b6b5d;--line:#e8dccb;--or:#d45216;--or2:#fbe6d8;--gr:#2f9e44;--gr2:#e3f4e4;--rd:#d0372d;--rd2:#fbe3df;--bl:#2f6fd1;--P:#12857a;--P2:#e0f2ef;--J:#2f6fd1;--J2:#e8effc;--H:#8a44c8;--H2:#f2e8fb;--sh:0 10px 30px rgba(90,60,30,.07);--ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--ff);overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--or)}
.ib{min-height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.ib:disabled{opacity:.35}
.view{max-width:1180px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 6px}
.card h3{font-size:16px;margin:12px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:42px;padding:8px 16px;border-radius:14px;border:0;background:var(--or);color:#fff;font-weight:700;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tp{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:4px 10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:14px;line-height:1.3;text-align:left;text-decoration:none;color:var(--ink)}
.tp.P{border-color:#a9d8d0}.tp.J{border-color:#b9cdf3}.tp.H{border-color:#d9c0ef}
.tp .dot,.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1.5px dashed #bfb09c;display:inline-block}
.dot.ok{background:var(--gr);border:0}.dot.weak{background:var(--rd);border:0}
.tp .ls{font-size:11px;font-weight:800;color:#fff;background:var(--or);border-radius:6px;padding:0 4px}
.tp small{color:var(--muted);font-size:11.5px}
.band{display:inline-block;font-size:12px;font-weight:800;border-radius:7px;padding:1px 7px;color:#fff}
.band.P{background:var(--P)}.band.J{background:var(--J)}.band.H{background:var(--H)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:#f1e9dd;color:var(--muted)}
.pill.ok{background:var(--gr2);color:#1d6b2e}.pill.weak{background:var(--rd2);color:#8d1f17}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;min-height:36px;min-width:42px;padding:0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--or);color:#fff}
/* graph */
.gctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:8px}
.gctl .lb{font-size:13.5px;font-weight:700;color:var(--muted);margin-right:4px}
.crumbs{display:flex;gap:4px;align-items:center;overflow-x:auto;white-space:nowrap;padding:2px 0 8px;scrollbar-width:none;font-size:13.5px}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:3px 9px;font-size:13px;max-width:none}
.crumbs button.cur{border-color:var(--or);color:var(--or);font-weight:700}
.crumbs .sep{color:#c2b19c}
.gw{position:relative;height:calc(100vh - 250px);height:calc(100svh - 250px);min-height:430px;border-radius:18px;background:#fffdf8;border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh);touch-action:none;user-select:none;-webkit-user-select:none}
.gw svg{display:block;width:100%;height:100%;cursor:grab}
.gw svg.drag{cursor:grabbing}
.gw.fs{position:fixed;inset:0;z-index:100;height:auto;min-height:0;border-radius:0;border:0}
.gbt{position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:3}
.gbt .ib{min-width:38px;min-height:38px;padding:0 8px;font-size:17px;background:rgba(255,250,242,.92);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.gbt .ib.ex{display:none}
.gw.fs .gbt .ib.ex{display:inline-flex}
.gfs-ctl{display:none}
.gw.fs .gfs-ctl{display:flex;position:absolute;left:8px;top:8px;z-index:3;gap:6px;flex-wrap:wrap;max-width:calc(100% - 200px)}
.ginfo{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;background:rgba(255,250,242,.97);border:1px solid var(--line);border-radius:16px;padding:7px 8px 7px 10px;gap:6px!important;box-shadow:0 6px 20px rgba(90,60,30,.12);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ginfo .btn.sm{padding:4px 10px;min-height:34px}
.ginfo .nm{flex:1 1 120px;min-width:0;font-weight:800;font-size:15px;line-height:1.35}
.ginfo .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.node{cursor:pointer}
.node text{font-family:var(--ff)}
.node .bx{transition:filter .2s}
.node:hover .bx{filter:drop-shadow(0 3px 6px rgba(90,60,30,.18))}
.edge{fill:none}
.edge.h{stroke:#62574d;stroke-width:1.6}
.edge.s{stroke:#a39686;stroke-width:1.4;stroke-dasharray:6 4}
.edge.hi{stroke:var(--or)!important;stroke-width:2.4!important}
.dimmed{opacity:.18}
.cap{font-size:13px;color:var(--muted);margin:8px 2px 4px;line-height:1.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink);margin:6px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{display:inline-block;width:16px;height:12px;border-radius:4px;border:2px solid}
.legend i.ln{width:26px;height:0;border:0;border-top:2px solid #62574d;border-radius:0}
.legend i.ln.s{border-top:2px dashed #a39686}
.legend i.rg{width:16px;height:16px;border-radius:6px;border:3px solid;background:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
/* layout desktop */
.gl{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:960px){.gl{grid-template-columns:minmax(0,1fr) 380px}.gl .side{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto}.gw{height:calc(100vh - 230px)}}
.side .card{margin:0}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(42,33,27,.28);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:86vh;max-height:86svh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(60,40,20,.2);transform:translateY(105%);transition:transform .32s cubic-bezier(.16,1,.3,1);padding:6px 14px 26px}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#dccbb5;margin:4px auto 6px}
.sheet .x{position:sticky;top:0;float:right;margin:-2px -4px 0 0}
@media(min-width:960px){.sheet{left:auto;right:14px;bottom:14px;top:110px;width:400px;border-radius:20px;max-height:none;transform:translateX(110%)}.sheet .grab{display:none}}
.dt h2{font-size:20px;margin:4px 0 4px;line-height:1.35}
.dt .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.dt .sec{margin-top:12px}
.dt .sec>b{display:block;font-size:14px;margin-bottom:4px}
.dt ul{margin:2px 0;padding-left:20px}
.lst{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%}
.li .bd{flex:1;min-width:0}
.li .bd b{font-weight:700}
.li .bd small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.li .k{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;flex:none;margin-top:2px}
.k.h{background:#efe6da;color:#5a4a3c}.k.s{background:#fff;border:1px dashed #b7a690;color:#8a7a6a}
.imp{display:flex;gap:10px;flex-wrap:wrap}
.imp div{flex:1 1 90px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.imp div b{display:block;font-size:22px;color:var(--or);line-height:1.2}
.imp div span{font-size:12.5px;color:var(--muted)}
.ms{display:flex;flex-wrap:wrap;gap:6px}
.ms button{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:4px 10px;font-size:13.5px;min-height:34px}
.ms button.on{border-color:var(--or);background:var(--or2);color:var(--or);font-weight:700}
.qa{background:#fff4ea;border:1px dashed #efc3a3;border-radius:12px;padding:8px 10px}
.qa .ans{display:none;margin-top:4px;color:#1d6b2e;font-weight:700}
.qa.show .ans{display:block}
/* search */
.srch{position:fixed;inset:0;z-index:80;background:rgba(244,238,228,.985);display:none;flex-direction:column}
.srch.on{display:flex}
.srch .bar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);max-width:760px;width:100%;margin:0 auto}
.srch input{flex:1;min-width:0;min-height:44px;border-radius:14px;border:1.5px solid var(--or);padding:0 14px;background:#fff;font-size:16px;outline:none}
.srch .res{flex:1;overflow:auto;padding:8px 12px 30px;max-width:760px;width:100%;margin:0 auto}
.srch mark{background:#ffe1c9;color:inherit;border-radius:3px;padding:0 1px}
.sbox{display:flex;align-items:center;gap:8px;min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;color:var(--muted);width:100%;text-align:left;font-size:15px}
/* catalog */
details.cat{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;overflow:hidden}
details.cat>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:800;display:flex;align-items:center;gap:8px}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary:after{content:'›';margin-left:auto;transition:transform .2s;font-size:20px;color:var(--muted)}
details.cat[open]>summary:after{transform:rotate(90deg)}
details.cat .in{padding:0 10px 10px}
details.cat details.cat{margin:6px 0;border-radius:12px;background:#fffdf8}
details.cat details.cat>summary{font-weight:700;font-size:14.5px;padding:8px 10px}
/* path */
.pth{position:relative;padding-left:4px}
.st{display:flex;gap:10px;align-items:flex-start;position:relative;padding-bottom:12px}
.st:before{content:'';position:absolute;left:15px;top:34px;bottom:-2px;width:2px;background:#e6d6c2}
.st:last-child:before{display:none}
.st .no{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:#bfae98;font-size:14px;z-index:1}
.st.weak .no{background:var(--rd)}.st.start .no{box-shadow:0 0 0 4px #ffd9c2}
.st.tgt .no{background:var(--or)}
.st .bd{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.st .bd .t{font-weight:800}
.st .bd small{color:var(--muted);font-size:12.5px;display:block;line-height:1.45}
.gh{font-weight:800;color:var(--muted);font-size:13.5px;margin:6px 0 8px 2px;display:flex;align-items:center;gap:8px}
textarea.code{width:100%;min-height:84px;border-radius:12px;border:1.5px solid var(--line);padding:8px 10px;font:13px/1.4 ui-monospace,Menlo,monospace;background:#fff;word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:120;background:var(--ink);color:#fff;border-radius:12px;padding:9px 16px;font-size:14px;transition:all .3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{max-width:1180px;margin:0 auto;padding:6px 14px 40px;font-size:12.5px;color:var(--muted);line-height:1.6}
.ch7{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.ch7{grid-template-columns:1fr 1fr}}
.ch7 .card{margin:0}
.lab{font-size:12.5px;color:var(--muted);font-weight:700;margin:8px 0 4px}

.pl { max-width: 960px; }
.pl :focus-visible { outline: 3px solid #245fc0; outline-offset: 3px; }
.pl-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: end; margin: 3px 0 12px; }
.pl-head h1 { margin: 2px 0 0; font-size: clamp(24px, 5.5vw, 35px); line-height: 1.18; letter-spacing: -.03em; }
.pl-context { color: #785a46; font-size: 13px; font-weight: 760; }
.pl-progress { grid-column: 1 / -1; width: 100%; height: 6px; border: 0; border-radius: 8px; margin-top: 4px; accent-color: #b34b1b; }
.pl-board { border-radius: 17px; border: 1px solid #2c465a; color: #f2f6f5; background: radial-gradient(ellipse at 40% -30%, #254b60, transparent 72%), #172734; padding: 14px clamp(10px, 3vw, 25px) 15px; }
.pl-board h2 { font-size: 17px; line-height: 1.45; margin: 0 0 7px; color: #f7f1e4; }
.pl-visual { display: grid; place-items: center; min-height: 98px; margin: 9px 0; text-align: center; }
.pl-math { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .28em .45em; font-size: clamp(19px, 4.6vw, 36px); font-weight: 780; line-height: 1.36; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.pl-math > span { max-width: 100%; }
.pl-math .pl-active { color: #ffc789; }
.pl-note { margin: 10px 0 0; color: #edf0ef; font-size: 15px; line-height: 1.52; min-height: 2.9em; }
.pl-steps { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pl-step-count { color: #d2e0e6; font-size: 13px; white-space: nowrap; }
.pl-steps .btn { min-height: 44px; border-radius: 10px; }
.pl-steps .btn:not(.ghost) { background: #ffd098; color: #36231b; }
.pl-steps .btn.ghost { background: #223747; color: #e6edf2; border-color: #608398; }
.pl-steps .btn:disabled { opacity: .45; cursor: default; }
.pl-links { border-top: 1px solid #e7d8c7; margin-top: 6px; padding-top: 10px; }
.pl-links .tp { min-height: 40px; }
.pl-links > summary { min-height: 44px; padding: 10px 2px; color: #70472e; font-weight: 700; cursor: pointer; }
.pl-links p { font-size: 13px; color: #695746; margin: 5px 0 7px; }
.pl-links .pl-jump { min-height: 44px; margin-top: 9px; }
.pl-place { display: grid; width: min(100%, 600px); grid-template-columns: repeat(var(--slots), minmax(0, 1fr)); gap: 4px; }
.pl-place.decimal { grid-template-columns: repeat(var(--left), minmax(0, 1fr)) minmax(9px, 1.1rem) repeat(3, minmax(0, 1fr)); }
.pl-cell { display: flex; min-width: 0; min-height: 72px; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: 1px solid #4b6a7d; border-radius: 8px; background: #243c4e; font-variant-numeric: tabular-nums; }
.pl-cell b { font-size: clamp(20px, 6vw, 38px); line-height: 1; color: #f3f7f7; }
.pl-cell small { font-size: clamp(10px, 2.8vw, 14px); color: #d4dde2; line-height: 1.1; overflow-wrap: anywhere; padding-inline: 1px; }
.pl-cell.active { background: #62432e; border-color: #e6a873; }
.pl-cell.active b, .pl-cell.active small { color: #ffe1b7; }
.pl-dot { display: grid; place-items: center; color: #edb47e; font-size: 26px; }
.pl-pieces { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; width: min(55vw, 290px); padding: 5px 7px; border: 2px solid transparent; }
.pl-pieces i { height: clamp(34px, 8vw, 55px); border-radius: 5px; background: #a1d9d9; }
.pl-pieces.bundled { gap: 2px; border-color: #ffc88d; border-radius: 9px; }
.pl-pieces.bundled i { background: #ffc88d; }
.pl-visual small.pl-caption { display: block; margin-top: 5px; font-size: 13px; color: #d2e0e6; line-height: 1.35; }
.pl-strip { width: min(100%, 550px); }
.pl-strip + .pl-strip { margin-top: 8px; }
.pl-strip .pl-part { display: grid; grid-template-columns: repeat(var(--units), minmax(0, 1fr)); gap: 2px; border-radius: 7px; overflow: hidden; }
.pl-strip i { height: clamp(26px, 5.5vw, 36px); background: #30495c; border: 1px solid #587488; }
.pl-strip i.fill { background: #ffbf80; border-color: #ffca96; }
.pl-strip i.alt { background: #8ed6db; border-color: #a4dfe2; }
.pl-column { min-width: 90px; text-align: right; font: 740 clamp(22px, 5.5vw, 35px)/1.28 ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.pl-column div { display: grid; grid-template-columns: 1em 1fr; gap: 10px; }
.pl-column div:nth-child(2) { border-bottom: 2px solid #8ba5b6; }
.pl-column strong { grid-column: 2; color: #ffd098; }
.pl-area { width: min(100%, 380px); }
.pl-grid-figure { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; width: min(70%, 240px); }
.pl-area .pl-grid-figure { margin: 0 auto; }
.pl-grid-figure i { aspect-ratio: 1.45; border: 1px solid #648295; border-radius: 3px; background: #294455; }
.pl-grid-figure i.row-shaded { background: #815b45; border-color: #b78f6b; }
.pl-grid-figure i.intersection { background: #ffc486; border-color: #ffcd98; }
.pl-line { width: min(100%, 470px); height: auto; max-height: 96px; display: block; }
.pl-line path { fill: none; stroke: #92aebf; stroke-width: .55; }
.pl-line text { fill: #d3e2eb; font-size: 5px; text-anchor: middle; }
.pl-line .pl-move path { stroke: #ffc88d; stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
.pl-line .pl-move circle { fill: #ffc88d; }
.pl-table { width: min(100%, 405px); border-collapse: collapse; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; }
.pl-table th, .pl-table td { border: 1px solid #517081; padding: 4px 6px; }
.pl-table th { background: #2b4557; }
.pl-table tr.active { color: #ffcf9e; background: #4e3a31; }
@keyframes pl-in { from { transform: translateY(5px); opacity: .55; } to { transform: translateY(0); opacity: 1; } }
.pl-frame { animation: pl-in .22s ease-out; }
@media (prefers-reduced-motion: reduce) { .pl-frame { animation: none; } }
@media (max-width: 450px) {
  .pl { padding-inline: 9px; }
  .pl-steps .btn { padding-inline: 8px; font-size: 14px; }
}
.primary-graph-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 1040px; margin: 2px auto; padding: 0 10px; }
.primary-graph-tools[hidden] { display: none; }
.primary-graph-tools a, .primary-graph-tools button { display: inline-flex; align-items: center; min-height: 44px; padding: 3px 7px; color: #614c3d; font-size: .85rem; text-decoration: none; }
.primary-graph-tools button { border: 0; border-radius: 8px; background: #fff4e5; font-weight: 750; }
.primary-graph-tools a[aria-current] { color: #8a3f1c; font-weight: 750; text-decoration: underline; text-underline-offset: 4px; }

/* Original SVG math animations and graph interaction remain unchanged. */
.gw:not(.fs) { border-color: #d8d5cc; background-color: #fffefa; background-image: radial-gradient(#b5c7d429 1px,transparent 1px); background-size: 21px 21px; box-shadow: 0 13px 30px rgba(50,64,83,.09); }
.crumbs button { border-color: #e2d6c6; background: #fffcf7; }
.crumbs button.cur { background: #fff0e4; border-color: #ebba99; }
.gbt .ib { border-color: #e1ded6; box-shadow: 0 2px 8px rgba(45,58,70,.09); }
.gbt .ib:hover { background: #fff1e5; border-color: #debda4; }
.ginfo { border-color: #e5d5c2; box-shadow: 0 7px 21px rgba(61,71,85,.12); }

":"一下","u":"第3单元","c":"一年级下册 第3单元 100以内数的认识","d":"知道 10 个十是 100，100 是 99 的后面一个数，会读写 100。","m":["能说出 10 个十是 100","能说出 100 前面一个数是 99"],"q":"10 个十是多少？","a":"100","o":"数与代数","t":"conceptual"},{"i":"cnm_p259","n":"用连减解决问题","b":"P","g":1,"k":"一下","u":"第4单元","c":"一年级下册 第4单元 100以内的口算加、减法","d":"会用连减解决「先拿走一些，再拿走一些」或「分给几人、装几袋」后还剩多少的问题。","m":["能连续减去相同的一份","能说出还剩多少"],"q":"有 16 块饼干，每人分 3 块，先分给 2 人。还剩几块？","a":"10","o":"数与代数","t":"application"},{"i":"cnm_p260","n":"买卖我做主","b":"P","g":1,"k":"一下","u":"综合与实践","c":"一年级下册 综合与实践 欢乐购物街","d":"在购物情境里会算要付多少元、找回多少元，并判断钱够不够。","m":["能算付出的钱减价钱得到找回的钱","能把两样商品的价钱加起来"],"q":"一块橡皮 2 元，付出 5 元。应找回多少元？","a":"3","o":"综合与实践","t":"application"},{"i":"cnm_p261","n":"逐层分类","b":"P","g":2,"k":"二上","u":"第1单元","c":"二年级上册 第1单元 分类与整理","d":"能先按一个标准分类，再在某一类里按另一个标准继续分（逐层分类）。","m":["能说出每一层用的分类标准","能数出最后一层每一类的个数"],"q":"先按颜色分成红、蓝两类，再把红色里按大小分开。这是在做什么？","a":"逐层分类","o":"统计与概率","t":"conceptual"},{"i":"cnm_p262","n":"用乘法解决购物问题","b":"P","g":2,"k":"二上","u":"第2单元","c":"二年级上册 第2单元 1～6的表内乘法","d":"会用表内乘法解决「单价×数量」一类的购物问题，有时还要再加或再减。","m":["能看出相同加数用乘法算总价","能算出应付或剩余的钱"],"q":"每支铅笔 2 元，买 5 支。一共要付多少元？","a":"10","o":"数与代数","t":"application"},{"i":"cnm_p263","n":"平均分（包含）","b":"P","g":2,"k":"二上","u":"第3单元","c":"二年级上册 第3单元 1～6的表内除法","d":"知道「每几个一份」求能分成几份，是包含除意义的平均分。","m":["能说出每份几个、求份数","能用圆片等分一分"],"q":"12 颗糖，每 3 颗分给一个人。问能分给几个人。这是哪种平均分？","a":"按每份几个来分，求能分成几份（包含）","o":"数与代数","t":"conceptual"},{"i":"cnm_p264","n":"平均分（等分）","b":"P","g":2,"k":"二上","u":"第3单元","c":"二年级上册 第3单元 1～6的表内除法","d":"知道「平均分成几份」求每份几个，是等分意义的平均分。","m":["能说出分成几份、求每份几个","能把总数平均分成几份"],"q":"12 颗糖平均分给 3 人，求每人几颗。这是哪种平均分？","a":"按分成几份来分，求每份几个（等分）","o":"数与代数","t":"conceptual"},{"i":"cnm_p265","n":"认识线段","b":"P","g":2,"k":"二上","u":"第4单元","c":"二年级上册 第4单元 厘米和米","d":"认识线段，知道线段有两个端点，会量整厘米的线段。","m":["能指出线段的两个端点","会量线段的长度"],"q":"直尺上两个刻度点之间的那一段，可以看成什么？","a":"线段","o":"图形与几何","t":"conceptual"},{"i":"cnm_p266","n":"用估量解决问题","b":"P","g":2,"k":"二上","u":"第4单元","c":"二年级上册 第4单元 厘米和米","d":"会先估测物体大约多长，再选择米或厘米测量，并比较估的和量的结果。","m":["能先估再量","能说出估的和量的大约差多少"],"q "t":"procedural"},{"i":"cnm_074","n":"平方根与算术平方根","b":"J","g":7,"k":"七下","u":"第八章","c":"七下 第八章 实数 8.1","d":"如果 x²=a（a≥0）则 x 叫 a 的平方根，正的平方根叫算术平方根，正数有两个互为相反数的平方根，0 的平方根为 0，负数没有平方根。","m":["能区分平方根与算术平方根","会用符号 √a 和 ±√a"],"q":"求 9 的平方根与算术平方根。","a":"±3；3","o":"数与代数","t":"conceptual"},{"i":"cnm_075","n":"开平方与平方根的求法","b":"J","g":7,"k":"七下","u":"第八章","c":"七下 第八章 实数 8.1","d":"会用平方运算求完全平方数的平方根，了解 √(a²)=|a|，并能用计算器求近似值。","m":["能求常见完全平方数的平方根","会化简 √(a²)"],"q":"计算 √49、√(-5)²、±√(1/4)。","a":"7；5；±1/2","o":"数与代数","t":"procedural"},{"i":"cnm_076","n":"立方根","b":"J","g":7,"k":"七下","u":"第八章","c":"七下 第八章 实数 8.2","d":"如果 x³=a，则 x 叫 a 的立方根，任何数都有唯一立方根，会求常见数的立方根。","m":["能求立方根","能说出立方根与平方根的区别"],"q":"求 -8 的立方根。","a":"-2","o":"数与代数","t":"conceptual"},{"i":"cnm_077","n":"无理数","b":"J","g":7,"k":"七下","u":"第八章","c":"七下 第八章 实数 8.3","d":"无限不循环小数叫无理数，如 √2、π；有限小数和无限循环小数都是有理数。","m":["能判断一个数是否是无理数","能举出无理数例子"],"q":"√2 是有理数还是无理数？","a":"无理数","o":"数与代数","t":"conceptual"},{"i":"cnm_078","n":"实数的分类与数轴表示","b":"J","g":7,"k":"七下","u":"第八章","c":"七下 第八章 实数 8.3","d":"有理数与无理数统称实数，实数与数轴上的点一一对应，实数的相反数、绝对值意义同有理数。","m":["能对实数分类","知道实数与数轴上的点一一对应"],"q":"π 对应数轴上哪个位置附近？","a":"3 和 4 之间，约 3.14","o":"数与代数","t":"conceptual"},{"i":"cnm_079","n":"算术平方根的估值与大小比较","b":"J","g":7,"k":"七下","u":"第八章","c":"七下 第八章 实数 8.3","d":"利用平方夹逼估计 √a 的大致范围，并比较含根号的实数大小。","m":["能估计 √a 在哪两个整数之间","能比较 √5 与 2.2 的大小"],"q":"估计 √10 在哪两个整数之间。","a":"3 与 4 之间","o":"数与代数","t":"procedural"},{"i":"cnm_080","n":"实数的运算","b":"J","g":7,"k":"七下","u":"第八章","c":"七下 第八章 实数 8.3","d":"有理数的运算法则和运算律在实数范围内仍适用，会进行含根号的简单运算。","m":["能进行含根号的混合运算","会按要求取近似值"],"q":"计算 √9+∛(-8)-|1-√2|。","a":"3-2-(√2-1)=2-√2","o":"数与代数","t":"procedural"},{"i":"cnm_081","n":"有序数对","b":"J","g":7,"k":"七下","u":"第九章","c":"七下 第九章 平面直角坐标系 9.1.1","d":"用有顺序的两个数表示位置，如（列，行），顺序不同表示的位置不同。","m":["能用有序数对表示位置","能说明为什么要有顺序"],"q":"电影票“3 排 5 号”与“5 排 3 号”相同吗？","a":"不同","o":"图形与几何","t":"conceptual"},{"i":"cnm_082","n":"平面直角坐标系与点的坐标","b":"J","g":7,"k":"七下","u":"第九章","c":"七下 第九章 平面直角坐标系 9.1.1","d":"两条互相垂直、原点重合的数轴构成平面直角坐标系，会根据坐标描点并读出点的坐标。","m":["能画出坐标系并描点","能写出点的坐标"],"q":"点 (−2, 3) 在坐标系中如何描出？","a":"从原点向左 2 单位，再向上 3 单位","o":"图形与几何","t":"conceptual"},{"i":"cnm_083","n":"象限与坐标轴上点的坐标特征","b":"J","g":7,"k":"七下","u":"第九章","c":"七下 第九章 平面直角坐标系 9.1.1","d":"会判断点所在象限，坐标轴上点的特征：x 轴上点纵坐标为 0，y 轴上点横坐标为 0。","m":["能判断各象限点的符号特征","能处理坐标轴上的点"],"q":"点 (-3, -1) 在第几象限？","a":"第三象限","o":"图形与几何","t":"conceptual"},{"i":"cnm_084","n":"用坐标描述简单几何图形","b":"J","g":7,"k":"七下","u":"第九章","c":"七下 第九章 平面直角坐标系 9.1.2","d":"建立坐标系，用坐标表示点、线段和多边形，并求线段长及图形面积。","m":["能求平行于坐标轴的线段长","能用坐标求简单图形面积"],"q":"A(1,2)、B(1,6)，求 AB 的长。","a":"4","o":"图形与几何","t":"application"},{"i":"cnm_085","n":"用坐标表示地理位置","b":"J","g":7,"k":"七下","u":"第九章","c":"七下 第九章 平面直角坐标系 9.2.1","d":"选择适当的原点和单位长度建立坐标系，用坐标表示平面图上的地理位置。","m":["能合理建立坐标系","能用坐标描述景点位置"],"q":"为描述校园景点位置，如何选择原点更方便？","a":"可选择旗杆或校门等明显处，并标明单位","o":"图形与几何","t":"modeling"},{"i":"cnm_086","n":"用坐标表示平移","b":"J","g":7,"k":"七下","u":"第九章","c":"七下 第九章 平面直角坐标系 9.2.2","d":"点向右（左）平移 a 个单位横坐标加（减）a，向上（下）平移 b 个单位纵坐标加（减）b；图形平移即各顶点同样平移。","m":["能写出点平移后的坐标","能由对应点坐标变化反推平移"],"q":"点 A(2,3) 先向左平移 4 个单位再向上平移 1 个单位，新坐标？","a":"(-2, 4)","o":"图形与几何","t":"procedural"},{"i":"cnm_087","n":"二元一次方程及其解","b":"J","g":7,"k":"七下","u":"第十章","c":"七下 第十章 二元一次方程组 10.1","d":"含有两个未知数且未知数的次数都是 1 的整式方程叫二元一次方程，它有无数组解。","m":["能判断二元一次方程","能验证一对数是否是方程的解"],"q":"x=2，y=1 是方程 x+2y=4 的解吗？","a":"是，因为 2+2×1=4","o":"数与代数","t":"conceptual"},{"i":"cnm_088","n":"二元一次方程组及其解","b":"J","g":7,"k":"七下","u":"第十章","c":"七下 第十章 二元一次方程组 10.1","d":"共含两个未知数的两个一次方程合在一起，叫二元一次方程组，两个方程的公共解叫方程组的解。","m":["能判断是否是方程组","能检验方程组的解"],"q":"x=1，y=2 是 {x+y=3, x-y=-1} 的解吗？","a":"是","o":"数与代数","t":"conceptual"},{"i":"cnm_089","n":"代入消元法","b":"J","g":7,"k":"七下","u":"第十章","c":"七下 第十章 二元一次方程组 10.2.1","d":"把一个方程变形用一个未知数表示另一个，代入另一个方程消元，转化为一元一次方程。","m":["能选择便于代入的方程","能正确求出方程组的解"],"q":"解 {y=2x, x+y=9}。","a":"x=3，y=6","o":"数与代数","t":"procedural"},{"i":"cnm_090","n":"加减消元法","b":"J","g":7,"k":"七下","u":"第十章","c":"七下 第十章 二元一次方程组 10.2.2","d":"当某未知数的系数相等或相反时，把两个方程相加或相减消去该未知数。","m":["能判断相加还是相减","必要时先乘数使系数相同"],"q":"解 {x+y=5, x-y=1}。","a":"x=3，y=2","o":"数与代数","t":"procedural"},{"i":"cnm_091","n":"列二元一次方程组解应用题","b":"J","g":7,"k":"七下","u":"第十章","c":"七下 第十章 二元一次方程组 10.3","d":"根据两个等量关系设两个未知数、列方程组、求解并检验作答。","m":["能找到两个独立的等量关系","能规范列方程组并检验"],"q":"买 2 支笔和 3 本本子共 13 元，买 3 支笔和 2 本本子共 12 元，求笔和本子的单价。","a":"笔 2 元，本子 3 元","o":"数与代数","t":"modeling"},{"i":"cnm_092","n":"方程组应用的常见类型","b":"J","g":7,"k":"七下","u":"第十章","c":"七下 第十章 二元一次方程组 10.3","d":"处理和差倍分、行程、浓度配比、分配与方案等需要两个未知数的实际问题。","m":["能判断类型并找等量关系","能解释解的实际意义并检验合理性"],"q":"大小货车共 10 辆，共运 52 吨，大车 6 吨小车 4 吨，各几辆？","a":"大车 6 辆，小车 4 辆","o":"数与代数","t":"modeling"},{"i":"cnm_093","n":"三元一次方程组","b":"J","g":7,"k":"七下","u":"第十章","c":"七下 第十章 二元一次方程组 10.4","d":"通过消元把三元一次方程组转化为二元、再转化为一元一次方程求解。","m":["能选择消元顺序","能正确求解简单三元方程组"],"q":"解 {x+y=3, y+z=5, x+z=4}。","a":"x=1，y=2，z=3","o":"数与代数","t":"procedural"},{"i":"cnm_094","n":"不等式及其解集","b":"J","g":7,"k":"七下","u":"第十一章","c":"七下 第十一章 不等式与不等式组 11.1.1","d":"用不等号表示大小关系的式子叫不等式，使不等式成立的未知数的值叫解，所有解的集合叫解集。","m":["能用不等式表示不等关系","能区分解与解集"],"q":"x 取哪些整数时 x<3 成立（x 为正整数）？","a":"1，2","o":"数与代数","t":"conceptual"},{"i":"cnm_095","n":"在数轴上表示不等式的解集","b":"J","g":7,"k":"七下","u":"第十一章","c":"七下 第十一章 不等式与不等式组 11.1.1","d":"用数轴上的空心圈（不含端点）和实心点（含端点）表示不等式的解集。","m":["能把解集画在数轴上","能从数轴写出解集"],"q":"把 x≥-1 在数轴上表示出来。","a":"在 -1 处画实心点，向右画射线","o":"数与代数","t":"procedural"},{"i":"cnm_096","n":"不等式的性质","b":"J","g":7,"k":"七下","u":"第十一章","c":"七下 第十一章 不等式与不等式组 11.1.2","d":"不等式两边同加（减）同一个数，不等号方向不变；同乘（除以）正数方向不变，同乘（除以）负数方向改变。","m":["能说出三条性质","能用性质变形不等式"],"q":"由 -2x>6 得到 x 的范围。","a":"x<-3","o":"数与代数","t":"conceptual"},{"i":"cnm_097","n":"一元一次不等式的解法","b":"J","g":7,"k":"七下","u":"第十一章","c":"七下 第十一章 不等式与不等式组 11.2","d":"类比一元一次方程的解法：去分母、去括号、移项、合并、系数化为 1，注意乘除负数时改变不等号方向。","m":["能解一元一次不等式并在数轴上表示解集","不遗漏变号"],"q":"解不等式 3x-2≤x+4 并表示解集。","a":"x≤3","o":"数与代数","t":"procedural"},{"i":"cnm_098","n":"一元一次不等式的应用","b":"J","g":7,"k":"七下","u":"第十一章","c":"七下 第十一章 不等式与不等式组 11.2","d":"把“不超过、至少、不低于”等表述转化为不等式并求整数解或最优方案。","m":["能把文字转化为不等式","能结合实际取合适的整数解"],"q":"每支笔 3 元，带 20 元最多买几支？","a":"6 支","o":"数与代数","t":"modeling"},{"i":"cnm_099","n":"一元一次不等式组的解法","b":"J","g":7,"k":"七下","u":"第十一章","c":"七下 第十一章 不等式与不等式组 11.3","d":"分别解各不等式，再用数轴取公共部分得到不等式组的解集（同大取大、同小取小、大小小大中间找、大大小小无解）。","m":["能解不等式组并用数轴表示","能判断无解情形"],"q":"解不等式组 {x>1, x≤4}。","a":"1<x≤4","o":"数与代数","t":"procedural"},{"i":"cnm_100","n":"不等式组的应用","b":"J","g":7,"k":"七下","u":"第十一章","c":"七下 第十一章 不等式与不等式组 11.3","d":"用不等式组描述含有多个限制条件的实际问题，如分配方案、参数取值范围。","m":["能列出不等式组","能结合整数条件确定方案"],"q":"把一批书分给 x 名学生，每人 3 本则多 8 本；每人 5 本则最后一人分得 1~4 本（不满 5 本）。列出关于 x 的不等式组。","a":"书共 3x+8 本，最后一人分得 3x+8-5(x-1)=13-2x 本，故 1≤13-2x<5，解得 x=5 或 6","o":"数与代数","t":"modeling"},{"i":"cnm_101","n":"综合与实践：低碳生活","b":"J","g":7,"k":"七下","u":"第十一章","c":"七下 第十一章 不等式与不等式组 综合与实践","d":"收集生活数据，用方程、不等式比较不同出行或用能方案的碳排放。","m":["能收集并整理数据","能用不等式比较方案并给出建议"],"q":"某人每天通勤 10 km，公交每公里排放 0.05 kg，私家车每公里排放 0.2 kg，改乘公交一天少排放多少 kg？","a":"10×(0.2-0.05)=1.5 kg","o":"综合与实践","t":"modeling"},{"i":"cnm_300","n":"统计活动的基本过程","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.1","d":"一次完整的统计活动包括提出问题、收集数据、整理数据、描述数据、分析数据、得出结论并作出决策。","m":["能按顺序说出统计活动的各个步骤","能在具体活动中说明每一步要做什么"],"q":"为了解同学们每天的睡眠时间并提出建议，请按先后顺序写出统计活动的主要步骤。","a":"确定问题→收集数据→整理数据→用图表描述→分析数据→得出结论与建议","o":"统计与概率","t":"conceptual"},{"i":"cnm_102","n":"全面调查与抽样调查","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.1.1","d":"全面调查对全体对象调查，抽样调查只调查一部分，知道各自适用的情形。","m":["能区分两种调查","能为给定问题选择调查方式"],"q":"了解全国中学生视力情况宜用哪种调查？","a":"抽样调查","o":"统计与概率","t":"conceptual"},{"i":"cnm_292","n":"数据收集的方法：问卷调查、实验与查阅资料","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.1.1","d":"了解问卷调查、访谈、实验观测、查阅文献或网络资料等常见的数据收集方法及各自适用的情形。","m":["能说出常见的数据收集方法及适用情形","能为给定的统计问题选择合适的收集方法并指出可能产生的偏差"],"q":"要了解一种新型种子的发芽率，宜用问卷调查、实验、查阅资料中的哪种方式收集数据？","a":"实验（做发芽实验并记录发芽粒数）","o":"统计与概率","t":"conceptual"},{"i":"cnm_103","n":"总体、个体、样本与样本容量","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.1.2","d":"辨认调查中的总体、个体、样本和样本容量。","m":["能指出具体问题中的总体与样本","能说出样本容量"],"q":"从 500 名学生中抽取 50 名测身高，样本容量是多少？","a":"50","o":"统计与概率","t":"conceptual"},{"i":"cnm_104","n":"样本的代表性与随机抽样","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.1.2","d":"认识抽样要具有代表性和随机性，能判断抽样方式是否合理。","m":["能指出有偏差的抽样方式","能设计简单的随机抽样"],"q":"只调查校篮球队队员的身高能代表全校吗？","a":"不能，样本不具代表性","o":"统计与概率","t":"reasoning"},{"i":"cnm_298","n":"简单随机抽样的实施（抽签法与随机数）","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.1.2","d":"按随机原则抽取样本，用抽签法或随机数（随机数表、计算器产生的随机数）使每个个体被抽到的机会相等。","m":["能按步骤用抽签法或随机数从总体中抽取样本","能说明这样做为什么使每个个体机会均等"],"q":"从编号 1～50 的 50 名学生中抽取 5 人，用抽签法应怎样做？","a":"把 50 个编号分别写在大小形状相同的纸签上，充分搅匀后随机抽出 5 张，对应编号的学生入样","o":"统计与概率","t":"procedural"},{"i":"cnm_299","n":"用样本百分比估计总体数量","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.1.2","d":"用样本中某类个体所占的百分比估计总体中该类个体的数量，如估计全校喜欢阅读的人数或池塘中鱼的条数。","m":["能根据样本百分比估计总体中某类个体的数量","能说明估计结果受样本容量与代表性的影响"],"q":"为了解某校 1200 名学生中喜欢阅读的人数，随机抽取 100 名，其中 45 人喜欢，估计全校喜欢阅读的学生约有多少人？","a":"约 540 人","o":"统计与概率","t":"application"},{"i":"cnm_105","n":"扇形图、条形图与折线图","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"按目的选择扇形图（占比）、条形图（数量）、折线图（变化趋势），并从图中读取信息。","m":["能根据目的选择统计图","能读出图中的数据并简单分析"],"q":"想表示某城市一年中气温变化，应选择哪种图？","a":"折线图","o":"统计与概率","t":"application"},{"i":"cnm_293","n":"数据的分类整理与划记法、统计表","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"按一定标准对原始数据分类，用划记法计数，并把结果填入含合计的统计表。","m":["能按给定标准对数据分类并用划记法正确计数","能把结果整理成统计表并用合计检验总数"],"q":"10 名同学最喜欢的运动依次为：篮球、足球、篮球、跑步、足球、篮球、跑步、篮球、足球、跑步。整理成统计表，篮球、足球、跑步各有几人？","a":"篮球 4 人，足球 3 人，跑步 3 人，合计 10 人","o":"统计与概率","t":"procedural"},{"i":"cnm_294","n":"条形图与折线图的绘制","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"根据数据范围选取合适的纵轴刻度，画出并标注条形图（比较各类数量）和折线图（反映随时间的变化）。","m":["能选取合适刻度并标明坐标轴名称与单位","能正确画出条形图和折线图并读出最大值与变化趋势"],"q":"某地 1～4 月降水量依次为 20、35、55、40（mm），画成折线图后，哪相邻两个月之间上升最多？","a":"2 月到 3 月，上升 20 mm","o":"统计与概率","t":"procedural"},{"i":"cnm_295","n":"扇形图的绘制：百分比与圆心角的换算","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"把各类数据占总数的百分比换算成圆心角（百分比×360°），用量角器画出扇形图。","m":["能由数据求出各部分的百分比及对应圆心角","能用量角器作出扇形图并验证圆心角之和为 360°"],"q":"扇形图中某项占总数的 25%，对应的圆心角是多少度？若该项有 30 人，总人数是多少？","a":"90°；总人数 120 人","o":"统计与概率","t":"procedural"},{"i":"cnm_296","n":"统计图的误导与偏差辨识","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"识别截断纵轴、刻度间隔不均、只选取部分数据等使统计图产生误导的做法，并能说明如何改正。","m":["能指出一幅统计图中夸大或掩盖差异的做法","能说出改进统计图的方法"],"q":"两根柱的数值分别是 49 和 51，纵轴却从 48 开始画，看起来第二根柱是第一根的 3 倍高。这张图误导在哪里？","a":"纵轴没有从 0 开始（被截断），夸大了差异；实际上 51 只比 49 多约 4%","o":"统计与概率","t":"reasoning"},{"i":"cnm_106","n":"频数分布表与数据分组","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.2","d":"对数据进行分组，统计各组频数，画频数分布表。","m":["能确定组距和组数","能完成频数分布表"],"q":"把 20 个数据按组距 5 分组，怎样得到频数？","a":"数落在各组内的个数","o":"统计与概率","t":"procedural"},{"i":"cnm_107","n":"频数分布直方图","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.2","d":"用直方图直观表示数据分布，从图中读取各组频数并分析。","m":["能画直方图","能由直方图读取频数"],"q":"直方图中小长方形的高表示什么？","a":"该组的频数","o":"统计与概率","t":"procedural"},{"i":"cnm_297","n":"频率（相对频数）的计算与意义","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.2","d":"频率等于频数除以数据总数，各组频率之和为 1；用频率反映各组数据占总体的比例。","m":["能由频数和总数求出频率并化为百分数","能验证各组频率之和为 1"],"q":"40 个数据分成 4 组，频数依次为 6、14、12、8，各组的频率分别是多少？","a":"0.15、0.35、0.3、0.2（和为 1）","o":"统计与概率","t":"conceptual"},{"i":"cnm_301","n":"频数分布直方图的读图与分析","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.2","d":"从直方图读出各组频数，求某个范围内的人数或所占比例，并判断数据分布的特点。","m":["能从直方图读出各组频数并求某范围的人数及占比","能说出数据分布较集中的区间"],"q":"某直方图中，成绩 60～70、70～80、80～90、90～100 分四组的频数依次为 4、12、20、14（共 50 人）。80 分及以上的学生占百分之几？","a":"68%","o":"统计与概率","t":"application"},{"i":"cnm_108","n":"趋势图","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 12.2.3","d":"通过趋势图观察数据随时间变化的规律，并作简单预测。","m":["能描述变化趋势","能作出简单预测"],"q":"折线上升说明什么？","a":"随时间推移数值增大","o":"统计与概率","t":"application"},{"i":"cnm_109","n":"综合与实践：日昼时长规律的探究","b":"J","g":7,"k":"七下","u":"第十二章","c":"七下 第十二章 数据的收集、整理与描述 综合与实践","d":"收集不同日期、地点的昼长数据，用统计图探究其变化规律。","m":["能收集并整理数据","能用图表描述规律并给出解释"],"q":"北半球夏至日昼最长，这一点在趋势图上表现为什么？","a":"曲线的最高点（峰值）","o":"综合与实践","t":"modeling"},{"i":"cnm_110","n":"三角形的概念与分类","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 13.1","d":"认识三角形的边、角、顶点，按边（不等边、等腰、等边）和按角（锐角、直角、钝角）对三角形分类。","m":["能说出三角形的基本元素","能按边或按角对三角形分类"],"q":"三个内角分别是 30°、60°、90° 的三角形是什么三角形？","a":"直角三角形","o":"图形与几何","t":"conceptual"},{"i":"cnm_111","n":"三角形三边关系","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 13.2","d":"三角形任意两边之和大于第三边，任意两边之差小于第三边（依据两点之间线段最短）。","m":["能判断三条线段能否构成三角形","能求第三边的取值范围"],"q":"三边为 3、4、x，x 的取值范围？","a":"1<x<7","o":"图形与几何","t":"reasoning"},{"i":"cnm_112","n":"三角形的高","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 13.2","d":"从三角形的一个顶点向对边（或其延长线）作垂线，顶点与垂足间的线段叫高，三角形有三条高。","m":["能画出锐角、直角、钝角三角形的高","知道三条高所在直线交于一点"],"q":"钝角三角形的高在三角形外部吗？","a":"钝角所对边上的高在三角形内部，另外两条在外部","o":"图形与几何","t":"conceptual"},{"i":"cnm_113","n":"三角形的中线","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 13.2","d":"连接顶点与对边中点的线段叫中线，三条中线交于重心，一条中线把三角形分成面积相等的两部分。","m":["能画出三角形的中线","知道中线平分三角形面积"],"q":"△ABC 中 AD 是 BC 边中线，△ABD 与 △ACD 面积关系？","a":"相等","o":"图形与几何","t":"conceptual"},{"i":"cnm_114","n":"三角形的角平分线","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 13.2","d":"三角形一个内角的平分线与对边相交，顶点与交点间的线段叫三角形的角平分线。","m":["能画出三角形的角平分线","知道三条角平分线交于一点"],"q":"△ABC 中 AD 平分 ∠A=60°，∠BAD 多大？","a":"30°","o":"图形与几何","t":"conceptual"},{"i":"cnm_115","n":"三角形内角和定理","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 13.3","d":"三角形三个内角的和等于 180°，可通过过一顶点作平行线说明。","m":["能说明内角和定理的证明思路","能求三角形中的未知角"],"q":"三角形两个角分别为 50°、60°，第三个角？","a":"70°","o":"图形与几何","t":"reasoning"},{"i":"cnm_116","n":"直角三角形的两个锐角互余","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 13.3","d":"直角三角形的两个锐角互余；有两个角互余的三角形是直角三角形。","m":["能由一个锐角求另一个锐角","能判断有两角互余的三角形形状"],"q":"直角三角形一个锐角是 35°，另一个是多少？","a":"55°","o":"图形与几何","t":"conceptual"},{"i":"cnm_117","n":"三角形的外角及其性质","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 13.3","d":"三角形的外角等于与它不相邻的两个内角之和，并大于任何一个与它不相邻的内角。","m":["能识别三角形的外角","能用外角性质求角"],"q":"三角形两个内角 40°、70°，与第三个角相邻的外角？","a":"110°","o":"图形与几何","t":"reasoning"},{"i":"cnm_118","n":"几何证明的基本格式","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 13.3","d":"认识“已知、求证、证明”的格式，体会每一步都要有依据，理解为什么要证明。","m":["能写出规范的已知和求证","每一步都能写出依据"],"q":"证明“三角形的外角和为 360°”需要写出哪几部分？","a":"已知、求证、证明","o":"图形与几何","t":"reasoning"},{"i":"cnm_119","n":"综合与实践：确定匀质薄板的重心位置","b":"J","g":8,"k":"八上","u":"第十三章","c":"八上 第十三章 三角形 综合与实践","d":"通过悬挂实验和作中线，探究三角形等匀质薄板的重心位置。","m":["能用悬挂法找重心","能说明三角形重心是三条中线的交点"],"q":"三角形薄板的重心在哪里？","a":"三条中线的交点","o":"综合与实践","t":"modeling"},{"i":"cnm_120","n":"全等图形与全等三角形","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.1","d":"能够完全重合的两个图形叫全等图形，认识全等三角形的对应顶点、对应边、对应角及“≌”的记法。","m":["能找出对应元素","能规范书写全等式"],"q":"△ABC≌△DEF，则点 A 的对应点是？","a":"D","o":"图形与几何","t":"conceptual"},{"i":"cnm_121","n":"全等三角形的性质","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.1","d":"全等三角形的对应边相等、对应角相等。","m":["能用性质写出相等的边和角","能求全等三角形中的未知量"],"q":"△ABC≌△DEF，AB=5，DE 多长？","a":"5","o":"图形与几何","t":"conceptual"},{"i":"cnm_122","n":"全等判定：边边边（SSS）","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.2","d":"三边分别相等的两个三角形全等。","m":["能叙述 SSS","能用 SSS 证明全等"],"q":"△ABC 与 △DEF 三边分别相等，它们全等吗？依据？","a":"全等，SSS","o":"图形与几何","t":"reasoning"},{"i":"cnm_123","n":"全等判定：边角边（SAS）","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.2","d":"两边及其夹角分别相等的两个三角形全等。","m":["能辨别“夹角”","能用 SAS 证明全等"],"q":"两边相等且一角相等，一定全等吗？","a":"不一定，必须是夹角","o":"图形与几何","t":"reasoning"},{"i":"cnm_124","n":"全等判定：角边角（ASA）与角角边（AAS）","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.2","d":"两角及其夹边分别相等，或两角及其中一角的对边分别相等的两个三角形全等。","m":["能叙述 ASA 与 AAS","能由 ASA 与内角和推出 AAS"],"q":"△ABC 与 △DEF 中 ∠A=∠D，∠B=∠E，BC=EF，可用哪个判定？","a":"AAS","o":"图形与几何","t":"reasoning"},{"i":"cnm_125","n":"全等判定：斜边、直角边（HL）","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.2","d":"斜边和一条直角边分别相等的两个直角三角形全等。","m":["能叙述 HL","能判断何时只能用 HL"],"q":"直角三角形的 SSA 为什么这里可以用？","a":"因为是直角三角形，HL 是特例","o":"图形与几何","t":"reasoning"},{"i":"cnm_126","n":"综合运用全等判定与规范书写","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.2","d":"根据已知条件选择合适的判定方法，补全条件并规范书写证明。","m":["能选择判定方法","能写出完整证明"],"q":"已知 AB=AC，AD 是中线，证明 △ABD≌△ACD 用什么判定？","a":"SSS（AB=AC，BD=CD，AD=AD）","o":"图形与几何","t":"reasoning"},{"i":"cnm_127","n":"基本尺规作图：作等角与角平分线","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.2/14.3","d":"用圆规和无刻度直尺作一个角等于已知角以及作已知角的平分线，作图依据是 SSS。","m":["能说出作图依据","能完成作图并保留痕迹"],"q":"作角平分线时，作图依据哪个判定？","a":"SSS","o":"图形与几何","t":"procedural"},{"i":"cnm_128","n":"角平分线的性质","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.3","d":"角平分线上的点到角两边的距离相等。","m":["能叙述性质并证明","能用性质求线段长"],"q":"点 P 在 ∠AOB 平分线上，P 到 OA 距离为 3，到 OB 距离？","a":"3","o":"图形与几何","t":"reasoning"},{"i":"cnm_129","n":"角平分线的判定","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 14.3","d":"角的内部到角两边距离相等的点在角的平分线上。","m":["能叙述判定并证明","能区分性质与判定"],"q":"若点 P 到 ∠AOB 两边的距离相等，P 一定在平分线上吗（P 在角内）？","a":"是","o":"图形与几何","t":"reasoning"},{"i":"cnm_130","n":"全等三角形的常见辅助线与模型","b":"J","g":8,"k":"八上","u":"第十四章","c":"八上 第十四章 全等三角形 综合","d":"掌握倍长中线、截长补短、旋转型全等等构造全等三角形的常见方法。","m":["能识别模型并添加辅助线","能完成含辅助线的证明"],"q":"已知 AD 为 △ABC 中线，如何用倍长中线证明 AB+AC>2AD？","a":"延长 AD 至 E 使 DE=AD，证 △ABD≌△ECD，再用三边关系","o":"图形与几何","t":"reasoning"},{"i":"cnm_131","n":"轴对称图形与两个图形成轴对称","b":"J","g":8,"k":"八上","u":"第十五章","c":"八上 第十五章 轴对称 15.1","d":"一个图形沿一条直线折叠两侧能重合是轴对称图形，两个图形沿直线折叠重合叫成轴对称，认识对称轴与对称点。","m":["能区分轴对称图形与成轴对称","能找出对称轴"],"q":"等边三角形有几条对称轴？","a":"3 条","o":"图形与几何","t":"conceptual"},{"i":"cnm_132","n":"轴对称的性质","b":"J","g":8,"k":"八上","u":"第十五章","c":"八上 第十五章 轴对称 15.1","d":"成轴对称的两个图形全等，对称点连线被对称轴垂直平分。","m":["能说出轴对称的性质","能由对称点求对称轴"],"q":"A、A′ 关于直线 l 对称，l 与 AA′ 的关系？","a":"l 垂直平分 AA′","o":"图形与几何","t":"reasoning"},{"i":"cnm_133","n":"线段垂直平分线的性质与判定","b":"J","g":8,"k":"八上","u":"第十五章","c":"八上 第十五章 轴对称 15.1","d":"线段垂直平分线上的点到线段两端距离相等；到线段两端距离相等的点在垂直平分线上。","m":["能叙述性质与判定","能用其证明线段相等"],"q":"点 P 在 AB 的垂直平分线上，PA=5，PB？","a":"5","o":"图形与几何","t":"reasoning"},{"i":"cnm_134","n":"作线段的垂直平分线","b":"J","g":8,"k":"八上","u":"第十五章","c":"八上 第十五章 轴对称 15.1","d":"用尺规作线段的垂直平分线及确定线段的中点。","m":["能完成作图","能说出作图依据"],"q":"为什么两圆弧交点连线是垂直平分线？","a":"交点到两端点距离相等，由判定可得","o":"图形与几何","t":"procedural"},{"i":"cnm_135","n":"画轴对称图形","b":"J","g":8,"k":"八上","u":"第十五章","c":"八上 第十五章 轴对称 15.2","d":"根据对称轴作出已知 第十九章","c":"八下 第十九章 二次根式 19.2","d":"被开方数不含能开尽方的因数或因式、也不含分母的二次根式是最简二次根式，会化简并有理化分母。","m":["能判断最简二次根式","能化简 1/√2 等"],"q":"化简 √18 和 1/√2。","a":"3√2；√2/2","o":"数与代数","t":"procedural"},{"i":"cnm_172","n":"二次根式的加减","b":"J","g":8,"k":"八下","u":"第十九章","c":"八下 第十九章 二次根式 19.3","d":"先化为最简二次根式，再合并被开方数相同的根式（类似合并同类项）。","m":["能识别同类二次根式","能正确合并"],"q":"计算 √12+√27-√3。","a":"4√3","o":"数与代数","t":"procedural"},{"i":"cnm_173","n":"二次根式的混合运算","b":"J","g":8,"k":"八下","u":"第十九章","c":"八下 第十九章 二次根式 19.3","d":"综合运用二次根式的四则运算与乘法公式。","m":["能确定运算顺序","能用公式简化运算"],"q":"计算 (√5+√2)(√5-√2)+(√3-1)²。","a":"7-2√3","o":"数与代数","t":"procedural"},{"i":"cnm_174","n":"勾股定理","b":"J","g":8,"k":"八下","u":"第二十章","c":"八下 第二十章 勾股定理 20.1","d":"直角三角形两直角边的平方和等于斜边的平方：a²+b²=c²。","m":["能叙述定理","能已知两边求第三边"],"q":"直角边 6、8，斜边多长？","a":"10","o":"图形与几何","t":"conceptual"},{"i":"cnm_175","n":"勾股定理的证明","b":"J","g":8,"k":"八下","u":"第二十章","c":"八下 第二十章 勾股定理 20.1","d":"通过拼图和面积关系（如赵爽弦图）证明勾股定理。","m":["能说明一种证明的思路","能用面积法写出等式"],"q":"弦图中大正方形边长 c，四个直角边为 a、b 的直角三角形围成小正方形，如何得到 a²+b²=c²？","a":"c²=4×(ab/2)+(b-a)²，化简得 a²+b²=c²","o":"图形与几何","t":"reasoning"},{"i":"cnm_176","n":"勾股定理的应用","b":"J","g":8,"k":"八下","u":"第二十章","c":"八下 第二十章 勾股定理 20.1","d":"用勾股定理解决梯子、折叠、最短路径等实际问题。","m":["能画图并构造直角三角形","能求实际长度"],"q":"13 m 长梯子斜靠墙，底端离墙 5 m，顶端离地多高？","a":"12 m","o":"图形与几何","t":"application"},{"i":"cnm_179","n":"用勾股定理在数轴上表示无理数","b":"J","g":8,"k":"八下","u":"第二十章","c":"八下 第二十章 勾股定理 20.1","d":"借助直角三角形斜边在数轴上作出 √2、√5 等对应的点。","m":["能构造相应的直角三角形","能用圆规截取在数轴上"],"q":"怎样在数轴上作出表示 √5 的点？","a":"作直角边为 2 与 1 的直角三角形，以原点为圆心、斜边长为半径画弧交数轴于 √5","o":"图形与几何","t":"procedural"},{"i":"cnm_177","n":"勾股定理的逆定理","b":"J","g":8,"k":"八下","u":"第二十章","c":"八下 第二十章 勾股定理 20.2","d":"如果三角形三边满足 a²+b²=c²，那么它是直角三角形，满足的三个正整数叫勾股数。","m":["能用逆定理判断直角三角形","能说出常见勾股数"],"q":"三边 5、12、13 的三角形是直角三角形吗？","a":"是，5²+12²=13²","o":"图形与几何","t":"reasoning"},{"i":"cnm_178","n":"勾股定理逆定理的应用","b":"J","g":8,"k":"八下","u":"第二十章","c":"八下 第二十章 勾股定理 20.2","d":"在实际问题（方向、距离）中用逆定理判断垂直关系并求值。","m":["能选最长边为斜边验证","能解决方向角问题"],"q":"三角形三边 √2、√3、√5 是直角三角形吗？","a":"是，2+3=5，斜边为 √5","o":"图形与几何","t":"application"},{"i":"cnm_180","n":"多边形及其对角线","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.1","d":"认识多边形的边、顶点、内角、外角、对角线及正多边形，知道 n 边形从一个顶点出发可引 n-3 条对角线。","m":["能说出多边形的相关概念","能算对角线条数"],"q":"八边形共有几条对角线？","a":"20 条","o":"图形与几何","t":"conceptual"},{"i":"cnm_181","n":"多边形的内角和","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.1","d":"n 边形内角和为 (n-2)×180°，可通过分割成三角形推导。","m":["能推导内角和公式","能用公式求边数或角度"],"q":"八边形内角和是多少？","a":"1080°","o":"图形与几何","t":"reasoning"},{"i":"cnm_182","n":"多边形的外角和","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.1","d":"任意多边形的外角和为 360°。","m":["能说明外角和为 360°","能用于求正多边形的边数"],"q":"正六边形一个外角是多少度？","a":"60°","o":"图形与几何","t":"reasoning"},{"i":"cnm_183","n":"平行四边形的性质","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.2","d":"平行四边形对边平行且相等、对角相等、对角线互相平分。","m":["能叙述并证明性质","能用性质求边角"],"q":"▱ABCD 中 ∠A=70°，求 ∠B；AB=3，求 CD。","a":"110°；3","o":"图形与几何","t":"reasoning"},{"i":"cnm_184","n":"平行四边形的判定","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.2","d":"两组对边分别平行（相等）、一组对边平行且相等、对角线互相平分、两组对角分别相等的四边形是平行四边形。","m":["能叙述各判定","能选择合适的判定证明"],"q":"四边形一组对边平行且相等，是平行四边形吗？","a":"是","o":"图形与几何","t":"reasoning"},{"i":"cnm_185","n":"三角形的中位线","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.2","d":"三角形的中位线平行于第三边且等于第三边的一半。","m":["能叙述并证明","能用于求线段长和证明平行"],"q":"△ABC 中 D、E 分别是 AB、AC 的中点，BC=10，DE 多长？","a":"5，且 DE∥BC","o":"图形与几何","t":"reasoning"},{"i":"cnm_186","n":"矩形的性质","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.3","d":"矩形的四个角都是直角，对角线相等且互相平分。","m":["能叙述性质","能用性质计算"],"q":"矩形一条对角线长 10，另一条对角线多长？","a":"10","o":"图形与几何","t":"reasoning"},{"i":"cnm_187","n":"直角三角形斜边上的中线","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.3","d":"直角三角形斜边上的中线等于斜边的一半。","m":["能叙述并用矩形证明","能用于求线段长"],"q":"Rt△ABC 中斜边 AB=10，斜边中线 CD 多长？","a":"5","o":"图形与几何","t":"reasoning"},{"i":"cnm_188","n":"矩形的判定","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.3","d":"有一个角是直角的平行四边形、对角线相等的平行四边形、有三个角是直角的四边形是矩形。","m":["能叙述判定","能选择判定证明"],"q":"对角线相等的平行四边形是什么图形？","a":"矩形","o":"图形与几何","t":"reasoning"},{"i":"cnm_189","n":"菱形的性质","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.3","d":"菱形四边相等，对角线互相垂直平分且平分每组对角，面积等于对角线乘积的一半。","m":["能叙述性质","能求边长与面积"],"q":"菱形对角线长 6 和 8，边长与面积各是多少？","a":"边长 5；面积 24","o":"图形与几何","t":"reasoning"},{"i":"cnm_190","n":"菱形的判定","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.3","d":"四边相等的四边形、对角线互相垂直的平行四边形、一组邻边相等的平行四边形是菱形。","m":["能叙述判定","能选择判定证明"],"q":"对角线互相垂直的平行四边形是什么图形？","a":"菱形","o":"图形与几何","t":"reasoning"},{"i":"cnm_191","n":"正方形的性质与判定","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 21.3","d":"正方形兼有矩形和菱形的性质，会判定正方形并梳理平行四边形、矩形、菱形、正方形的包含关系。","m":["能说出正方形的性质","能画出四类四边形的包含关系图"],"q":"边长为 2 的正方形，对角线长？","a":"2√2","o":"图形与几何","t":"reasoning"},{"i":"cnm_192","n":"四边形中的折叠与动点问题","b":"J","g":8,"k":"八下","u":"第二十一章","c":"八下 第二十一章 四边形 综合","d":"在矩形、菱形、正方形背景中处理折叠、动点，利用全等、勾股定理建立方程。","m":["能画出折叠前后的对应关系","能列方程求线段长"],"q":"矩形 ABCD 中 AB=5，AD=3，沿 AE 折叠使 B 落在 CD 边上的 F 点，求 CF。","a":"AF=5，DF=4，CF=1","o":"图形与几何","t":"reasoning"},{"i":"cnm_193","n":"变量与常量","b":"J","g":8,"k":"八下","u":"第二十二章","c":"八下 第二十二章 函数 22.1","d":"在变化过程中取不同值的量是变量，取值不变的量是常量。","m":["能指出变化过程中的变量与常量","能举出生活实例"],"q":"圆周长 C=2πr 中变量与常量各是什么？","a":"C、r 是变量，2π 是常量","o":"数与代数","t":"conceptual"},{"i":"cnm_194","n":"函数的概念","b":"J","g":8,"k":"八下","u":"第二十二章","c":"八下 第二十二章 函数 22.1","d":"如果一个变化过程中有两个变量 x、y，对于 x 的每一个确定的值，y 都有唯一确定的值与之对应，那么 y 是 x 的函数。","m":["能判断是否是函数","能说出自变量与因变量"],"q":"y²=x 中 y 是 x 的函数吗？","a":"不是，一个 x（x>0）对应两个 y","o":"数与代数","t":"conceptual"},{"i":"cnm_195","n":"自变量的取值范围","b":"J","g":8,"k":"八下","u":"第二十二章","c":"八下 第二十二章 函数 22.1","d":"根据分母不为 0、被开方数非负及实际意义确定自变量的取值范围。","m":["能求简单函数式的取值范围","会考虑实际意义"],"q":"求 y=√(x+2)+1/(x-1) 中 x 的取值范围。","a":"x≥-2 且 x≠1","o":"数与代数","t":"procedural"},{"i":"cnm_196","n":"函数值","b":"J","g":8,"k":"八下","u":"第二十二章","c":"八下 第二十二章 函数 22.1","d":"给定自变量的值，代入函数关系求对应的函数值。","m":["能正确代入求值","能由函数值反求自变量"],"q":"已知 y=2x²-1，当 x=-3 时 y=？","a":"17","o":"数与代数","t":"procedural"},{"i":"cnm_197","n":"函数的图象","b":"J","g":8,"k":"八下","u":"第二十二章","c":"八下 第二十二章 函数 22.2","d":"用列表、描点、连线画函数图象，并从图象读取信息。","m":["能画简单函数图象","能从图象读出函数值与变化趋势"],"q":"画 y=2x-1 的图象至少需要列出哪些点？","a":"(0,-1)、(1,1)","o":"数与代数","t":"procedural"},{"i":"cnm_198","n":"函数的三种表示方法","b":"J","g":8,"k":"八下","u":"第二十二章","c":"八下 第二十二章 函数 22.2","d":"函数可用解析式、列表、图象表示，了解三者的优缺点与相互转换。","m":["能说出三种表示方法","能在不同表示之间转换"],"q":"举例说明用列表表示函数的优点。","a":"直观看出具体数值，适合离散数据","o":"数与代数","t":"conceptual"},{"i":"cnm_199","n":"用函数刻画实际变化规律","b":"J","g":8,"k":"八下","u":"第二十二章","c":"八下 第二十二章 函数 22.2","d":"把实际问题中的变量关系写成函数解析式并分析其变化。","m":["能写出实际问题的函数关系式","能结合实际确定取值范围"],"q":"弹簧原长 10 cm，每挂 1 kg 伸长 0.5 cm，写出弹簧长度 L 与质量 m 的关系。","a":"L=10+0.5m","o":"数与代数","t":"modeling"},{"i":"cnm_200","n":"正比例函数","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.1","d":"形如 y=kx（k≠0）的函数是正比例函数，图象是过原点的直线。","m":["能判断正比例函数","能求 k 与画图"],"q":"y=kx 过点 (2,6)，k 等于多少？","a":"3","o":"数与代数","t":"conceptual"},{"i":"cnm_201","n":"一次函数的概念","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.1","d":"形如 y=kx+b（k≠0）的函数叫一次函数，正比例函数是 b=0 的特例。","m":["能判断一次函数","能由条件确定参数"],"q":"y=(m-1)x+2 是一次函数，m 应满足什么？","a":"m≠1","o":"数与代数","t":"conceptual"},{"i":"cnm_202","n":"一次函数的图象与画法","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.2","d":"一次函数图象是一条直线，用两点法（常取与坐标轴交点）作图。","m":["能用两点法作图","能求与坐标轴交点"],"q":"求 y=-2x+4 与坐标轴的交点。","a":"(0,4)，(2,0)","o":"数与代数","t":"procedural"},{"i":"cnm_203","n":"一次函数的性质","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.2","d":"k 决定增减性与倾斜方向，b 决定与 y 轴交点，据此判断图象经过的象限。","m":["能由 k、b 判断增减性与象限","能比较函数值大小"],"q":"y=-3x+1 的增减性及经过的象限？","a":"y 随 x 增大而减小；经过一、二、四象限","o":"数与代数","t":"conceptual"},{"i":"cnm_204","n":"一次函数图象的平移","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.2","d":"直线 y=kx+b 向上（下）平移 m 个单位得 y=kx+b±m。","m":["能写出平移后的解析式","能说明平移不改变 k"],"q":"y=2x 向上平移 3 个单位的解析式？","a":"y=2x+3","o":"数与代数","t":"procedural"},{"i":"cnm_205","n":"待定系数法求一次函数解析式","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.2","d":"设 y=kx+b，由两点（或条件）列方程组求出 k、b。","m":["能列方程组求 k、b","能由图象确定解析式"],"q":"一次函数图象过 (0,1) 与 (2,5)，求解析式。","a":"y=2x+1","o":"数与代数","t":"procedural"},{"i":"cnm_206","n":"一次函数与一元一次方程","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.3","d":"方程 kx+b=0 的解就是函数 y=kx+b 的图象与 x 轴交点的横坐标。","m":["能由图象读出方程的解","能说明二者关系"],"q":"一次函数 y=2x-6 与 x 轴交点横坐标与方程 2x-6=0 的解有何关系？","a":"相等，都是 3","o":"数与代数","t":"conceptual"},{"i":"cnm_207","n":"一次函数与一元一次不等式","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.3","d":"不等式 kx+b>0 的解集是图象在 x 轴上方部分对应的 x 的范围。","m":["能由图象写出不等式解集","能数形结合"],"q":"由 y=x-2 的图象，x-2>0 的解集是？","a":"x>2","o":"数与代数","t":"conceptual"},{"i":"cnm_208","n":"一次函数与二元一次方程组","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.3","d":"两个一次函数图象的交点坐标就是对应二元一次方程组的解。","m":["能由交点求方程组的解","能用方程组求交点"],"q":"直线 y=x+1 与 y=-x+3 的交点坐标？","a":"(1,2)","o":"数与代数","t":"conceptual"},{"i":"cnm_209","n":"实际问题与一次函数","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 23.4","d":"建立一次函数模型（含分段函数）解决收费、行程、方案选择等实际问题。","m":["能建立函数关系式","能结合图象与不等式选择方案"],"q":"出租车 3 km 内 10 元，超出每 km 2 元，行驶 x km（x>3）费用 y 的函数式？","a":"y=10+2(x-3)=2x+4","o":"数与代数","t":"modeling"},{"i":"cnm_210","n":"综合与实践：音乐与数学","b":"J","g":8,"k":"八下","u":"第二十三章","c":"八下 第二十三章 一次函数 综合与实践","d":"探究弦长、频率、音高等量之间的数量关系，用函数思想描述音乐中的数学。","m":["能收集弦长与音高数据","能用表格或函数描述关系"],"q":"弦长与频率的乘积为定值，弦长减半时频率怎样变化？","a":"变为原来的 2 倍","o":"综合与实践","t":"modeling"},{"i":"cnm_211","n":"平均数","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.1","d":"理解平均数是反映一组数据集中趋势的统计量，会求算术平均数。","m":["能计算平均数","能说明其含义"],"q":"数据 3、5、7、9、11 的平均数？","a":"7","o":"统计与概率","t":"procedural"},{"i":"cnm_212","n":"加权平均数","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.1","d":"各数据重要程度不同时按权重计算加权平均数。","m":["能识别权并计算","能解释权的作用"],"q":"笔试 80 分占 40%，面试 90 分占 60%，综合成绩？","a":"86 分","o":"统计与概率","t":"procedural"},{"i":"cnm_213","n":"中位数与众数","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.1","d":"中位数是数据排序后居中的数据（偶数个取中间两数的平均），众数是出现次数最多的数据。","m":["能求中位数与众数","能解释含义"],"q":"数据 2、3、3、5、9 的中位数与众数？","a":"3；3","o":"统计与概率","t":"conceptual"},{"i":"cnm_214","n":"集中趋势统计量的选择","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.1","d":"根据数据特点和问题需要选择平均数、中位数或众数描述集中趋势。","m":["能说明三者的适用情形","能结合情境作出选择"],"q":"一组工资数据中有极大值，用平均数还是中位数更合适？","a":"中位数，平均数受极端值影响大","o":"统计与概率","t":"application"},{"i":"cnm_302","n":"用样本平均数估计总体平均数","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.1","d":"总体太大无法全部调查时，用随机抽取的样本的平均数估计总体的平均数。","m":["能计算样本平均数并用它估计总体平均数","能说明样本容量与代表性对估计的影响"],"q":"从一批灯泡中随机抽取 5 只，测得使用寿命（小时）为 1000、1020、980、1010、990，估计这批灯泡的平均寿命。","a":"约 1000 小时","o":"统计与概率","t":"application"},{"i":"cnm_303","n":"极端值对平均数与中位数的影响","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.1","d":"个别特别大或特别小的数据会明显拉动平均数，而中位数基本不受影响，据此判断哪个统计量更能代表一般水平。","m":["能找出一组数据中的极端值并判断它对平均数的影响","能说明何时宜用中位数描述一般水平"],"q":"某公司 5 人月薪（千元）为 8、8、9、10、65，平均数与中位数各是多少？哪个更能代表一般员工的水平？","a":"平均数 20，中位数 9；中位数更能代表一般水平，平均数被 65 拉高","o":"统计与概率","t":"reasoning"},{"i":"cnm_215","n":"极差、方差与标准差","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.2","d":"用极差、方差、标准差刻画数据的离散程度，方差越小数据越稳定。","m":["能计算极差与方差","能比较两组数据的稳定性"],"q":"数据 2、4、6 的极差与方差？","a":"极差 4；方差 8/3","o":"统计与概率","t":"conceptual"},{"i":"cnm_304","n":"用方差比较两组数据的稳定性","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.2","d":"在平均数相同或相近时，通过比较方差（或标准差）判断哪组数据波动更小、更稳定，并据此决策。","m":["能分别算出两组数据的方差并比较大小","能结合情境解释稳定性并作出选择"],"q":"甲、乙两人 5 次射击的环数：甲 7、8、8、8、9；乙 6、8、8、8、10。谁的成绩更稳定？","a":"甲更稳定：两人平均数都是 8，甲方差 0.4 小于乙方差 1.6","o":"统计与概率","t":"application"},{"i":"cnm_306","n":"用样本方差估计总体的稳定性","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.2","d":"用随机抽取样本的方差估计总体数据的波动程度，如比较两批产品尺寸的稳定性。","m":["能计算样本方差并据此估计总体的稳定性","能说明样本容量过小会使估计不可靠"],"q":"从甲、乙两台机器生产的零件中各随机抽取 5 个，测得长度的方差分别为 0.04 和 0.09（mm²），估计哪台机器生产的零件长度更稳定？","a":"甲机器（样本方差更小）","o":"统计与概率","t":"application"},{"i":"cnm_216","n":"数据的四分位数","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.3","d":"把数据分成四等份的三个分点叫四分位数，可用来描述数据的分布范围。","m":["能求四分位数","能解释四分位距"],"q":"数据 1~8，按“两半数据各取中位数”方法求第一、第三四分位数。","a":"2.5 与 6.5","o":"统计与概率","t":"conceptual"},{"i":"cnm_305","n":"箱线图的读取与比较","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.3","d":"用最小值、第一四分位数、中位数、第三四分位数、最大值画成的箱线图，读出数据的中心与分散情况并比较两组数据。（箱线图是否为教材必学内容待核。）","m":["能说出箱线图各部分对应的五个统计量","能由箱线图比较两组数据的中位数与离散程度"],"q":"某箱线图中最小值 40、第一四分位数 55、中位数 60、第三四分位数 70、最大值 90，四分位距是多少？","a":"15","o":"统计与概率","t":"conceptual"},{"i":"cnm_217","n":"数据的分组与由分组数据估计平均数","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 24.4","d":"把数据分组后用组中值估计平均数，体会分组对信息的保留与损失。","m":["能用组中值估计平均数","能说明估计的局限"],"q":"分组数据如何估计平均数？","a":"每组组中值乘该组频数，求和后除以总频数","o":"统计与概率","t":"procedural"},{"i":"cnm_218","n":"综合与实践：学生体质健康调查与分析","b":"J","g":8,"k":"八下","u":"第二十四章","c":"八下 第二十四章 数据的分析 综合与实践","d":"设计调查方案，收集学生体质数据，用统计量与统计图分析并提出建议。","m":["能设计并实施调查","能用适当统计量得出并表述结论"],"q":"怎样比较两个班的体质测试成绩？","a":"用平均数比较整体水平，用方差比较整齐程度","o":"综合与实践","t":"modeling"},{"i":"cnm_219","n":"一元二次方程的概念","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 25.1","d":"只含一个未知数、未知数最高次数为 2 的整式方程叫一元二次方程，一般形式 ax²+bx+c=0（a≠0）。","m":["能判断一元二次方程","能指出二次项系数、一次项系数和常数项"],"q":"x²-5x+6=0 的二次项系数、一次项系数、常数项分别是什么？","a":"1，-5，6","o":"数与代数","t":"conceptual"},{"i":"cnm_220","n":"直接开平方法","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 25.2","d":"形如 x²=p 或 (x+m)²=p 的方程，利用平方根的意义直接求解。","m":["能判断可用直接开平方法","能求出两个根并考虑 p<0 无解"],"q":"解方程 (x-1)²=9。","a":"x=4 或 x=-2","o":"数与代数","t":"procedural"},{"i":"cnm_221","n":"配方法","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 25.2","d":"通过配方把方程化为 (x+m)²=n 的形式再求解，配方时加上一次项系数一半的平方。","m":["能完成配方","能用配方法解方程"],"q":"用配方法解 x²-4x-1=0。","a":"(x-2)²=5，x=2±√5","o":"数与代数","t":"procedural"},{"i":"cnm_222","n":"公式法与求根公式","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 25.2","d":"由配方法推出求根公式 x=(-b±√(b²-4ac))/(2a)（b²-4ac≥0），并用其解方程。","m":["能写出求根公式","能正确代入求解并化简"],"q":"用公式法解 2x²-3x-2=0。","a":"x=(3±5)/4，即 x=2 或 x=-1/2","o":"数与代数","t":"procedural"},{"i":"cnm_223","n":"根的判别式","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 25.2","d":"Δ=b²-4ac 决定根的情况：Δ>0 两个不等实根，Δ=0 两个相等实根，Δ<0 无实根。","m":["能由 Δ 判断根的个数","能求参数范围"],"q":"x²-4x+k=0 有两个不相等实根，求 k 的范围。","a":"k<4","o":"数与代数","t":"conceptual"},{"i":"cnm_224","n":"因式分解法","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 25.2","d":"把方程一边化为 0，另一边分解成一次因式的积，利用“若 ab=0 则 a=0 或 b=0”求解。","m":["能先移项再因式分解","能求出两个根"],"q":"解方程 x²-5x+6=0。","a":"x=2 或 x=3","o":"数与代数","t":"procedural"},{"i":"cnm_225","n":"一元二次方程解法的选择","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 25.2","d":"根据方程特点灵活选用直接开平方、因式分解、配方、公式法。","m":["能说明选用方法的理由","能高效求解"],"q":"解方程 3x²=6x，选用什么方法？","a":"因式分解法：3x(x-2)=0，x=0 或 2","o":"数与代数","t":"procedural"},{"i":"cnm_227","n":"增长率与传播问题","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 25.3","d":"用一元二次方程解决平均增长（降低）率、传播扩散等问题，注意检验根的合理性。","m":["能列出 a(1+x)²=b 型方程","能舍去不合题意的根"],"q":"月产量两个月从 100 增长到 144，月平均增长率是多少？","a":"100(1+x)²=144，x=20%","o":"数与代数","t":"modeling"},{"i":"cnm_228","n":"面积与销售利润问题","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 25.3","d":"用一元二次方程解决围图形面积、商品销售利润等问题。","m":["能画图并找等量关系","能检验解是否符合实际"],"q":"长方形周长 20 cm，面积 24 cm²，求长与宽。","a":"设长 x，x(10-x)=24，长 6 cm，宽 4 cm","o":"数与代数","t":"modeling"},{"i":"cnm_226","n":"一元二次方程根与系数的关系（拓展）","b":"J","g":9,"k":"九上","u":"第二十五章","c":"九上 第二十五章 一元二次方程 拓展","d":"若 x₁、x₂ 是 ax²+bx+c=0 的两根，则 x₁+x₂=-b/a，x₁x₂=c/a（课标仅要求“了解”，见例67）。","m":["能由求根公式推出关系","能用于求对称式的值"],"q":"x²-5x+6=0 两根之和与积分别是多少？","a":"5；6","o":"数与代数","t":"reasoning"},{"i":"cnm_229","n":"二次函数的概念","b":"J","g":9,"k":"九上","u":"第二十六章","c":"九上 第二十六章 二次函数 26.1","d":"形如 y=ax²+bx+c（a≠0）的函数叫二次函数。","m":["能判断二次函数","能由条件确定参数范围"],"q":"y=(m-2)x²+3x-1 是二次函数，m 满足什么？","a":"m≠2","o":"数与代数","t":"conceptual"},{"i":"cnm_230","n":"y=ax² 的图象与性质","b":"J","g":9,"k":"九上","u":"第二十六章","c":"九上 第二十六章 二次函数 26.2","d":"抛物线 y=ax² 顶点在原点，对称轴为 y 轴，a 的符号决定开口方向，|a| 决定开口大小。","m":["能画图并说出开口、顶点、对称轴","能比较函数值大小"],"q":"说明 y=-2x² 的开口方向、顶点、对称轴。","a":"开口向下，顶点 (0,0)，对称轴 y 轴","o":"数与代数","t":"conceptual"},{"i":"cnm_231","n":"y=a(x-h)²+k 的图象与平移","b":"J","g":9,"k":"九上","u":"第二十六章","c":"九上 第二十六章 二次函数 26.2","d":"抛物线 y=a(x-h)²+k 的顶点为 (h,k)，对称轴为 x=h，可由 y=ax² 平移得到。","m":["能写出顶点与对称轴","能说出平移方式"],"q":"y=(x-1)²+2 的顶点、对称轴及相对 y=x² 的平移？","a":"顶点 (1,2)，对 1","n":"平行投影与中心投影","b":"J","g":9,"k":"九下","u":"第三十三章","c":"九下 第三十三章 投影与视图","d":"认识光线形成的平行投影与中心投影，知道其区别并用于判断影子。","m":["能区分两类投影","能画出简单物体的影子"],"q":"平行投影与中心投影的光线有何区别？","a":"平行投影光线平行，中心投影光线交于一点","o":"图形与几何","t":"conceptual"},{"i":"cnm_282","n":"正投影","b":"J","g":9,"k":"九下","u":"第三十三章","c":"九下 第三十三章 投影与视图","d":"投影线垂直于投影面的平行投影叫正投影，会求简单图形的正投影。","m":["能说明正投影的条件","能画出线段、平面图形的正投影"],"q":"投影线垂直于投影面的投影叫什么？","a":"正投影","o":"图形与几何","t":"conceptual"},{"i":"cnm_283","n":"三视图及由三视图想象立体图形","b":"J","g":9,"k":"九下","u":"第三十三章","c":"九下 第三十三章 投影与视图","d":"画出简单立体图形的主视图、左视图、俯视图，并能由三视图想象出立体图形。","m":["能画简单几何体的三视图","能由三视图还原几何体"],"q":"圆柱的三视图各是什么形状？","a":"主视图、左视图为矩形，俯视图为圆","o":"图形与几何","t":"conceptual"},{"i":"cnm_291","n":"综合与实践：建筑中的数学","b":"J","g":9,"k":"九下","u":"第三十三章","c":"九下 第三十三章 投影与视图 综合与实践","d":"以教材章末综合与实践的主题名建模（具体活动内容未核实）：从三视图、比例与对称等角度分析建筑的数学特征，并按比例读图或绘图。","m":["能由建筑的三视图想象并描述建筑的形状","能按给定比例在图纸与实物之间换算尺寸"],"q":"某建筑模型按 1∶100 的比例制作，模型高 0.35 m，则实际建筑高多少 m？","a":"35 m","o":"综合与实践","t":"modeling"},{"i":"cnm_284","n":"随机事件、必然事件与不可能事件","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.1.1","d":"区分随机事件、必然事件和不可能事件。","m":["能判断事件类别","能举出各类事件的例子"],"q":"掷一枚普通骰子，点数是 7 是什么事件？","a":"不可能事件","o":"统计与概率","t":"conceptual"},{"i":"cnm_307","n":"事件发生可能性大小的比较与排序","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.1.1","d":"对随机事件按发生的可能性大小排序，知道可能性大小与事件包含的有利结果多少有关。","m":["能比较两个随机事件发生可能性的大小","能把若干事件按可能性大小排序"],"q":"袋中有 5 个红球、3 个白球、2 个黄球（形状相同），随机摸一个，摸到红、白、黄球的可能性由大到小怎样排列？","a":"红球＞白球＞黄球","o":"统计与概率","t":"conceptual"},{"i":"cnm_285","n":"概率的意义与等可能事件的概率","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.1.2","d":"概率是衡量随机事件发生可能性大小的数，等可能事件的概率等于所求结果数除以总结果数。","m":["能说出概率的取值范围","能计算简单的等可能事件概率"],"q":"袋中 3 红 2 白，摸出红球的概率？","a":"3/5","o":"统计与概率","t":"conceptual"},{"i":"cnm_308","n":"概率的取值范围与概率的性质","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.1.2","d":"概率满足 0≤P≤1：必然事件的概率为 1，不可能事件的概率为 0，随机事件的概率在 0 与 1 之间。","m":["能说出三类事件概率的取值","能判断某个数能否作为概率"],"q":"下列数值中哪些不可能是某事件的概率：0.3、1.2、−0.1、1、0？","a":"1.2 和 −0.1","o":"统计与概率","t":"conceptual"},{"i":"cnm_309","n":"等可能性与古典概型的判断","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.1.2","d":"判断一次试验的所有结果是否有限且发生的可能性相等，只有满足这两点才能用 P=m/n 计算概率。","m":["能判断试验结果是否有限且等可能","能说明不等可能时不能直接套用公式"],"q":"抛一枚不均匀的骰子，能否用 1/6 作为出现 6 点的概率？为什么？","a":"不能，各点数出现的可能性不相等，不满足等可能","o":"统计与概率","t":"reasoning"},{"i":"cnm_286","n":"用列举法求概率","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.2","d":"列出所有等可能结果，数出符合条件的结果数求概率。","m":["能列出所有等可能结果","能求概率"],"q":"掷一枚骰子，点数为偶数的概率？","a":"1/2","o":"统计与概率","t":"procedural"},{"i":"cnm_287","n":"用列表法与树状图求概率","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.2","d":"对两步试验用列表法或树状图列出所有结果，求事件的概率。","m":["能画树状图或列表","能判断何时用何方法"],"q":"掷两枚硬币，两枚都是正面的概率？","a":"1/4","o":"统计与概率","t":"procedural"},{"i":"cnm_289","n":"概率的应用与游戏的公平性","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.2","d":"用概率判断游戏是否公平并进行决策。","m":["能计算双方获胜概率","能判断游戏的公平性"],"q":"两人各掷一枚骰子，点数和为偶数甲胜，奇数乙胜，公平吗？","a":"公平，各 1/2","o":"统计与概率","t":"application"},{"i":"cnm_310","n":"放回与不放回摸球问题的区分","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.2","d":"摸球试验中，放回时每次的结果总数不变，不放回时第二次的结果总数减少，需据此列出全部结果。","m":["能判断题目是放回还是不放回","能分别列出两种情形的全部等可能结果并求概率"],"q":"袋中有 2 红 1 白共 3 个球，连续摸两次，两次都是红球的概率：(1) 放回；(2) 不放回？","a":"(1) 4/9；(2) 1/3","o":"统计与概率","t":"procedural"},{"i":"cnm_311","n":"三步及以上试验用树状图求概率","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.2","d":"试验有三步或更多步时，用树状图逐步分支列出全部结果，再数出所求事件的结果个数。","m":["能画出三步试验的树状图并写出全部结果","能由树状图求事件的概率"],"q":"连续抛三枚均匀硬币，恰好两枚正面朝上的概率是多少？","a":"3/8","o":"统计与概率","t":"procedural"},{"i":"cnm_313","n":"概率与统计图表综合问题","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.2","d":"从条形图、扇形图或统计表中读取各类数据的数量，再按等可能计算随机抽取一个个体属于某类的概率。","m":["能从统计图表中提取各类个体的数量","能据此计算随机抽取一个个体属于某类的概率"],"q":"某班血型统计：A 型 20 人、B 型 15 人、O 型 10 人、AB 型 5 人。随机抽一名同学，是 O 型的概率是多少？","a":"1/5","o":"统计与概率","t":"application"},{"i":"cnm_288","n":"用频率估计概率","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.3","d":"大量重复试验中，事件发生的频率稳定于概率，可用频率估计概率。","m":["能说明频率与概率的区别","能由试验数据估计概率"],"q":"抛硬币 1000 次，正面 505 次，估计正面概率？","a":"约 0.5","o":"统计与概率","t":"conceptual"},{"i":"cnm_312","n":"用频率估计合格率、发芽率等实际概率","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.3","d":"在产品抽检、种子发芽等无法列举结果的情形中，用大量重复试验的频率估计概率，并用估计值预测总体。","m":["能由试验数据估计发芽率或合格率","能用估计的概率预测总体中的数量"],"q":"某种子发芽试验中，种子数很大时发芽的频率稳定在 0.95 左右。估计这种种子的发芽概率，并估计 2000 粒种子大约有多少粒发芽。","a":"概率约 0.95；约 1900 粒","o":"统计与概率","t":"application"},{"i":"cnm_314","n":"对概率意义的常见误解辨析","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 34.3","d":"辨析“概率是 0.5 就是每两次必有一次”“前几次都是反面下次一定是正面”等误解，理解概率反映的是大量重复试验中频率稳定的趋势。","m":["能指出对概率意义的常见误解","能用频率的稳定性解释概率的含义"],"q":"抛一枚均匀硬币，已连续 5 次正面朝上，第 6 次正面朝上的概率是多少？","a":"仍是 1/2，每次抛掷相互独立，之前的结果不改变概率","o":"统计与概率","t":"reasoning"},{"i":"cnm_315","n":"综合与实践：用随机试验检验游戏的公平性（补充课题）","b":"J","g":9,"k":"九下","u":"第三十四章","c":"九下 第三十四章 随机事件的概率 综合应用（补充课题，非已核实的教材栏目）","d":"设计一个两人转盘或摸球游戏，用列表法、树状图算出双方获胜的概率，再用多次试验的频率检验游戏是否公平。本条为补充课题，非已核实的教材栏目，供教师取舍。","m":["能设计规则使双方获胜的概率相等并用概率说明","能用试验频率检验理论概率并解释误差"],"q":"设计一个转盘游戏使两人获胜的概率相等，并说明如何用试验检验。","a":"转盘 8 等分，4 份甲得分、4 份乙得分，双方概率均为 1/2；转 100 次，若两人获胜频率都接近 0.5 则基本公平","o":"综合与实践","t":"modeling"},{"i":"cnm_h001","n":"集合的含义","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.1","d":"知道集合由确定的对象组成，这些对象叫做元素。","m":["能判断一组对象能不能组成集合","能说出元素和集合的区别"],"q":"下面哪一组对象可以组成集合？","a":"全体正整数","o":"数与代数","t":"conceptual"},{"i":"cnm_h002","n":"元素与集合的关系","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.1","d":"会用属于、不属于表示元素和集合的关系，并知道同一集合里元素不重复。","m":["能判断一个对象是否属于给定集合","能正确使用属于符号"],"q":"集合 {0，2，4，6} 中的偶数个数是多少？","a":"4","o":"数与代数","t":"conceptual"},{"i":"cnm_h003","n":"列举法","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.1","d":"能用列举法表示有限集合，并会数出元素个数。","m":["能把符合条件的有限元素一一列出","知道列举时不计顺序、不重复"],"q":"用列举法写出小于 6 的正整数，元素有几个？","a":"5","o":"数与代数","t":"procedural"},{"i":"cnm_h004","n":"描述法","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.1","d":"能用描述法表示集合，并会在列举法和描述法之间选择。","m":["能读懂 {x | 条件} 的含义","能把简单的描述法改写成列举法"],"q":"集合 {x | x 是小于 4 的正整数} 有几个元素？","a":"3","o":"数与代数","t":"conceptual"},{"i":"cnm_h005","n":"常用数集","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.2","d":"认识自然数集、整数集、有理数集、实数集及其包含关系。本图谱按人教 A 版把 0 算进自然数集。","m":["能判断一个数属于哪个常用数集","能说出 N、Z、Q、R 的包含关系"],"q":"按本图谱约定，自然数集含 0。集合 {−1，0，1，2} 中的自然数有几个？","a":"3","o":"数与代数","t":"conceptual"},{"i":"cnm_h006","n":"子集与集合相等","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.2","d":"能判断子集和集合相等，知道空集是任何集合的子集。","m":["能用定义判断 A 是否为 B 的子集","知道 A=B 就是互相包含"],"q":"集合 {1，2} 的子集共有多少个？","a":"4","o":"数与代数","t":"conceptual"},{"i":"cnm_h007","n":"真子集","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.2","d":"知道真子集是不等于自身的子集，会计算有限集的真子集个数。","m":["能区分子集和真子集","能计算 n 元集合的真子集个数"],"q":"3 个元素的集合有多少个真子集？","a":"7","o":"数与代数","t":"procedural"},{"i":"cnm_h008","n":"交集","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.3","d":"会求两个集合的交集，并知道交集里的元素同时属于两个集合。","m":["能列出两个有限集的公共元素","能说明 A∩B 与 A、B 的包含关系"],"q":"A={1，2，3，4}，B={3，4，5}，A 与 B 的交集有几个元素？","a":"2","o":"数与代数","t":"procedural"},{"i":"cnm_h009","n":"并集","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.3","d":"会求两个集合的并集，并用 |A|+|B|−|A∩B| 计算有限并集的元素个数。","m":["能列出两个有限集的并集","能用容斥计算并集的元素个数"],"q":"A 有 3 个元素，B 有 3 个元素，交集有 2 个元素。并集有几个元素？","a":"4","o":"数与代数","t":"procedural"},{"i":"cnm_h010","n":"补集","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.3","d":"在给定全集中会求补集，知道补集与原集合没有公共元素、并且合并后是全集。","m":["能在有限全集中列出补集","能用全集个数减去集合个数求补集个数"],"q":"全集有 5 个元素，A 有 2 个元素。A 的补集有几个元素？","a":"3","o":"数与代数","t":"procedural"},{"i":"cnm_h011","n":"交并补的混合运算","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.3","d":"能在具体的有限全集中完成交、并、补的混合运算。","m":["能按括号顺序求混合运算的结果","能用元素个数检验结果"],"q":"全集 8 个元素，A 有 5 个，B 有 4 个，A∩B 有 2 个。A∪B 有几个元素？","a":"7","o":"数与代数","t":"procedural"},{"i":"cnm_h012","n":"充分条件与必要条件","b":"H","g":10,"k":"必修一","u":"第一章","c":"高一 第一章 集合与常用逻辑用语 1.4","d":"能判断 p 是 q 的充分条件、必要条件，还是两者都不是。","m":["能把「若 p 则 q」说成 p 是 q 的充分条件","能举出只充分或只必要的例子"],"q":"对实数 x，「x>2」是「x>0」的什么条件？","a":"充分不必要条件","o":"数与代数","t":"reasoning"},{"i":"
