function renderArt(v,p=0,reveal=false,practice=false){if(v.kind.startsWith("unique_"))return specialCh4(v,cl(p));p=cl(p);let t=ease(p),s='',k=v.kind,add=x=>s+=x;const cols=['#67b6c5','#e8b67a','#9bc78d','#b39ad9'],hues=['#1b3645','#423d30','#244238','#362d4a'];const tx=(x,y,q,c=white,z=15)=>text(x,y,q,c,Math.min(z,Math.max(9,Math.floor(310/Math.max(1,String(q).length)))));const box=(x,y,q,c=dim,w=65,h=34)=>R(x-w/2,y-h/2,w,h,c,5)+tx(x,y+5,q,white,Math.min(17,Math.max(9,(w-7)/Math.max(1,String(q).length)*1.5)));const f=(i,n)=>cl(t*n-i);const cap=q=>add(tx(180,228,q,gold,13));const colors=(i)=>cols[i%4];const line=(x,y,X,Y,c=gold,w=2)=>ln(x,y,X,Y,c,w);const shape=(x,y,d,c)=>path(`M${x} ${y}l${d} ${-d*.52}l${d} ${d*.52}l${-d} ${d*.52}Z`,c,1,c)+path(`M${x} ${y}v${d}l${d} ${d*.52}v${-d}Z`,c,1,'#486373')+path(`M${x+d} ${y+d*.52}l${d} ${-d*.52}v${d}l${-d} ${d*.52}Z`,c,1,'#315262');
if(k==='challenge'){let q=v.expr,mode=v.mode||'tokens',arr=v.parts||[q];const prompt=()=>{let w=String(q);let lines=w.length>29?[w.slice(0,29),w.slice(29)]:[w];lines.forEach((a,i)=>add(tx(180,26+i*15,a,white,13)))};prompt();
if(mode==='tiles'||mode==='factors'){let n=arr.length,w=320/Math.max(n,1);arr.forEach((a,i)=>{let x=20+(i+.5)*w;add(box(x,mix(115,95,f(i,n)),a,hues[i%4],w-6,47))});if(mode==='factors')add(tx(180,173,'辨认数字因数、字母、指数',blue,13));else add(tx(180,173,'每个带符号的项都完整保留',blue,13))}

 function power(){let a=atom();if(ts[at]==='^'){at++;let n=+ts[at++];if(!Number.isInteger(n)||n<0||n>6)throw Error('power');let r=rational(U);for(let k=0;k<n;k++)r=product(r,a);a=r}return a}

 function term(){let a=unary();while(at<ts.length){let t=ts[at];if(t==='*'||t==='/'){at++;let b=unary();a=t==='*'?product(a,b):div(a,b)}else if(t==='('||/^[A-Za-zπ]$/.test(t)||/^\d/.test(t)){a=product(a,unary())}else break}return a}
 function sum(){let a=term();while(ts[at]==='+'||ts[at]==='-'){let t=ts[at++];a=add(a,term(),t==='+'?1:-1)}return a}
 try{let r=sum();if(at!==ts.length)return null;return {r,mul,plus}}catch{return null}}
function equal(a,b){let x=normalize(a),y=normalize(b);if(!x)return false;if(x===y)return true;if(/^[A-Z]{2,}$/i.test(x)&&/^[A-Z]{2,}$/i.test(y)&&x.toUpperCase()===y.toUpperCase()&&y.toUpperCase()==='MATH')return true;
 let A=polyExpr(x),B=polyExpr(y);if(!A||!B)return false;try{let P=A.r,Q=B.r;let pn=[...P.d.entries()],qn=[...Q.d.entries()];if(pn.length!==qn.length)return false;let f=pn[0][1]/(Q.d.get(pn[0][0])||NaN);if(!Number.isFinite(f)||pn.some(([k,v])=>!Q.d.has(k)||Math.abs(v-f*Q.d.get(k))>1e-8*Math.max(1,Math.abs(v))))return false;return A.plus(A.mul(P.n,Q.d),A.mul(Q.n,P.d),-1).size===0}catch{return false}}

function reveal(b){stop();ready=true;unlocked=true;$('scene').innerHTML=renderArt(b.v,1,true);$('feedback').className='feedback good';$('feedback').textContent='老师演算：'+b.ans[0];$('next').disabled=false;$('submit').disabled=false;teacherLine(b.b+' 所以，'+b.q+'，结果是 '+b.ans[0]+'。');speech(b.b+'。结果是 '+b.ans[0]+'。',()=>{})}
function wireKeys(){root.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let el=$('ans');if(!el)return;let s=el.selectionStart??el.value.length,e=el.selectionEnd??s;el.value=el.value.slice(0,s)+b.dataset.key+el.value.slice(e);el.focus();el.setSelectionRange(s+b.dataset.key.length,s+b.dataset.key.length)})}
function keys(){return `<details class="keydetails"><summary>数学符号键盘（可选）</summary><div class="formula-key">${['+','−','×','/','(',')','²','³','π','%','=','a','b','c','d','h','r','R','x','y','z','n','m','v','t','s','T'].map(k=>`<button data-key="${k}">${k}</button>`).join('')}</div></details>`}

function lesson(play=false){stop();stage='lesson';ready=true;unlocked=false;let l=D[idx],r=l.routes[route],b=current();$('head').textContent=l.sec+' · '+l.title;root.innerHTML=`<div class="headline"><span class="chip">${l.related?"探究":"思路"} ${route+1}/2 · ${esc(r.name)}</span><span class="muted">${step+1}/${r.steps.length}</span></div><div class="progress"><i style="width:${100*(step+1)/r.steps.length}%"></i></div><details class="problem" ${step===0?'open':''}><summary>查看完整题目</summary>${esc(l.problem)}</details><div class="row"><button id="teach" class="${mode==='teacher'?'active':''}">老师带我做</button><button id="together" class="${mode==='together'?'active':''}">一起算</button><button id="ind">独立挑战</button></div><div id="scene" class="scene">${renderArt(b.v,0)}</div><div class="teacher"><img src="${portrait.base}" alt="林老师"><div><strong>林老师</strong><p class="no" id="narr">${esc(b.a)}</p></div></div><div class="query">${esc(b.q)}</div><div class="answer"><input id="ans" placeholder="写出你的答案" autocomplete="off"/><button id="submit" class="primary">检查</button></div>${keys()}<div id="feedback" class="feedback" aria-live="polite"></div><div class="help"><button id="replay">重听重看</button><button id="pause">停下来</button><button id="scratch">打草稿</button><button id="hint">老师演算</button></div><div class="row"><button id="prev" ${step===0&&route===0?'disabled':''}>上一步</button><button id="next" class="primary" disabled>${step===r.steps.length-1?(route===0?(l.related?'继续相关探究':'看看另一种思路'):'对比与挑战'):'继续'}</button></div>`;wireKeys();$('submit').onclick=()=>{if(!ready)return;let value=$('ans').value;if(b.ans.some(x=>equal(value,x))){unlocked=true;$('feedback').className='feedback good';$('feedback').textContent='正确。'+b.ans[0];$('next').disabled=false;$('scene').innerHTML=renderArt(b.v,1,true);say('正确！你可以继续。')}else{$('feedback').className='feedback bad';$('feedback').textContent=value?('再检查：'+b.q+'。'+(b.v.kind==='fraction'?'分子、分母不能颠倒。':b.v.kind==='axis'?'注意起点和运动方向。':b.v.kind==='network'?'同一对球队不能算两场。':b.v.kind==='grid'?'按行或列分组计数。':b.v.kind==='tanks'?'先找体积与底面积的关系。':'把已知量和要求的量分开，再列式。')):'先写下答案，或请老师演算。';say('先检查现在这一步，不着急。')}};$('ans').onkeydown=e=>{if(e.key==='Enter')$('submit').click()};$('teach').onclick=()=>{mode='teacher';animateBeat(b,true)};$('together').onclick=()=>{mode='together';animateBeat(b)};$('ind').onclick=()=>{exercise=0;practice(true)};$('replay').onclick=()=>animateBeat(b);$('pause').onclick=()=>{stop();ready=true;$('submit').disabled=false;$('feedback').textContent='暂停了，慢慢计算。'};$('scratch').onclick=scratch;$('hint').onclick=()=>reveal(b);$('prev').onclick=()=>{if(step>0){step--;lesson(true)}else if(route>0){route--;step=D[idx].routes[route].steps.length-1;lesson(true)}};$('next').onclick=()=>{if(!unlocked)return;if(step+1<r.steps.length){step++;lesson(true)}else if(route===0){seen[0]=true;transition()}else{seen[1]=true;compare()}};if(play)animateBeat(b)}
function transition(){stop();stage='transition';let l=D[idx],s=l.related?'峰玮，刚才我们研究了'+l.routes[0].name+'。接下来从同一知识主题的另一个问题继续：'+l.routes[1].name+'。':'峰玮，刚才我们用'+l.routes[0].name+'。还有一种观察方法：'+l.routes[1].name+'。换个角度看看，同一个数学关系会变得更清楚。';root.innerHTML=`<div class="routeintro"><div class="center"><img src="${portrait.base}" alt="林老师"></div><h2>${l.related?"继续相关探究":"换一个角度"}</h2><p>${esc(s)}</p><div class="scene">${renderArt(l.routes[1].steps[0].v,0)}</div><div class="row"><button id="replay">重听</button><button class="primary" id="go">${l.related?"继续探究":"看第二种思路"}</button></div><button id="skip">先独立挑战</button></div>`;$('go').onclick=()=>{route=1;step=0;lesson(true)};$('skip').onclick=()=>{exercise=0;practice(true)};$('replay').onclick=()=>say(s);say(s)}
function compare(){stop();stage='compare';let l=D[idx],s='本主题的两条学习路线分别是'+l.routes[0].name+'和'+l.routes[1].name+'。你可以重看任意一种，然后用新条件自己试。';root.innerHTML=`<h2>${l.related?"关联知识 · 对照复盘":"两种思路 · 对照复盘"}</h2><div class="problem">${esc(l.problem)}</div>${l.routes.map((r,i)=>`<div class="routeintro"><b>${esc(r.name)}</b><p>${r.steps.map(b=>esc(b.b)).join(' → ')}</p><div class="scene">${renderArt(r.steps.at(-1).v,1,true)}</div><button data-r="${i}">重看这条思路</button></div>`).join('')}<div class="row"><button class="primary" id="go">独立迁移 · 5题</button></div>`;root.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{route=+b.dataset.r;step=0;lesson(true)});$('go').onclick=()=>{exercise=0;practice(true)};say(s)}
function practice(play=false){stop();stage='practice';ready=true;unlocked=false;let l=D[idx],b=l.practice[exercise];$('head').textContent='独立挑战 · '+l.title;root.innerHTML=`<div class="headline"><span class="chip">新条件 · 独立挑战</span><span class="muted">${exercise+1}/${l.practice.length}</span></div><div class="progress"><i style="width:${100*(exercise+1)/l.practice.length}%"></i></div><div class="problem">${esc(b.q)}</div><div class="scene" id="scene">${renderArt(b.v,0,false,true)}</div><div class="teacher"><img src="${portrait.base}" alt="林老师"><div><strong>林老师</strong><p id="narr" class="no">先自己列式，可以随时打草稿，不限时间。</p></div></div><div class="answer"><input id="ans" placeholder="写答案" autocomplete="off"><button id="submit" class="primary">验证</button></div>${keys()}<div id="feedback" class="feedback" aria-live="polite"></div><div class="help"><button id="scratch">打草稿</button><button id="hint">查看解析</button><button id="replay">再读题</button><button id="observe">观察图形</button><button id="back">返回课堂</button></div><div class="row"><button id="next" class="primary" disabled>${exercise===l.practice.length-1?'完成本主题':'下一题'}</button></div>`;wireKeys();let shown=false;let complete=(independent)=>{unlocked=true;$('scene').innerHTML=renderArt(b.v,1,true,true);$('feedback').className='feedback good';$('feedback').textContent=(independent?'正确！':'参考解析：')+b.why;$('next').disabled=false;if(independent&&!shown){progress[idx+':'+exercise]=true;save()} say(b.why)};$('submit').onclick=()=>{if(b.ans.some(x=>equal($('ans').value,x)))complete(true);else{$('feedback').className='feedback bad';$('feedback').textContent='结果还不对。请检查列式和运算顺序。';say('再检查一下你的草稿。')}};$('ans').onkeydown=e=>{if(e.key==='Enter')$('submit').click()};$('hint').onclick=()=>{shown=true;complete(false)};$('scratch').onclick=scratch;$('replay').onclick=()=>say(b.q);$('observe').onclick=()=>{stop();let id=token,start=performance.now();function f(now){if(id!==token)return;let p=cl((now-start)/1800);$('scene').innerHTML=renderArt(b.v,p,false,true);if(p<1)raf=requestAnimationFrame(f)}raf=requestAnimationFrame(f)};$('back').onclick=()=>lesson(true);$('next').onclick=()=>{if(!unlocked)return;if(exercise+1<l.practice.length){exercise++;practice(true)}else{progress[idx]=l.practice.length;save();home();say('这一组练习完成了。你可以继续探索其他主题。')}};if(play)say(b.q)}
function scratch(){stop();let key=[idx,stage,route,step,exercise].join('-'),d=drafts[key]||{strokes:[],note:''},m=document.createElement('div');m.className='overlay';m.innerHTML='<div class="scratch"><h2>数学草稿板</h2><p class="muted">可以用手指写算式，也可以输入。草稿在当前学习会话内保留。</p><canvas width="600" height="460"></canvas><textarea placeholder="输入算式"></textarea><div class="row"><button>撤销</button><button>清空</button><button class="primary">返回</button></div></div>';document.body.append(m);let c=m.querySelector('canvas'),ctx=c.getContext('2d'),ta=m.querySelector('textarea'),active=null;ta.value=d.note;ctx.lineWidth=4;ctx.strokeStyle='#273842';ctx.lineCap='round';ctx.lineJoin='round';function draw(){ctx.clearRect(0,0,c.width,c.height);d.strokes.forEach(s=>{ctx.beginPath();s.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(s.length===1){ctx.lineTo(s[0][0]+.01,s[0][1]+.01)}ctx.stroke()})}function point(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);active=[point(e)];d.strokes.push(active);draw()};c.onpointermove=e=>{if(active){active.push(point(e));draw()}};c.onpointerup=c.onpointercancel=()=>active=null;let bs=m.querySelectorAll('button');bs[0].onclick=()=>{d.strokes.pop();draw()};bs[1].onclick=()=>{d.strokes=[];ta.value='';draw()};bs[2].onclick=()=>{d.note=ta.value;drafts[key]=d;m.remove();if(stage==='lesson'){ready=true;$('submit').disabled=false;$('feedback').textContent='草稿已保留，可以继续计算。'}};draw()}
$('home').onclick=home;$('voice').onclick=()=>{muted=!muted;stop();$('voice').textContent=muted?'语音 关':'语音 开';if(stage==='lesson'){ready=true;$('submit').disabled=false;$('feedback').textContent='可以继续计算，或重听重看。'}};document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(stage==='lesson'){ready=true;if($('submit'))$('submit').disabled=false;}}});window.CH3_AUDIT={data:D,renderArt,equal,open:(i,r=0,s=0)=>{idx=i;route=r;step=s;lesson(false)},practice:(i,j)=>{idx=i;exercise=j;practice(false)}};home();
