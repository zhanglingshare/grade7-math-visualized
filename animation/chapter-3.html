function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function exNorm(s){s=String(s);
 return s.replace(/[−－–—]/g,'-').replace(/＋/g,'+').replace(/[０-９ａ-ｚＡ-Ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/（/g,'(').replace(/）/g,')').replace(/[．。]/g,'.').replace(/／/g,'/')
  .replace(/[×*＊·•]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\s+/g,'').toLowerCase();}
function exTok(s){const re=/\d+(?:\.\d+)?|\.\d+|[a-z]|[-+*/^()]/y;const out=[];re.lastIndex=0;while(re.lastIndex<s.length){const i=re.lastIndex;const m=re.exec(s);if(!m||m.index!==i)return null;out.push(m[0]);}return out;}

 const isConst=b=>b&&(b[0]==='n'||(b[0]==='neg'&&isConst(b[1])));
 function expr(){let a=term();while(peek()==='+'||peek()==='-'){const op=tk[i++];const b=term();a=[op,a,b];}return a;}
 function term(){let a=factor();for(;;){const t=peek();if(t==='*'||t==='/'){i++;const b=factor();a=[t,a,b];}else if(isNum(t)||isVar(t)||t==='('){const prev=tk[i-1];if(isNum(t)&&(isVar(prev)||prev===')'))fl.numAfter=true;if(isVar(t)&&t===prev)fl.rep=true;const b=factor();if(isConst(b)&&(isVar(prev)||prev===')'))fl.numAfter=true;a=['*',a,b];}else break;}return a;}
 function factor(){const t=peek();if(t==='-'){i++;return ['neg',factor()];}if(t==='+'){i++;return factor();}return power();}
 function power(){const start=i;let a=atom();if(a&&a[0]==='n'&&a[1]===1&&(isVar(peek())||peek()==='(')){const pv=tk[start-1];if(pv==null||pv==='+'||pv==='-'||pv==='(')fl.one=true;}

function exEval(a,env){switch(a[0]){case 'n':return a[1];case 'v':return env[a[1]];case 'neg':return -exEval(a[1],env);case '+':return exEval(a[1],env)+exEval(a[2],env);case '-':return exEval(a[1],env)-exEval(a[2],env);case '*':return exEval(a[1],env)*exEval(a[2],env);case '/':return exEval(a[1],env)/exEval(a[2],env);case '^':return Math.pow(exEval(a[1],env),exEval(a[2],env));}return NaN;}
function exVars(q){if(q.vars)return q.vars;const p=exParse(q.ex);return p?[...p.vars].sort():[];}
// Compare rational expressions exactly and keep their original domain restrictions.
function exSame(p1,p2){

const DXUI={};
DXUI.run=function(card,ctx,cb){
 const tags=(DX.TAG[ctx.lid]||[])[ctx.qi];if(!tags){cb&&cb(null);return;}const ts=tags.split(',').map(full);
 const box=H(`<div class="dxbox"><div class="step"><i>🔎</i>诊断 <span style="font-weight:500;font-size:13px;color:var(--muted)">先用一道追问看看卡在哪一步</span></div><div class="dxlog"></div></div>`);card.appendChild(box);const log=$('.dxlog',box);
 const ask=(it,meta)=>askUI(log,it,meta);
 const say=(k,r)=>new Promise(res=>{if(k==='diag'){const d=H(`<div class="dxres"><div class="dxh">诊断结果</div><p class="dxt">${r.text}</p>${r.root&&r.root!==r.main?`<p class="muted2">建议先补：<b>${T(r.root).nm}</b></p>`:''}</div>`);log.appendChild(d);setTimeout(res,300);}
  else{const id=r.root||r.main;const t=T(id);const d=H(`<div class="dxfix"><div class="dxh">🩹 先补「${t.nm}」</div><p>${t.h}</p><div class="row">${linkBtn(id)}<button class="btn dxgo">我看懂了，再试一题 →</button></div></div>`);log.appendChild(d);const review=$('a.dxlk',d);if(review){review.removeAttribute('target');review.onclick=e=>{e.preventDefault();openReview(review.getAttribute('href'),review.textContent);};}$('.dxgo',d).onclick=()=>{$('.dxgo',d).remove();res();};}});
 DX.diagnose({main:ts[0],subs:ts.slice(1),P:DX.DP[ctx.lid+':'+ctx.qi],shenWrong:ctx.info&&ctx.info.shen===false},ask,say).then(r=>{
  log.appendChild(H(`<div class="dxend">${pathHTML(r.trail)}<p class="fbtxt ${r.retestOk?'ok':'no'}">${r.retestOk?(DX.state(r.main)==='weak'?'✓ 新题做对了！再做对 1 次，这个点就从“薄弱”变回“实际答对过”。':'✓ 新题做对了，这个点记为“实际答对过”。'):'新题还没做对：它留在“薄弱”，知识地图里会提醒你从这里补。'}</p>${r.root&&r.root!==r.main?`<div class="row">${linkBtn(r.root)}</div>`:''}</div>`));
  cb&&cb(r);}).catch(e=>{console.error(e);cb&&cb(null);});};
// 反思：诊断给出的建议
DXUI.suggest=function(list){list=list.filter(r=>r&&r.err);if(!list.length)return null;const c={};list.forEach(r=>{c[r.err]=(c[r.err]||0)+1;});const err=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];const r=list.find(x=>x.err===err);return {err,text:r.text,root:r.root};};

// ---- 知识地图 ----
function rows(){if(DX.ROWS)return DX.ROWS;return [];}
const COL={ok:['#dff3e7','#2b8a55','#145233'],none:['#fff','#bfb2a3','#7b6b5d'],weak:['#fbe1dd','#c8372d','#7d1c15']};
DXUI.mapSVG=function(sel){const R=rows();const W=360,RH=56,NH=28;const pos={};let y=6;const parts=[];const rec=DX.startHere();
 R.forEach(r=>{parts.push(`<text x="4" y="${y+11}" font-size="11" fill="#9a8877" font-weight="700">${r.label}</text>`);const n=r.ids.length;const gap=6;const w=(W-8-gap*(n-1))/n;r.ids.forEach((id,i)=>{pos[id]={x:4+i*(w+gap),y:y+16,w};});y+=RH;});
 const H0=y+4;let ed='';
 DX.E.forEach(e=>{const a=pos[e[1]],b=pos[e[0]];if(!a||!b)return;const x1=a.x+a.w/2,y1=a.y+NH,x2=b.x+b.w/2,y2=b.y;const st=DX.state(e[1]);const hot=st==='weak';
  ed+=`<path d="M${x1.toFixed(1)},${y1} C${x1.toFixed(1)},${(y1+y2)/2} ${x2.toFixed(1)},${(y1+y2)/2} ${x2.toFixed(1)},${y2-3}" fill="none" stroke="${hot?'#e08a80':'#cdbfae'}" stroke-width="${hot?1.8:1.2}" ${e[2]==='s'?'stroke-dasharray="3 3"':''} opacity=".9"/><path d="M${x2.toFixed(1)},${y2-1} l-3,-5 h6 z" fill="${hot?'#e08a80':'#cdbfae'}"/>`;});
 let nd='';Object.keys(pos).forEach(id=>{const p=pos[id],t=T(id),st=DX.state(id),c=COL[st];const isR=id===rec,isS=id===sel;
  const lab=t.s.length*11>p.w-8?t.s.slice(0,Math.max(2,Math.floor((p.w-8)/11)))+'…':t.s;
  nd+=`<g class="dxn" data-id="${id}" style="cursor:pointer"><rect x="${p.x.toFixed(1)}" y="${p.y}" width="${p.w.toFixed(1)}" height="${NH}" rx="9" fill="${c[0]}" stroke="${isR?'#d45216':isS?'#2a211b':c[1]}" stroke-width="${isR||isS?2.6:1.4}" ${st==='none'?'stroke-dasharray="4 3"':''}/><text x="${(p.x+p.w/2).toFixed(1)}" y="${p.y+18}" text-anchor="middle" font-size="11" font-weight="700" fill="${c[2]}">${lab}</text>${isR?`<circle cx="${(p.x+p.w-4).toFixed(1)}" cy="${p.y+2}" r="6" fill="#d45216"/><text x="${(p.x+p.w-4).toFixed(1)}" y="${p.y+5.5}" text-anchor="middle" font-size="9" fill="#fff" font-weight="800">!</text>`:''}</g>`;});
 return `<svg class="dxmap" viewBox="0 0 ${W} ${H0}" width="100%" role="img" aria-label="知识地图">${parts.join('')}${ed}${nd}</svg>`;};
DXUI.mapCard=function(){const S=[...shown()];const cnt={ok:0,none:0,weak:0};S.forEach(id=>cnt[DX.state(id)]++);const rec=DX.startHere();
 const card=H(`<div class="card dxmapcard" id="dxmap"><div class="step"><i>🗺</i>我的知识地图</div>
 <p class="dxnote">只算你<b>亲手答对</b>的题，不靠推测：后面的题做对了，不代表前面的点就会。箭头从“先要会的”指向“后学的”。</p>
 <div class="dxleg"><span class="ok">实际答对过 ${cnt.ok}</span><span class="none">未验证 ${cnt.none}</span><span class="weak">薄弱 ${cnt.weak}</span></div>
 <div class="dxsvg"></div>
 <div class="dxrec"></div><div class="dxdet"></div></div>`);
 const draw=sel=>{$('.dxsvg',card).innerHTML=DXUI.mapSVG(sel);$$('.dxn',card).forEach(g=>g.addEventListener('click',()=>detail(g.dataset.id)));};
 function detail(id){draw(id);const t=T(id),st=DX.state(id),s=ST.tp[id]||{ok:0,bad:0,streak:0};const d=$('.dxdet',card);
  const pre=DX.pre(id).filter(p=>shown().has(p));
  d.innerHTML=`<div class="dxpanel"><div class="dxh">${t.ch===0?'小学'+t.g:t.no} · <b>${t.nm}</b> <span class="dxst ${st}">${st==='ok'?'实际答对过':st==='weak'?'薄弱':'未验证'}</span></div>
  <p class="dxsm">${st==='weak'?`答错过诊断题。再<b>连续答对 ${2-(s.streak||0)} 次</b>才算过关。`:st==='ok'?`亲手答对过 ${s.ok} 次。`:'还没有亲手答过这个点的题。'}</p><p>${t.h}</p>
  ${pre.length?`<p class="dxsm">先要会：${pre.map(p=>`<span class="dxst ${DX.state(p)}">${T(p).nm}</span>`).join(' ')}</p>`:''}
  <div class="row"><button class="btn dxtest">测一测（2 题）</button>${DX.link(id).href?`<a class="btn ghost" href="${DX.link(id).href}">${DX.link(id).txt} →</a>`:''}</div><div class="dxlog"></div></div>`;
  $('.dxtest',d).onclick=async()=>{$('.dxtest',d).disabled=true;const log=$('.dxlog',d);let okn=0;for(let k=0;k<2;k++){const it=DX.gen(id,k?'r':'k');const ok=await askUI(log,it,{role:'check',id},`测一测 ${k+1}/2`);DX.rec(id,ok,'check');if(ok)okn++;}
   log.appendChild(H(`<p class="fbtxt ${okn===2?'ok':'no'}">${okn}/2 对。${DX.state(id)==='ok'?'这个点现在是“实际答对过”。':DX.state(id)==='weak'?'还算薄弱，看上面的要点再来。':''}</p>`));
   const b=H('<div class="row"><button class="btn ghost">刷新地图</button></div>');b.firstChild.onclick=()=>{const n=DXUI.mapCard();card.replaceWith(n);};log.appendChild(b);};
  if(d.scrollIntoView)try{d.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(_){}}
 draw(null);
 const rc=$('.dxrec',card);
 if(rec){const t=T(rec);rc.innerHTML=`<div class="dxreco"><div class="dxh">📍 从这里补起：<b>${t.nm}</b>${t.ch===0?' <span class="dxg">小学'+t.g+'</span>':t.ch!==DX.CH?' <span class="dxg">'+CHN[t.ch]+'</span>':''}</div><p class="dxsm">这道前置题做错过，可以从这里补起。</p><div class="row"><button class="btn dxgorec">先测这个点</button>${DX.link(rec).href?`<a class="btn ghost" href="${DX.link(rec).href}">${DX.link(rec).txt} →</a>`:''}</div></div>`;$('.dxgorec',rc).onclick=()=>detail(rec);}
 else if(cnt.ok===0)rc.innerHTML=`<div class="dxreco"><div class="dxh">还没有数据</div><p class="dxsm">做一次「开局诊断」（最多 10 题），地图就会亮起来。</p><div class="row"><a class="btn" href="#/start">开始开局诊断 →</a></div></div>`;
 else{const un=S.filter(id=>DX.state(id)==='none'&&T(id).ch===DX.CH).sort((a,b)=>order(a)-order(b))[0];rc.innerHTML=`<div class="dxreco"><div class="dxh">目前没有薄弱点 👍</div>${un?`<p class="dxsm">还没验证的：<b>${T(un).nm}</b>，测一测就知道。</p><div class="row"><button class="btn ghost dxun">测「${T(un).nm}」</button></div>`:''}</div>`;const b=$('.dxun',rc);if(b)b.onclick=()=>detail(un);}
 return card;};
DXUI.home=function(v){const lcs=$('#lcs',v);if(!lcs)return;const sec=H(`<div><h2 class="sec">诊断</h2><div class="lcards dxtop"><a class="lc" href="#/start" id="gostart"><div class="no">开局诊断</div><h3>${ST.start[DX.CH]?'再测一次':'找到从哪里开始'}</h3><p>最多 10 题，沿着知识的先后顺序往回查，找到最该先补的那一个点。</p></a></div></div>`);
 lcs.after(sec);sec.appendChild(DXUI.mapCard());v.querySelector('.view').appendChild(H(DXUI.footer()));};
DXUI.footer=()=>`<div class="dxfoot">知识点与先修关系改编自 <a href="https://github.com/xiaoyang111222/cn-math-taxonomy" target="_blank" rel="noopener">cn-math-taxonomy</a>（作者 xiaoyang111222），采用 <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.zh-hans" target="_blank" rel="noopener">CC BY-NC 4.0</a> 许可。<b>已修改</b>：按人教版 2024 七上逐条审核先修关系（删去不合理的、补上课本里明确的），诊断题重新编写并用程序验算。仅供非商业使用。</div>`;
// ---- 开局诊断 ----
DXUI.startView=function(){const root=H('<div></div>');root.appendChild(topBar('开局诊断',null));const v=H(`<div class="view"><div class="hero"><h1>开局诊断</h1><p>最多 10 题。从这一章最后面的知识点开始问，答错了就往前查，找到最该先补的点。每题先想清楚再点。</p></div><div class="card" id="stc"><div class="dxlog"></div></div></div>`);root.appendChild(v);app().replaceChildren(root);bindGo(root);
 const log=$('#stc .dxlog',v);const ep=EPOCH;
 DX.startRun((it,meta)=>askUI(log,it,meta,`开局诊断 第 ${meta.k}/${meta.max} 题`)).then(r=>{if(ep!==EPOCH)return;ST.start[DX.CH]={t:Date.now(),asked:r.asked.length};dsave();
  const rec=DX.startHere();log.appendChild(H(`<div class="dxres"><div class="dxh">诊断完成：做了 ${r.asked.length} 题，对 ${r.asked.filter(x=>x.ok).length} 题</div>${pathHTML(r.asked.map(x=>({id:x.id,ok:x.ok,role:'start'})))}<p class="dxt">${rec?`从这里补起：<b>${T(rec).nm}</b>。${T(rec).h}`:'这次问到的点你都答对了。去各节课刷题，继续验证其他点。'}</p><div class="row">${rec&&DX.link(rec).href?`<a class="btn" href="${DX.link(rec).href}">${DX.link(rec).txt} →</a>`:''}<a class="btn ghost" href="#/">看我的知识地图</a></div></div>`));});};
DX.START={3:['cnm_030','cnm_029','cnm_027','cnm_026','cnm_025'],1:['cnm_009','cnm_008','cnm_002','cnm_003'],2:['cnm_021','cnm_013','cnm_017','cnm_022','cnm_023']};
DX.startRun=async function(askFn,max){max=max||10;const S=shown();const asked=[];const seen=new Set();const q=[...DX.START[DX.CH]];
 const order2=[...S].filter(id=>T(id).ch===DX.CH).sort((a,b)=>order(b)-order(a));
 while(asked.length<max){let id=q.shift();if(!id){id=order2.find(x=>!seen.has(x));if(!id)break;}if(seen.has(id)||!DX.G[id])continue;seen.add(id);
  const it=DX.gen(id,T(id).ch===0?'k':(DX.G[id].r?'r':'k'));const ok=await askFn(it,{role:'start',id,k:asked.length+1,max});DX.rec(id,ok,'start');asked.push({id,ok});
  if(!ok){const pre=DX.pre(id).filter(p=>S.has(p)&&!seen.has(p));q.unshift(...pre.slice(0,2));}}
 return {asked};};
window.DXUI=DXUI;
})();

route();
</script></body></html>
