<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学知识图谱 · 小学到高中</title>
<link rel="stylesheet" href="graph/knowledge.css?v=6">
<link rel="stylesheet" href="study-navigation.css?v=2">
<script defer src="graph/dagre.min.js"></script>
<script defer src="graph/catalog.js?v=2"></script>
<script defer src="graph/knowledge.js?v=4"></script>
</head>
<body>
<nav class="studyNav" aria-label="学习导航"><div class="in"><a href="K1-6.html">小学补基</a><a href="index.html" title="有理数">第一章</a><a href="chapter-2.html" title="有理数的运算">第二章</a><a href="chapter-3.html" title="代数式">第三章</a><a id="knowledgeNav" class="study-map" href="knowledge.html" aria-current="page">知识图谱</a></div></nav>
<main>
  <header class="page-head">
    <div><p class="scope">小学 · 初中 · 高中</p><h1>数学知识图谱</h1><a class="study-graph-back" id="back" href="index.html" hidden>← 回刚才的课</a></div>
    <button class="button directory-button" id="directory" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 4 4"></path></svg>
      查知识点
    </button>
  </header>
  <div class="layout">
    <section class="board" id="board" aria-label="可缩放的知识点关系图">
      <div class="toolbar">
        <div class="depth-control" role="group" aria-label="向前查看多少层">
          <span class="toolbar-label">往前找</span>
          <div class="segments" id="depth">
            <button type="button" data-depth="1" aria-pressed="true">1 层</button>
            <button type="button" data-depth="2" aria-pressed="false">2 层</button>
            <button type="button" data-depth="3" aria-pressed="false">3 层</button>
            <button type="button" data-depth="all" aria-pressed="false">全部</button>
          </div>
        </div>
        <div class="zoom-tools" role="group" aria-label="图谱视角">
          <button type="button" id="zoom-out" class="icon-button" title="缩小" aria-label="缩小">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"></path></svg>
          </button>
          <button type="button" id="zoom-in" class="icon-button" title="放大" aria-label="放大">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12m-6-6v12"></path></svg>
          </button>
          <button type="button" id="fit" class="icon-button" title="适合屏幕" aria-label="适合屏幕">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4m8 0h4v4M4 16v4h4m8 0h4v-4"></path><circle cx="12" cy="12" r="2"></circle></svg>
          </button>
          <button type="button" id="fullscreen" class="icon-button" title="全屏" aria-label="全屏" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"></path></svg>
          </button>
        </div>
      </div>
      <div class="map-region"><div class="viewport" id="viewport" tabindex="0" aria-label="知识图谱画布。可拖动查看，方向键平移，加减键缩放，零键适合屏幕。">
        <svg id="canvas" role="group" aria-label="数学知识点及先修箭头">
          <defs>
            <marker id="head-hard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#586983"></path></marker>
            <marker id="head-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8796ac"></path></marker>
            <marker id="head-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b24c1a"></path></marker>
          </defs>
          <g id="scene"><g id="edges"></g><g id="nodes"></g></g>
        </svg>
        <div class="canvas-tip" aria-hidden="true"><span>向下看学习顺序</span><span id="zoom-level"></span></div>
      </div>
      <aside class="edge-detail" id="edge-detail" hidden aria-live="polite">
        <div><h2 id="edge-title"></h2><p id="edge-reason"></p><p id="edge-example" hidden></p><span id="edge-source"></span></div>
        <button class="icon-button" type="button" id="clear-edge" aria-label="收起连线解释">×</button>
      </aside>
      </div>
      <div class="graph-footer">
        <div class="legend" aria-label="颜色和线条图例">
          <span><i class="swatch primary"></i>小学</span><span><i class="swatch junior"></i>初中</span><span><i class="swatch senior"></i>高中</span><span><i class="swatch current"></i>当前</span>
          <span><i class="line-key"></i>先打基础</span><span><i class="line-key soft"></i>学过有帮助</span>
        </div>
        <p class="visible-count" id="visible-count" aria-live="polite"></p>
      </div>

    </section>
    <aside class="side" aria-label="当前知识点">
      <section class="info">
        <p id="chapter-label" class="chapter-label"></p>
        <h2 id="topic-title" tabindex="-1"></h2>
        <p class="summary" id="summary"></p>
        <div id="example" class="example" hidden><span>看个例子</span><strong id="example-formula"></strong><p id="example-explanation"></p><div class="example-control"><span id="example-step"></span><button type="button" id="example-next" hidden>下一步</button></div></div>
        <p id="practice-status" class="practice-status" hidden></p>
        <div class="actions">
          <a class="button main-action" id="lesson" href="index.html" hidden>看动画课</a>
          <a class="button" id="check" href="index.html" hidden>做两题</a>
        </div>
      </section>
      <details class="relations">
        <summary>为什么连在一起？</summary>
        <div id="relations"></div>
      </details>
    </aside>
  </div>
  <footer class="source">
    <span id="source-count"></span>
    <span>数据来自 <a id="upstream-source" href="https://github.com/xiaoyang111222/cn-math-taxonomy">cn-math-taxonomy</a>（xiaoyang111222）。保留数学节点与原先修关系，另标本站补充关系。<a href="graph/LICENSE-data.txt">CC BY-NC 4.0</a>。</span>
  </footer>
</main>
<dialog id="catalog-dialog" aria-labelledby="catalog-title">
  <section class="catalog">
    <header><div><p class="scope" id="catalog-count"></p><h2 id="catalog-title">查知识点</h2></div><button type="button" class="icon-button" id="close-directory" aria-label="关闭知识点搜索">×</button></header>
    <label for="search" class="sr-only">搜索知识点</label>
    <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="搜相反数、配方法、二次函数…">
    <div id="filters" class="segments filters" role="group" aria-label="按学段筛选">
      <button type="button" data-stage="all" aria-pressed="true">全部</button><button type="button" data-stage="primary" aria-pressed="false">小学</button><button type="button" data-stage="junior" aria-pressed="false">初中</button><button type="button" data-stage="senior" aria-pressed="false">高中</button>
    </div>
    <div id="shortcuts" class="shortcuts" aria-label="可以先看">
      <button type="button" data-topic="cnm_006">相反数</button><button type="button" data-topic="cnm_012">有理数的减法</button><button type="button" data-topic="cnm_029">代数式的值</button><button type="button" data-topic="cnm_221">配方法</button>
    </div>
    <p id="result-count" aria-live="polite" class="result-count"></p>
    <div id="results" class="results"></div>
    <button class="button more" id="more" type="button" hidden>再显示 24 个</button>
  </section>
</dialog>
<noscript>请开启 JavaScript，使用互动知识图谱。</noscript>
</body>
</html>
