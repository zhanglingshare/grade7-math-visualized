<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#112b3a"/><stop offset="1" stop-color="#101a2b"/></linearGradient></defs><rect width="1000" height="360" rx="24" fill="url(#back)"/><text x="35" y="49" font-size="30" fill="#f3d08e" font-weight="700" text-anchor="start" font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">数学认知建构 · 从现实到抽象</text><text x="35" y="81" font-size="18" fill="#adcad5" font-weight="500" text-anchor="start" font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">以第五章等量关系为例：情境、表征、符号、验证</text><rect x="28" y="120" width="220" height="195" rx="14" fill="#254253" stroke="#517986"/><text x="138" y="157" font-size="24" fill="#f4d18f" font-weight="700" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">情境</text><text x="138" y="217" font-size="17" fill="#edf5f7" font-weight="600" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">3个大杯 = 4个小杯</text><text x="138" y="285" font-size="17" fill="#a8d7ce" font-weight="500" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">发现数量关系</text><path d="M250 218h18m-5 -5 5 5-5 5" fill="none" stroke="#b2d5c9" stroke-width="2"/><rect x="272" y="120" width="220" height="195" rx="14" fill="#254253" stroke="#517986"/><text x="382" y="157" font-size="24" fill="#f4d18f" font-weight="700" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">图形</text><text x="382" y="217" font-size="20" fill="#edf5f7" font-weight="600" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">两边总价相同</text><text x="382" y="285" font-size="17" fill="#a8d7ce" font-weight="500" text-anchor="middle" font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">把关系变得可见</text><path d=