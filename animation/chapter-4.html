 $('#ctrlTop',v).addEventListener('pointerdown',()=>{if(api.demo){api.touched=true;api.demo=false;setTag('轮到你了！',true);}},true);
 function setTag(t,go){const tg=$('#tag',v);tg.textContent=t;tg.classList.toggle('go',!!go);if(go){clearTimeout(tg._h);tg._h=setTimeout(()=>{tg.style.opacity=0;},2600);}else tg.style.opacity=.85;}

 svg.appendChild(hand);
 function renderMissions(justDone){const d=DB.m[L.id]||[];const cur=api.curMission();const ol=$('#mlist',v);ol.replaceChildren();

function VT(env,pairs,c){const h=['',Object.keys(env).map(k=>`${k} = ${fmt(env[k])}`).join('，')];const rows=pairs.map(p=>{const P=exParse(p[1]);return [p[0],P?fmt(exEval(P.ast,env)):'?'];});return {tb:{h,rows},c};}
// 审题：[问题, 对的说法, 错的说法, 解释] → 两个选项随机排
function SH(s){const k=Math.random()<.5?0:1;const o=k?[s[2],s[1]]:[s[1],s[2]];return [s[0],o,k,s[3]];}
// 选择题：o[0] 是正确答案，载入时打乱；w 用选项文字做键
function QC(t,tg,chk,s,q,o,e,x){x=x||{};const ord=shuffle(o.map((_,i)=>i));const oo=ord.map(i=>o[i]);const w={};if(x.w)for(const k in x.w){const j=oo.indexOf(k);if(j>=0)w[j]=x.w[k];}if(x.wd)w.d=x.wd;
 return Object.assign({t,tg,chk,s:SH(s),q,o:oo,a:oo.indexOf(o[0]),e},x,{w});}
// 填式子：ex 是 ascii；默认要最简（simp）
function QE(t,tg,chk,s,q,ex,at,e,x){x=x||{};const r=Object.assign({t,tg,chk,s:SH(s),q,in:true,ex,at,e,simp:x.simp!==false},x);if(chk&&chk.o)r.sub=chk.k;return r;}
// 填数
function QN(t,tg,chk,s,q,num,at,e,x){return Object.assign({t,tg,chk,s:SH(s),q,in:true,num:[].concat(num),at,e},x||{});}

function genFix(q){q.t='g';if(q.sub)q.sub=q.sub.replace(/\*\*/g,'^');if(q.ex&&!q.vars){const k=q.chk&&q.chk.k;const p=k?exParse(k.replace(/\*\*/g,'^')):null;const p2=exParse(q.ex);const vs=new Set([...(p?p.vars:[]),...(p2?p2.vars:[])]);q.vars=[...vs].sort();if(!q.vars.length)q.vars=['x'];}return q;}
function genSet(lid,n){const T=GEN[lid];const out=[];const order=G.shuf(T.map((_,i)=>i));for(let i=0;i<n;i++){const f=T[order[i%T.length]];const q=genFix(f());out.push(q);}return out;}

DX.MAXD=3;
DX.diagnose=async function(o,askFn,sayFn){
 const main=full(o.main),subs=(o.subs||[]).map(full),P=o.P;const trail=[];let budget=7;const okSet=new Set();
 sayFn=sayFn||(()=>{});
 const seenQ=new Set();async function check(id,kind,role,depth){budget--;const it=DX.gen(id,kind,(role==='fix'||role==='retest')?null:P,seenQ);seenQ.add(it.q);const ok=await askFn(it,{role,id,depth});DX.rec(id,ok,'diag-'+role);trail.push({id,kind,role,ok,depth});if(ok)okSet.add(id);return ok;}
 async function descend(X,depth){if(depth>DX.MAXD||budget<=2)return X;
  const pre=DX.pre(X);const cand=[...subs.filter(s=>pre.includes(s)),...pre.filter(p=>!subs.includes(p))].filter(p=>!okSet.has(p)&&DX.G[p]);
  let n=0;for(const p of cand){if(n>=2||budget<=2)break;n++;const ok=await check(p,'k','back',depth);if(!ok)return descend(p,depth+1);}return X;}
 let mode,root=null,sub=null;
 const okC=await check(main,'c','confirm',0);
 if(okC){sub=subs.find(s=>s!==main&&DX.G[s]);
  if(sub){const okS=await check(sub,'k','sub',1);if(!okS){root=await descend(sub,2);mode='sub';}else mode='careless';}else mode='careless';}
 else{root=await descend(main,1);mode=root===main?'rule':'prereq';}
 const M=T(main);let text,err;
 if(mode==='careless'){text=`「${M.nm}」的概念你是会的${sub?`，「${T(sub).nm}」也没问题`:''}。这次错在计算或审题——下次算完代回去检查一遍。`;err=o.shenWrong?'审题没看清':'算完没检查';}
 else if(mode==='rule'){const chk=trail.filter(x=>x.role==='back'&&x.ok).map(x=>T(x.id).nm);text=`${chk.length?`前面的基础（${chk.join('、')}）你都会，`:''}问题就在这一节：${M.miss}。`;err='法则记混了';}
 else if(mode==='prereq'){text=`不是「${M.nm}」不会，是${T(root).miss}。`;err='法则记混了';}
 else{text=`「${M.nm}」本身你会，问题出在：${T(root).miss}。`;err='法则记混了';}
 const res={main,root,mode,text,err,depth:Math.max(0,...trail.map(x=>x.depth))};
 await sayFn('diag',res);
 if(root&&root!==main){await sayFn('fix',res);res.fixOk=await check(root,'k','fix',0);}

 ST.runs.push({main,root,mode,t:Date.now(),n:trail.length,ok:res.retestOk});if(ST.runs.length>200)ST.runs=ST.runs.slice(-200);dsave();

const ROLE={confirm:'🔎 确认：先弄清你卡在哪一步',sub:'🔎 再查一步',back:'↩ 回查前面的知识',fix:'🩹 补完再试一题',retest:'🔁 同类型新题：检验你真的会了',start:'开局诊断',check:'测一测'};
function gradeIt(it,raw){
 if(it.sci){const s=String(raw).replace(/[−－–—]/g,'-').replace(/[×xX*＊·]/g,'x').replace(/\s+/g,'').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,m=>'^'+m.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]/g,c=>c==='⁻'?'-':String('⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c))));
  const m=s.match(/^([+-]?)(\d+(?:\.\d+)?)x10\^?\(?([+-]?\d+)\)?$/);if(!m)return null;const a=+m[2]*(m[1]==='-'?-1:1);const v=a*Math.pow(10,+m[3]);return {ok:Math.abs(v-it.num[0])<=1e-9*Math.abs(it.num[0])&&Math.abs(a)>=1&&Math.abs(a)<10};}
 if(it.dec!=null){const t=String(raw).replace(/[−－–—]/g,'-').replace(/[．。]/g,'.').trim();const m=t.match(/^([+-]?)(\d+)(?:\.(\d+))?$/);if(!m)return null;return {ok:Math.abs(+t-it.num[0])<1e-9&&(m[3]||'').length===it.dec};}

DXUI.home=function(v){const lcs=$('#lcs',v);if(!lcs)return;const sec=H(`<div><h2 class="sec">诊断</h2><div class="lcards dxtop"><a class="lc" href="#/start" id="gostart"><div class="no">开局诊断</div><h3>${ST.start[DX.CH]?'再测一次':'找到从哪里开始'}</h3><p>最多 10 题，沿着知识的先后顺序往回查，找到最该先补的那一个点。</p></a></div></div>`);
 lcs.after(sec);sec.appendChild(DXUI.mapCard());v.querySelector('.view').appendChild(H(DXUI.footer()));};

  const rec=DX.startHere();log.appendChild(H(`<div class="dxres"><div class="dxh">诊断完成：做了 ${r.asked.length} 题，对 ${r.asked.filter(x=>x.ok).length} 题</div>${pathHTML(r.asked.map(x=>({id:x.id,ok:x.ok,role:'start'})))}<p class="dxt">${rec?`从这里补起：<b>${T(rec).nm}</b>。${T(rec).h}`:'这次问到的点你都答对了。去各节课刷题，继续验证其他点。'}</p><div class="row">${rec&&DX.link(rec).href?`<a class="btn" href="${DX.link(rec).href}">${DX.link(rec).txt} →</a>`:''}<a class="btn ghost" href="#/">看我的知识地图</a></div></div>`));});};
DX.START={4:['cnm_037','cnm_036','cnm_035','cnm_034','cnm_032','cnm_031'],3:['cnm_030','cnm_029','cnm_027','cnm_026','cnm_025'],1:['cnm_009','cnm_008','cnm_002','cnm_003'],2:['cnm_021','cnm_013','cnm_017','cnm_022','cnm_023']};
DX.startRun=async function(askFn,max){max=max||10;const S=shown();const asked=[];const seen=new Set();const q=[...DX.START[DX.CH]];
 const order2=[...S].filter(id=>T(id).ch===DX.CH).sort((a,b)=>order(b)-order(a));
 while(asked.length<max){let id=q.shift();if(!id){id=order2.find(x=>!seen.has(x));if(!id)break;}if(seen.has(id)||!DX.G[id])continue;seen.add(id);
  const it=DX.gen(id,T(id).ch===0?'k':(DX.G[id].r?'r':'k'));const ok=await askFn(it,{role:'start',id,k:asked.length+1,max});DX.rec(id,ok,'start');asked.push({id,ok});
  if(!ok){const pre=DX.pre(id).filter(p=>S.has(p)&&!seen.has(p));q.unshift(...pre.slice(0,2));}}
 return {asked};};
