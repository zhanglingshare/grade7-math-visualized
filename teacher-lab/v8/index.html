 thinking:l==="23"?"我不相信相距5格只有一次。试试相遇点的两边，各找一个时刻。":"如果交叉格在两条路里都算了一次，减两条路会发生什么？敢不敢先猜？",
 solver:l==="23"?"数轴上距离是两点坐标差的绝对值。写出 |10−5t|=5，再分类讨论。":"把实际面积写成35−7−5+1，或者直接算6×4。两种写法能相互验证。",
 checker:l==="23"?"你找到一个时刻了吗？别急着结束，把两个时间都代入距离公式，看是不是都等于5。":"别只算数值。检查交叉格是否被重复扣除，单位有没有写平方米。"
 };
 return scripts[state.expert];
}
function setLineup(){
 var l=CONTENT[state.lesson];$("lineupRoles").innerHTML=l.roles.map(function(id){return '<button class="role'+(id===state.expert?" on":"")+'" data-role="'+id+'">'+ROLES[id].short+'</button>'}).join("");
}
function lesson(){return CONTENT[state.lesson]}
function phaseLabel(){return({predict:"① 预测",ready:"② 准备实验",verify:"③ 观察验证",reflect:"④ 解释发现",calculate:"⑤ 独立计算",done:"✓ 完成"})[state.phase]}
function setPhase(phase){state.phase=phase;$("phase").textContent=phaseLabel();renderInteraction()}
function mathFigure(){
 var l=state.lesson,t=state.t;
 if(state.lesson==="23"){
 var x=function(v){return 40+(v+2)*31};var p=-2+3*t,q=8-2*t;var distance=Math.abs(p-q);
 var axis='<line x1="25" y1="151" x2="415" y2="151" stroke="#bedfe5" stroke-width="2.5"/>';
 for(var k=-2;k<=10;k+=2)axis+='<line x1="'+x(k)+'" x2="'+x(k)+'" y1="143" y2="160" stroke="#bddce7" stroke-width="2"/><text x="'+x(k)+'" y="185" text-anchor="middle" fill="#c2dfe4" font-size="16">'+k+'</text>';
 var left=Math.min(x(p),x(q)),right=Math.max(x(p),x(q));
 var bar='<line x1="'+left+'" x2="'+right+'" y1="91" y2="91" stroke="#ffd895" stroke-width="8" stroke-linecap="round"/>';
 return '<svg viewBox="0 0 445 248" aria-label="动态数轴"><text x="220" y="32" text-anchor="middle" fill="#ffe2a0" font-weight="800" font-size="24">距离 '+distance.toFixed(1)+' 格</text><text x="220" y="54" text-anchor="middle" fill="#b1dee1" font-size="14">t = '+t.toFixed(1)+' 秒</text>'+axis+bar+'<circle cx="'+x(p)+'" cy="150" r="12" fill="#74def4"/><circle cx="'+x(q)+'" cy="150" r="12" fill="#ffa7ba"/><text x="'+x(p)+'" y="128" text-anchor="middle" fill="#85f3fc" font-size="18" font-weight="bold">P</text><text x="'+x(q)+'" y="218" text-anchor="middle" fill="#ffc0cb" font-size="18" font-weight="bold">Q</text><text x="220" y="242" text-anchor="middle" fill="#d1e9e7" font-size="12">P = −2 + 3t　　Q = 8 − 2t</text></svg>';
 }
 var f=Math.max(0,Math.min(3,t)),h=f>=1,v=f>=2,c=f>=3;
 return '<svg viewBox="0 0 440 270" aria-label="两条道路及交叉格"><text x="220" y="26" text-anchor="middle" fill="#f7dfab" font-size="22" font-weight="bold">长7米 × 宽5米</text><rect x="62" y="49" width="315" height="175" rx="5" fill="#397a63" stroke="#b8f6cd" stroke-width="3"/><rect x="62" y="116" width="315" height="35" fill="'+(h?"#dfbf8a":"#dfbf8a33")+'"/><rect x="199" y="49" width="45" height="175" fill="'+(v?"#e6be78":"#e6be7833")+'"/><rect x="199" y="116" width="45" height="35" fill="'+(c?"#ff9984":"#e6be78")+'" stroke="'+(c?"#ffd2a0":"none")+'" stroke-width="4"/><text x="220" y="108" text-anchor="middle" fill="#faf0d7" font-size="15">横路</text><text x="268" y="91" fill="#e7f3ff" font-size="15">竖路</text><text x="220" y="251" text-anchor="middle" fill="#ffdfa7" font-size="16">'+(c?"交叉格只应减掉一次":v?"交叉格重复出现在两条路里":h?"先扣除横路的面积":"先观察整块绿地")+'</text></svg>';
}
function renderMath(){
 $("mathBoard").innerHTML=mathFigure();$("mathTag").textContent=state.lesson==="23"?"t = "+state.t.toFixed(1)+"秒":(["原始面积","横路出现","竖路出现","突出交叉格"][Math.floor(state.t)]||"观察交叉格");
 $("mathCue").textContent=state.lesson==="23"?"请盯住 P、Q 中间发光的距离线":"请观察横路与竖路的重叠方格";
}
function renderInteraction(){
 var st=state.phase,l=lesson(),item=l.stages[state.step],opts=$("options"),act=$("action"),fb=$("feedback"),calc=$("calcRow");
 $("progress").textContent="第"+(state.step+1)+"关 / 共2关 · "+phaseLabel();
 $("question").textContent=st==="calculate"?"现在不看提示，亲手把结果算出来。":st==="done"?"完成实验！你能向别人解释刚才发现了什么吗？":st==="reflect"?"刚才的动画能否证明或推翻你的预测？":item.prompt;
 $("dockType").textContent=st==="calculate"?"✍️ 自己计算":st==="done"?"🎉 思维挑战完成":st==="reflect"?"💡 说出发现":"🤔 先预测，再验证";
 $("dockHint").textContent=st==="predict"?"没有预测，实验不会公布结果":st==="ready"?"现在点击验证，别移开目光":st==="verify"?"请看发亮的数学对象":"高手会根据你的回答继续";
 fb.textContent="";fb.classList.remove("good");calc.hidden=true;opts.hidden=st==="calculate"||st==="done"||st==="reflect";
 act.disabled=st==="predict"&&state.pick<0||st==="verify";
 if(st==="predict"||st==="ready"){
 opts.innerHTML=item.opts.map(function(v,i){return '<button class="opt'+(state.pick===i?" chosen":"")+'" data-pick="'+i+'"><b>'+("ABC"[i])+'</b>'+v+'</button>'}).join("");
 act.textContent=st==="ready"?"▶ 验证我的猜想":"先选择一种预测";$("microHint").textContent="你可以猜错，关键是验证";
 }else if(st==="verify"){opts.innerHTML="";act.textContent="实验进行中…";$("microHint").textContent="注意图形变化"; }
 else if(st==="reflect"){
 opts.hidden=false;opts.innerHTML='<button class="opt correct" style="grid-column:1/-1;cursor:default">'+item.response+'</button>';
 act.textContent=state.step===0?"继续下一关 →":"✍️ 自己计算";act.disabled=false;
 $("microHint").textContent="先解释原因，再进入下一步";
 }else if(st==="calculate"){
 calc.hidden=false;calc.innerHTML='<label>'+l.calc.label+'：</label>'+Array.from({length:l.calc.count},function(_,i){return '<input inputmode="decimal" aria-label="第'+(i+1)+'个答案" placeholder="答案'+(i+1)+'" data-answer="'+i+'">'}).join("")+'<span style="color:#a8d9cb;font-size:12px">'+l.calc.unit+'</span>';
 act.textContent="检查我的计算";act.disabled=false;$("microHint").textContent="先独立试，再听错误猎人的意见";
 }else{opts.innerHTML="";act.textContent="再玩一次";act.disabled=false;$("microHint").textContent="可以换另一个数学实验";}
 $("help").hidden=st==="verify"||st==="done";$("replay").hidden=st==="predict"||st==="ready"||st==="done";
}
function teach(text){speak(text)}
function selectOption(index){
 if(state.phase!=="predict"&&state.phase!=="ready")return;
 state.pick=index;state.phase="ready";renderInteraction();teach("你的预测我听到了。先别急着看答案，点击验证，让数学图自己告诉我们。");
}
function animateTo(to,callback){
 cancelAnimationFrame(FRAME);state.animating=true;state.phase="verify";renderInteraction();
 var from=state.t,start=null,dur=state.lesson==="23"?2600:1800;
 function tick(ts){if(start===null)start=ts;var p=Math.min(1,(ts-start)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;state.t=from+(to-from)*e;renderMath();if(p<1){FRAME=requestAnimationFrame(tick)}else{state.t=to;state.animating=false;renderMath();callback()}}
 FRAME=requestAnimationFrame(tick);
}
function verify(){
 if(state.phase!=="ready")return;
 var item=lesson().stages[state.step];
 state.t=item.start;renderMath();
 teach(state.lesson==="23"?"眼睛跟着两个点移动，尤其注意相遇前后的距离。":"我先显示横路，再显示竖路，最后圈出交叉的地方。");
 animateTo(item.end,function(){
 var good=state.pick===item.correct;
 state.phase="reflect";renderInteraction();
 if(state.step===1){setExpert(state.lesson==="23"?"thinking":"solver",false)}
 teach((good?"你预测对了。":"你的预测需要修正。")+item.response+"。现在你自己说说原因，然后进入下一步。");
 });
}
function next(){
 var st=state.phase;
 if(st==="ready")return verify();
 if(st==="reflect"){
 if(state.step===0){state.step=1;state.pick=-1;state.tries=0;state.t=0;state.phase="predict";setExpert(lesson().roles[0],false);renderMath();renderInteraction();teach(lesson().stages[1].prompt+"。你先预测。");}
 else{state.phase="calculate";renderInteraction();setExpert(state.lesson==="23"?"checker":"solver",false);teach(expertInsight()+"。这次该你自己列式了。");}
 return;
 }
 if(st==="calculate")return submitCalc();
 if(st==="done")return openLesson(state.lesson);
}
function submitCalc(){
 var inputs=Array.prototype.slice.call($("calcRow").querySelectorAll("input")),typed=inputs.map(function(x){return Number(x.value.trim())}),expected=lesson().calc.answers.slice().sort(function(a,b){return a-b});
 var valid=inputs.every(function(x){return x.value.trim()!==""&&Number.isFinite(Number(x.value))});
 var correct=valid&&typed.length===expected.length&&typed.slice().sort(function(a,b){return a-b}).every(function(x,i){return Math.abs(x-expected[i])<1e-6});
 var fb=$("feedback");
 if(correct){state.phase="done";renderInteraction();fb.textContent="✓ 全部正确。你没有停留在猜想，而是完成了预测、验证和计算。";fb.classList.add("good");setExpert("checker",false);teach("做得好！"+(state.lesson==="23"?"两个时间1秒和3秒都满足距离5格。你没有漏解。":"35减7减5再加1，面积24平方米。记得写单位。")); $("modalTitle").textContent="这一题真正学会了什么？";$("modalText").textContent=state.lesson==="23"?"距离不是只会缩小：相遇前后相同距离可能各出现一次。计算必须对应图上两个位置。":"交叉区域重复计数时，需要把被多减掉的那一块加回来。";$("modalList").textContent="✓ 预测 → 实验 → 修正 → 独立计算 → 检查";$("modalButton").textContent=state.lesson==="23"?"挑战第20题":"重新挑战第23题";$("overlay").classList.add("open");}
 else{state.tries++;fb.classList.remove("good");fb.textContent=state.tries<2?"还不对。先检查有没有漏掉另一种情况，或者重复减去了交叉格。":"给你一条具体线索："+lesson().calc.hint;setExpert("checker",false);teach("不要急着抄答案。"+fb.textContent);}
}
function openLesson(id){
 cancelAnimationFrame(FRAME);stopVoice();state.lesson=id;state.step=0;state.phase="predict";state.pick=-1;state.t=0;state.tries=0;state.animating=false;state.done=false;
 $("switch23").classList.toggle("on",id==="23");$("switch20").classList.toggle("on",id==="20");
 $("lessonTitle").textContent=lesson().label;$("mathTitle").textContent=lesson().title;
 setLineup();setExpert(lesson().roles[0],false);renderMath();renderInteraction();
 $("overlay").classList.remove("open");teach("先盯着数学图。"+lesson().stages[0].prompt+"。想好以后点击答案，再启动实验。");
}
function replay(){
 if(state.phase==="verify")return;
 var item=lesson().stages[Math.min(state.step,lesson().stages.length-1)];
 state.t=item.start;renderMath();teach("我们重看一次实验。请把注意力集中在高亮的数学对象上。");
 animateTo(item.end,function(){state.phase="reflect";renderInteraction();teach(item.response)});
}
function help(){
 var t=state.phase==="calculate"?lesson().calc.hint:state.phase==="reflect"?lesson().stages[state.step].response:lesson().stages[state.step].hint;
 $("feedback").textContent="线索："+t;teach("我只给你一个线索："+t);
}
function teachers(){
 $("modalTitle").textContent="林老师 · 课堂指挥";$("modalText").textContent="这一版把讲台交给高手。每道实验只有1—3位可调用角色，当前只由一位主讲。";$("modalList").textContent="审题侦探 · 动画实验家 · 解题建筑师 · 思维挑战者 · 错误猎人";$("modalButton").textContent="返回实验";$("overlay").classList.add("open");
}
$("options").addEventListener("click",function(e){var b=e.target.closest("[data-pick]");if(b)selectOption(Number(b.dataset.pick))});
$("lineupRoles").addEventListener("click",function(e){var b=e.target.closest("[data-role]");if(b){setExpert(b.dataset.role,true)}});
$("action").onclick=next;$("help").onclick=help;$("replay").onclick=replay;
$("mute").onclick=function(){state.muted=!state.muted;this.textContent=state.muted?"🔇 声音关":"🔊 声音开";this.setAttribute("aria-pressed",String(state.muted));if(state.muted)stopVoice();else speak(lastSpeech||expertInsight())};
$("switch23").onclick=function(){openLesson("23")};$("switch20").onclick=function(){openLesson("20")};$("teacher").onclick=teachers;
$("modalButton").onclick=function(){$("overlay").classList.remove("open");if(state.phase==="done")openLesson(state.lesson==="23"?"20":"23")};
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&state.phase==="calculate")submitCalc();if(e.key==="Escape")$("overlay").classList.remove("open")});
openLesson("23");
window.V8={state:state,openLesson:openLesson,selectOption:selectOption,verify:verify,submitCalc:submitCalc,setExpert:setExpert,lesson:lesson,renderMath:renderMath};
})();
</script></body></html>
