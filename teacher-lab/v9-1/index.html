;font-weight:900}.track b{display:block;font-size:21px;margin-top:10px}.track small{color:var(--dim)}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}.tile{text-align:left;min-height:99px}.tile span{color:var(--gold);font-size:12px}.tile b{display:block;font-size:18px;margin:5px 0}.tile small{color:var(--dim)}.stage{border:1px solid #527a80;border-radius:22px;background:radial-gradient(ellipse at 65% 30%,#214b58,#102936 75%);overflow:hidden;min-height:530px;display:flex;flex-direction:column}.stageTop{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #ffffff10}.stageTop b{font-size:16px}.scene{display:grid;grid-template-columns:clamp(120px,19vw,230px) minmax(0,1fr);flex:1;min-height:350px}.actor{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#376b6e55,transparent 70%);border-right:1px solid #ffffff0c;min-height:260px}.actor .render{height:clamp(180px,31vh,310px);width:100%;display:flex;align-items:flex-end;justify-content:center}.actor img{max-width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 16px #001b2780)}.actor canvas{width:100%;height:100%;display:block}.actor .tag{color:var(--gold);font-size:12px;letter-spacing:.1em}.actor b{font-size:20px}.actor.arrive .render{animation:arrive .65s cubic-bezier(.18,.8,.25,1) both}@keyframes arrive{from{opacity:0;transform:translateX(-35px) scale(.93)}to{opacity:1;transform:none}}.actor.speaking .render img{animation:breathe .65s alternate infinite ease-in-out}@keyframes breathe{to{transform:translateY(-2px) rotate(.45deg)}}.math{min-width:0;padding:14px clamp(10px,2vw,22px);display:flex;flex-direction:column;justify-content:center}.math .arena-svg{display:block;width:100%;height:clamp(200px,40vh,390px);overflow:visible}.math .arena-equation{text-align:center;font-size:clamp(16px,2vw,25px);font-weight:7 </style></head><body><div class="shell"><header><b>林老师 · 数学剧场</b><span class="space"></span><button id="home">首页</button><button id="replay">重听</button><button id="voice">🔇 开声</button><button id="full">全屏</button></header><main id="root"></main><div class="footer">学习记录仅保存在本机浏览器。无需麦克风。期中题以仓库现有错题训练为依据，尚待原卷复核。</div></div>
<script>(function buildVisuals(){
"use strict";
const C={a:"#70e3c3",b:"#ffc18b",c:"#7295cf",d:"#ad9be4",ink:"#f2f8ff",muted:"#a7bed0",dark:"#24364d",low:"#47627f"};
const esc=s=>String(s).replace(/[&<>"']/g,k=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[k]));
const text=(x,y,t,size=18,color=C.ink,anchor="start")=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" font-weight="720" text-anchor="${anchor}">${esc(t)}</text>`;
const box=(x,y,w,h,col,r=7,more="")=>`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" rx="${r}" fill="${col}" ${more}/>`;
const path=(d,col=C.ink,sw=2,extra="")=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const dot=(x,y,r=8,col=C.a,extra="")=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" ${extra}/>`;
const nice=n=>Number.isInteger(n)?String(n):Number(n.toFixed(2)).toString();
function wrap(m,s,body,eq,caption){
  return `<svg class="arena-svg" data-drag="1" viewBox="0 0 720 320" role="img" aria-label="${esc(m.title)}的可操作数学示意图">${body}</svg><div class="arena-equation" aria-live="polite">${esc(eq)}</div><div class="arena-scene-note">${esc(caption)}</div>`;
}
function render(m,state){
const v=Number(state.value),k=state.mode||0,c=m.cfg;
let z="",eq="",note="";
switch(m.scene){
case "bars":{
 const left=c.total-v,scale=40,common=Math.max(0,left);
 z+=text(30,35,"甲：固定12颗",19)+box(75,62,c.total*scale,54,C.c,7)+box(75,62,common*scale,54,C.a,7)+box(75+common*scale,62,v*scale,54,C.b,7);
 z+=text(83,95,String(c.total),18,C.dark)+text(30,158,"乙：未知数量",19)+box(75,179,common*scale,54,C.a,7)+text(84,212,String(left),18,C.dark);
 z+=text(76+common*scale,47,`多${v}`,17,C.b);
 eq=`${c.total}−${v}=${left}`;note=k?"黄色部分属于甲，不属于乙。":"拖动改变黄色差值，观察乙怎样变化。";break;
}
case "fractions":{
 const denom=Math.max(2,Math.round(v)); const q1=6/2,step=560/denom;
 z+=text(34,39,"整体A：6个苹果，取一半",19)+box(42,58,560,56,C.low)+box(42,58,280,56,C.a);
 z+=text(620,95,`3个`,19,C.a);
 const selected=Math.max(1,Math.min(denom,Math.round(state.selected||1))),actual=12*selected/denom;
 z+=text(34,155,`整体B：12个苹果，取${selected}/${denom}`,19);
 for(let j=0;j<denom;j++)z+=box(42+j*step,173,step-3,57,j<selected?C.b:C.low,3,`data-part-index="${j}"`);
 z+=text(620,211,`${nice(actual)}个`,17,C.b)+text(44,270,k?"换个整体比较，结果可能反转。":"点击下面的分数格，改变选中的份数。",17,C.muted);
 eq=`6×1/2=${nice(q1)}；12×${selected}/${denom}=${nice(actual)}`;
 note="同一个分数，必须先说清楚‘整体’是什么。";break;
}
case "groups":{
 if(c.cut){
 const rows=Math.round(v),cols=c.unit||4,cut=c.cut,size=Math.min(46,410/cols,165/rows);
 z+=text(34,37,"从每一行拿走同样的部分",20);
 for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
 const x=38+col*(size+5)+(k&&col>=cut?20:0),y=65+row*(size+5);
 z+=box(x,y,size,size,col<cut?C.a:C.b,3,'data-scene-action="regroup"');
 }
 z+=text(38,270,k?"这两块重组后，剩下的总格数不变。":"点击色块切开，观察每一行都怎样分割。",17,C.muted);
 eq=`${rows}×(${cols}−${cut})=${rows*cols}−${rows*cut}=${rows*(cols-cut)}`;
 note="拿掉的黄色部分也是每一行都有，不能漏乘。";
 }else{
 const n=c.group||4,unit=c.unit||25,total=v*n*unit;
 z+=text(34,35,`共有${v}组，每组${n}个${unit}`,20);
 if(k){
 for(let i=0;i<v;i++){const x=40+i*100;z+=box(x,80,86,99,C.a,10,'data-scene-action="regroup"')+text(x+43,138,String(n*unit),24,C.dark,"middle");}
 }else{
 for(let i=0;i<v;i++)for(let j=0;j<n;j++){
 const x=36+i*104+j*22;z+=box(x,91,19,62,j%2?C.b:C.a,3,'data-scene-action="regroup"');
 }
 }
 z+=text(38,241,"点击色块：四个25先组成一个100。",19,C.b);
 eq=`${v}×(${n}×${unit})=${total}`;
 note="重组数学对象，不需要先做竖式。";
 }break;
}
case "balance":{
 const sum=v+c.add,target=m.id==="b04"?12:sum,removed=k?c.add:0;
 const left=v+c.add-removed,right=target-removed;
 const tilt=Math.max(-9,Math.min(9,(left-right)*2));
 z+=text(30,35,k?"左右各移走相同数量":"未知数＋已知数，与目标比较",19);
 z+=`<g data-scene-action="remove" transform="rotate(${tilt} 357 148)">`+path("M128 150 H586",C.a,9)+box(126,100,147,48,C.c)+box(436,100,147,48,C.c)+text(199,132,String(left),24,C.ink,"middle")+text(508,132,String(right),24,C.ink,"middle")+"</g>";
 z+=`<polygon points="343,153 371,153 357,224" fill="${C.b}"/>`+box(308,226,98,14,C.d);
 eq=k?`${v} 与 ${target-c.add} 比较`:`${v}+${c.add} 与 ${target} 比较`;
 note=left===right?"两端平衡，等量关系成立。":"调节未知数，让天平重新达到水平。";break;
}
case "area":{
 const w=Math.round(v),h=c.height||4,size=33,xx=40,yy=64;
 if(state.spatial){
 const depth=2,dx=35,dy=17,dz=29;
 z+=text(30,36,"立体积木：看不见的方块也要数",19);
 const poly=(coords,fill)=>`<polygon points="${coords}" fill="${fill}" stroke="#254254" stroke-width="1.1"/>`;
 const layers=k?depth:1;
 for(let layer=0;layer<layers;layer++)for(let i=h-1;i>=0;i--)for(let j=0;j<w;j++){
  const px=70+j*dx+i*dy,py=183-i*15+4*j-layer*dz;
  z+=poly(`${px},${py} ${px+dx},${py+4} ${px+dx+dy},${py-11} ${px+dy},${py-15}`,layer?C.a:C.c);
  z+=poly(`${px},${py} ${px+dx},${py+4} ${px+dx},${py+23} ${px},${py+19}`,C.a);
  z+=poly(`${px+dx},${py+4} ${px+dx+dy},${py-11} ${px+dx+dy},${py+8} ${px+dx},${py+23}`,C.low);
 }
 z+=text(465,102,`底面 ${w*h} 块`,20,C.ink)+text(465,147,"堆叠 2 层",19,C.b)+text(465,194,`总体 ${w*h*depth} 块`,22,C.a);
 z+=text(30,268,k?"两层都展示：别忘记被遮住的方块。":"只看底层时，记得还有另一层。",16,C.muted);
 eq=`每层 ${w}×${h}=${w*h}；两层 ${w*h*2}`;
 note="旋转视角前，先预测隐藏层有多少个小方块。";
 }else{
  if(k&&w===6){
   for(let i=0;i<4;i++)for(let j=0;j<6;j++)z+=box(32+j*27,86+i*27,25,25,C.a,2);
   for(let i=0;i<3;i++)for(let j=0;j<8;j++)z+=box(330+j*27,100+i*27,25,25,C.c,2);
   z+=text(40,232,"6×4：周长20",17,C.b)+text(337,232,"8×3：周长22",17,C.b);
   eq="两块面积都是24，但周长不同";
   note="找反例：同样多的内部方格，边界长度可以不同。";
  }else{
   for(let i=0;i<h;i++)for(let j=0;j<w;j++)z+=box(xx+j*(size+2),yy+i*(size+2),size,size,(i+j)%2?C.a:C.c,2);
   z+=path(`M ${xx-3} ${yy-3} h${w*(size+2)} v${h*(size+2)} h${-w*(size+2)} Z`,C.b,4);
   z+=text(390,100,`长 ${w} × 宽 ${h}`,22)+text(390,147,`面积 ${w*h}格`,24,C.a)+text(390,193,`周长 ${2*(w+h)}格`,23,C.b);
   eq=`面积 ${w*h}；周长 ${2*(w+h)}`;
   note=k?"对比另一种长宽组合，面积相同可能周长不同。":"绿色方格是面积；黄色边界是周长。";
  }
 }
 break;
}
case "machine":{
 const mul=c.mul,add=c.add,out=mul*v+add,canInvert=mul!==0;
 const list=[String(v),`×${mul}`,String(v*mul),`+${add}`,String(out)];
 for(let i=0;i<5;i++){let x=25+i*139;
 if(i%2===0){z+=box(x,95,110,90,i===0?C.a:i===2?C.c:C.b,12)+text(x+55,150,list[i],27,i===0||i===4?C.dark:C.ink,"middle");}
 else{z+=path(`M ${x-12} 140 H${x+103}`,C.d,3)+text(x+50,122,list[i],21,C.ink,"middle");}}
 if(k){z+=path("M 650 222 H 80",C.a,4,'stroke-dasharray="9 7"')+text(232,254,canInvert?`倒推：先−${add}，再÷${mul}`:"乘0会丢失输入信息，无法唯一逆推",18,C.b);}
 eq=`${v}×${mul}+${add}=${nice(out)}`;
 note=canInvert?"倒推时先撤销最后一步；不能按原顺序倒着猜。":"任意输入乘0都得到0，所以除0无定义。";break;
}
case "ratio":{
 const a=c.a*v,b=c.b*(k?1:v),factor=15;
 z+=text(32,39,`面粉 ${c.a}份：水 ${c.b}份`,20);
 z+=text(34,79,"面粉",18)+box(116,58,a*factor,58,C.a)+text(127,96,String(a),20,C.dark);
 z+=text(34,168,"水",18)+box(116,146,b*factor,58,k?C.d:C.b)+text(128,184,String(b),20,C.dark);
 z+=text(35,245,k?"如果只增加面粉，比例会被破坏。":"同时增减两种材料，味道保持。",18,k?C.b:C.a);
 eq=`当前面粉:水 = ${a}:${b}`;
 note=k?"这是特意展示的错误配比，用来寻找反例。":"两种量乘同样倍数，比例才保持。";break;
}
case "line":{
 const scale=28,ox=358,oy=154,start=c.start||0,phys=v,translated=c.subtract?-v:v;
 z+=path("M 35 154 H690",C.muted,3);
 for(let n=-11;n<=11;n++){let x=ox+n*scale;z+=path(`M${x} 143 V166`,C.low,2);if(n%2===0)z+=text(x,189,n,12,C.muted,"middle");}
 let sx=ox+start*scale,px=ox+phys*scale;
 if(c.mirror){
 z+=dot(px,oy,10,C.a)+dot(ox-phys*scale,oy,10,C.b)+path(`M${px} 111 H${ox-phys*scale}`,C.d,3,'stroke-dasharray="6 5"');
 }else if(c.compare){
 z+=dot(px,oy,10,C.a)+dot(sx,oy,10,C.b);
 }else if(c.journey||c.subtract){
 let ex=ox+(start+translated)*scale;z+=dot(sx,oy,9,C.a)+dot(ex,oy,11,C.b)+path(`M${sx} 113 Q${(sx+ex)/2} 40 ${ex} 113`,C.a,4);
 }else{
 z+=dot(px,oy,12,C.b)+path(`M${ox} 108 H${px}`,C.a,4);
 }
 z+=text(35,48,c.subtract?"减去负数：分清减法与符号":c.journey?"起点＋位移＝终点":c.mirror?"相反数是0两侧的镜像":c.distance?"位置可负，距离不负":c.compare?"数轴右边更大":"方向由参照系决定",19);
 const result=c.journey||c.subtract?start+translated:phys;
 eq=c.mirror?`${nice(v)} 的相反数 = ${nice(-v)}`:c.distance?`位置 ${v}；距离 ${Math.abs(v)}`:c.subtract?`${start}−(${v})=${nice(result)}`:c.journey?`${start}+(${v})=${nice(result)}`:c.compare?`${start} 与 ${v}，右侧更大`:`实际位置 ${v}；${k?"向左为正，读数 "+(-v):"向右为正，读数 "+v}`;
 note=c.subtract?"减去一个量，等于加上它的相反数。":"沿数轴直接操作点，找大小、方向、距离或运算。";break;
}
case "signed":{
 if(m.id==="r02"){z+=text(42,48,"同样的横线，承担不同职责",20);
 z+=box(49,98,264,104,C.c,14)+box(370,98,289,104,C.a,14);
 z+=text(180,140,v,29,C.ink,"middle")+text(509,140,`5−(${v})`,29,C.dark,"middle");
 z+=text(180,178,"数的符号",15,C.ink,"middle")+text(509,178,"运算符号",15,C.dark,"middle");
 eq=`数卡：${v}；运算：5−(${v})=${5-v}`;note="数字属于什么数，与减号正在做什么，是两个问题。";
 }else{
 const positive=c.positive||5,negative=Math.abs(v),unit=39;

function roleSvg(id){const r=CAST.find(x=>x.id===id)||CAST[0], uid="g"+id;return '<svg viewBox="0 0 180 235" width="100%" height="100%" aria-label="'+r.name+'"><defs><radialGradient id="'+uid+'s" cx=".35" cy=".28" r=".8"><stop stop-color="#ffe4ca"/><stop offset=".65" stop-color="'+r.skin+'"/><stop offset="1" stop-color="#a96c5a"/></radialGradient><linearGradient id="'+uid+'c" x1="0" x2="1" y1="0" y2="1"><stop stop-color="'+r.color+'"/><stop offset="1" stop-color="#26434d"/></linearGradient><linearGradient id="'+uid+'h"><stop stop-color="'+r.hair+'"/><stop offset="1" stop-color="#151f29"/></linearGradient></defs><ellipse cx="91" cy="223" rx="66" ry="9" fill="#00172488"/><path d="M24 232Q18 161 56 150L118 150Q157 158 157 232Z" fill="url(#'+uid+'c)"/><path d="M62 148L89 182L118 148L105 139H75Z" fill="#eef1e9"/><rect x="76" y="126" width="29" height="32" rx="12" fill="url(#'+uid+'s)"/><ellipse cx="90" cy="83" rx="56" ry="67" fill="url(#'+uid+'h)"/><ellipse cx="90" cy="87" rx="46" ry="56" fill="url(#'+uid+'s)"/><path d="M44 70Q33 17 89 19Q141 17 137 73Q109 57 100 41Q77 68 44 70" fill="url(#'+uid+'h)"/><ellipse cx="46" cy="87" rx="7" ry="11" fill="'+r.skin+'"/><ellipse cx="135" cy="87" rx="7" ry="11" fill="'+r.skin+'"/><g class="eyes"><ellipse cx="72" cy="88" rx="7" ry="10" fill="#fff8ed"/><ellipse cx="109" cy="88" rx="7" ry="10" fill="#fff8ed"/><ellipse cx="74" cy="89" rx="4" ry="6" fill="#25323b"/><ellipse cx="107" cy="89" rx="4" ry="6" fill="#25323b"/><circle cx="75" cy="86" r="1.5" fill="white"/><circle cx="108" cy="86" r="1.5" fill="white"/></g><path d="M60 73Q70 67 81 73M99 73Q109 67 120 73" stroke="'+r.hair+'" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M90 91l-4 14h8" stroke="#c48771" stroke-width="2" fill="none"/><ellipse cx="59" cy="105" rx="9" ry="5" fill="#e99788" opacity=".5"/><ellipse cx="121" cy="105" rx="9" ry="5" fill="#e99788" opacity=".5"/><path class="mouth" d="M79 116Q90 126 102 116Q90 120 79 116" fill="#8b4248"/>'+(r.style==="glasse function actor(id,mood="Explain"){let a=$("actor");if(!a)return;a.classList.remove("arrive");a.innerHTML='<div class="tag">'+roleName(id)+'</div><div class="render">'+(id==="lin"?'<img src="'+ART["m"+mood]+'" alt="林老师">':roleSvg(id))+'</div><b>'+name(id)+'</b>';void a.offsetWidth;a.classList.add("arrive")}
function showLine(id,text,mood){actor(id,mood);let el=$("speech");if(el){el.innerHTML="<b>"+name(id)+"</b>";el.append(document.createTextNode(text))}}
function say(sequence){halt();lastTalk=sequence.slice();const n=++token;let first=sequence[0];if(!first)return;showLine(first[0],first[1],first[2]||"Explain");if(!voiceOn||!window.speechSynthesis||!window.SpeechSynthesisUtterance){let e=$("speech");if(e&&sequence.length>1)e.append(document.createTextNode("  "+sequence.slice(1).map(x=>name(x[0])+"："+x[1]).join(" ")));return}const voices=speechSynthesis.getVoices().filter(x=>/^zh/i.test(x.lang)),female=voices.find(x=>/xiaoxiao|ting|female|xiaoyi|hui|mei|女/i.test(x.name))||voices[0]||null,alt=voices.find(x=>x!==female)||female;
activeUtter=sequence.map((x,i)=>{let u=new SpeechSynthesisUtterance(x[1]);u.lang="zh-CN";u.rate=rate;u.pitch=x[0]==="lin"?1.07:CAST.find(r=>r.id===x[0])?.voice||1;u.voice=x[0]==="solver"||x[0]==="thinking"?alt:female;u.onstart=()=>{if(n!==token)return;showLine(x[0],x[1],x[2]||"Explain");$("actor")?.classList.add("speaking")};u.onend=u.onerror=()=>{if(n===token)$("actor")?.classList.remove("speaking")};return u});activeUtter.forEach(u=>speechSynthesis.speak(u))}
function one(id,text,mood){say([[id,text,mood]])}
$("voice").onclick=()=>{voiceOn=!voiceOn;$("voice").textContent=voiceOn?"🔊 声音开":"🔇 开声";if(voiceOn)say(lastTalk.length?lastTalk:[["lin","欢迎来到数学剧场。"]]);else halt()};$("replay").onclick=()=>{voiceOn=true;$("voice").textContent="🔊 声音开";say(lastTalk.length?lastTalk:[["lin","欢迎。"]])};$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};$("home").onclick=home;
function enable(){if(first){first=false;voiceOn=true;$("voice").textContent="🔊 声音开"}}
function home(){halt();phase="home";current=null;root.innerHTML='<section class="hero"><div class="copy"><div class="eyebrow">V9.1 · 有声数学剧场</div><h1>你来挑战，<br>高手来陪练。</h1><p>老师们说话、演示、提问。你只管看、想、点、算。</p><button class="primary" id="welcome">🔊 听林老师说</button><p id="welcomeLine">今天想攻克哪一个数学问题？</p></div><img class="teacher" src="'+ART.mListen+'" alt="林老师原版立绘"></section><div class="tracks">'+[["m","01","期中错题","6个重点任务 · 原版高手专场"],["3","02","第三章 · 代数式","6场教材实验"],["4","03","第四章 · 整式的加减","8场教材实验"]].map(c=>'<button class="track" data-g="'+c[0]+'"><span class="number">'+c[1]+'</span><b>'+c[2]+'</b><small>'+c[3]+'</small></button>').join("")+'</div>';$("welcome").onclick=()=>{enable();voiceOn=true;$("voice").textContent="🔊 声音开";one("lin","欢迎回来！今天我们先选一个方向。你可以自己挑战，不会的时候再叫高手。")};root.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{enable();menu(b.dataset.g)})}
function menu(g){halt();group=g;phase="menu";current=null;root.innerHTML='<div class="eyebrow">选择一场挑战</div><h1>'+({m:"期中错题攻克",3:"第三章 · 代数式",4:"第四章 · 整式的加减"}[g])+'</h1><div class="menu">'+LESSONS.filter(l=>l.group===g).map(l=>'<button class="tile" data-id="'+l.id+'"><span>'+esc(l.label)+'</span><b>'+esc(l.title)+'</b><small>'+((notes.some(x=>x.id===l.id&&x.type==="transfer_correct"))?"已完成一次迁移":"待挑战")+'</small></button>').join("")+'</div><div class="controls" style="margin-top:15px"><button id="due">三天后复测</button>'+(g==="m"?'<a href="expert.html" style="color:#a6ebd5">打开继承V5.12的完整高手课堂</a>':'')+'</div><div class="speech" id="speech" style="margin-top:15px"></div>';root.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>start(b.dataset.id));$("due").onclick=()=>{let l=LESSONS.find(l=>l.group===group&&notes.some(x=>x.id===l.id&&x.type==="transfer_correct"&&Date.now()-x.at>=259200000)&&!notes.some(x=>x.id===l.id&&x.type==="review_correct"&&Date.now()-x.at<259200000));if(l)start(l.id,true);else one("lin","还没有到复测时间的任务。")};one("lin","选一个你想攻克的问题。")}
function start(id,review=false){current=LESSONS.find(x=>x.id===id);if(!current)return;phase=review?"review":"original";st={value:current.lesson?.cfg.v??0,mode:0,ch4Selected:-1,ch4Revealed:[],hints:0,attempts:0,pred:null};evidence("start",{review});render();one("lin",review?"复测开始。先独立完成，不看讲解。":"先自己挑战。需要帮助，就点击请高手。","Listen")}
function shell(ind){const prog={original:15,experiment:45,retry:65,transfer:85,review:85,done:100}[phase];root.innerHTML='<section class="stage '+(ind?"independent":"")+'"><div class="stageTop"><button id="back">‹ 换题</button><b>'+esc(current.label)+' · '+esc(current.title)+'</b><span class="space"></span><span class="phase">'+({original:"独立挑战",experiment:"高手实验现场",retry:"再次挑战",transfer:"陌生迁移",review:"延迟复测",done:"挑战完成"}[phase])+'</span></div><div class="meter"><i style="width:'+prog+'%"></i></div><div class="scene"><aside id="actor" class="actor"></aside><div class="math" id="math"></div></div><div class="dock"><div class="speech" id="speech"></div><div class="controls" id="controls"></div></div></section>';$("back").onclick=()=>menu(group)}
function render(){halt();shell(phase!=="experiment");if(phase==="experiment"){experiment();return}if(phase==="done"){$("math").innerHTML='<div class="eyebrow">独立挑战记录已保存</div><h1>这一关，你自己完成了。</h1><p>以后再用新题检验是否真正掌握。</p>';$("controls").innerHTML='<button class="primary" id="next">下一题</button><button id="rocket">🚀 发射火箭</button><button id="end">今天到这里</button>';$("next").onclick=()=>menu(group);$("end").onclick=home;$("rocket").onclick=rocket;return}
let tr=phase==="transfer"||phase==="review",l=current.lesson,q=l?(tr?l.transfer:l.q):null;$("math").innerHTML='<div class="eyebrow">'+(tr?"不看提示 · 换条件再挑战":"先独立作答")+'</div><div class="question">'+esc(q?q.text:tr?current.transferText:current.original)+'</div><div id="answer"></div><div id="feedback" class="feedback"></div><div id="scratchbox" class="hide"><canvas id="scratch" class="scratch"></canvas><button id="clear">清空</button></div>';
if(q){let order=q.opts.map((_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}$("answer").innerHTML='<div class="opts">'+order.map(i=>'<button data-opt="'+i+'">'+esc(q.opts[i])+'</button>').join("")+'</div>';$("answer").querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>grade(Number(b.dataset.opt)===q.answer))}else{$("answer").innerHTML='<div class="answer"><input id="input" inputmode="decimal" placeholder="答案，多个用逗号分隔"><button class="primary" id="submit">检查</button></div><div class="keypad">'+["1","2","3","4","5","6","7","8","9","0","−","/",",",".","⌫"].map(x=>'<button data-key="'+x+'">'+x+'</button>').join("")+'</div>';$("submit").onclick=()=>{let a=$("input").value;if(a.trim())grade(equal(a,tr?current.transferAnswer:current.answer))};$("input").onkeydown=e=>{if(e.key==="Enter")$("submit").click()};$("answer").querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{$("input").value=b.dataset.key==="⌫"?$("input").value.slice(0,-1):$("input").value+b.dataset.key})}
$("controls").innerHTML='<button id="scratchBtn">草稿本</button><button id="help">'+(tr?"暂时不会，返回实验":"请高手帮忙")+'</button>';$("scratchBtn").onclick=()=>{$("scratchbox").classList.toggle("hide");if(!$("scratchbox").classList.contains("hide"))scratch()};$("help").onclick=()=>{st.hints++;evidence("hint",{phase});phase="experiment";render();say([["lin","请"+name(current.role)+"上场。只研究这个关键关系。"],[current.role,current.lesson?.action||current.hint]])}}
function equal(a,b){function nums(s){return s.replace(/−/g,"-").trim().split(/[,，、;；\s]+/).filter(Boolean).map(x=>{if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?\d+(?:\.\d+)?)?$/.test(x))return NaN;let z=x.split("/").map(Number);return z.length===2?z[0]/z[1]:z[0]}).sort((x,y)=>x-y)}let x=nums(a),y=nums(b);return x.length===y.length&&x.every((n,i)=>Number.isFinite(n)&&Math.abs(n-y[i])<1e-6)}
function grade(ok){st.attempts++;evidence("answer",{phase,correct:ok,hints:st.hints});if(!ok){$("feedback").textContent="还没通过。检查一下，或者请高手。";one("checker","先别急。看看条件、符号和运算有没有遗漏。");return}if(phase==="transfer"||phase==="review"){evidence(phase==="review"?"review_correct":"transfer_correct",{hints:st.hints,attempts:st.attempts});phase="done";render();one("lin","这次挑战通过。记录下来，之后再复测。","Celebrate")}else{phase="transfer";render();one("lin","原题通过。换一道没有讲过的题，自己完成。","Listen")}}
function scratch(){let c=$("scratch");if(c.dataset.ok)return;c.dataset.ok=1;c.width=c.clientWidth*2;c.height=c.clientHeight*2;let ctx=c.getContext("2d"),down=false;ctx.strokeStyle="#244050";ctx.lineWidth=3;ctx.lineCap="round";function pos(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=c.onpointercancel=()=>down=false;$("clear").onclick=()=>ctx.clearRect(0,0,c.width,c.height)}
function experiment(){let l=current.lesson;actor(current.role);if(!l){$("math").innerHTML='<div class="eyebrow">期中原版高手专场</div><h2>'+esc(current.title)+'</h2><p>保留 V5.12 全部原有动画、人物、语音接力和分步互动。</p><a class="primary" href="expert.html?lesson='+current.id.slice(1)+'" style="display:inline-block;text-decoration:none;padding:16px;border-radius:12px">进入完整高手课堂 →</a><p>完成后可返回本馆进行独立挑战。</p>';$("controls").innerHTML='<button class="primary" id="retry">我来自己做</button>';$("retry").onclick=retry;return}
$("math").innerHTML='<div id="viz"></div><div class="controls"><label class="label">改变数学条件 <b id="value"></b></label><input id="range" type="range" class="range" min="'+l.cfg.min+'" max="'+l.cfg.max+'" step="1" value="'+st.value+'"></div><div id="miniQuestion"></div>';$("controls").innerHTML='<button id="play">▶ 动态演示</button><button id="mode">切换观察方式</button><button id="ask">高手问我</button><button class="primary" id="retry">我来独立挑战</button>';
$("range").oninput=e=>{st.value=Number(e.target.value);draw();evidence("experiment_change",{value:st.value})};$("mode").onclick=()=>{st.mode=st.mode?0:1;draw();one(current.role,"观察同一对象的另一种表达。")};$("play").onclick=()=>animate();$("ask").onclick=()=>ask();$("retry").onclick=retry;draw()}
function draw(){let l=current.lesson;if(!l||!$("viz"))return;$("viz").innerHTML=window.ARENA_VISUALS.render(l,st);$("value").textContent=st.value;$("range").value=st.value}
function animate(){let l=current.lesson;if(!l)return;halt();let seq=l.scene==="ch4-brackets"?[0,1,2]:null;let start=performance.now(),duration=seq?3000:2600,from=l.cfg.min,to=l.cfg.max;st.mode=0;st.ch4Revealed=[];one(current.role,l.action);function tick(t){if(phase!=="experiment")return;let f=Math.min(1,(t-start)/duration);if(seq){st.value=-1;st.ch4Revealed=seq.slice(0,Math.min(3,Math.floor(f*3)+1));st.ch4Selected=st.ch4Revealed.at(-1)}else{st.value=Math.round(from+(to-from)*f)}draw();if(f<1)raf=requestAnimationFrame(tick);else evidence("animation_complete")};raf=requestAnimationFrame(tick)}
function ask(){let q=current.lesson.q;let box=$("miniQuestion");box.innerHTML='<div class="label">高手的问题</div><h2>'+esc(q.text)+'</h2><div class="opts">'+q.opts.map((x,i)=>'<button data-mini="'+i+'">'+esc(x)+'</button>').join("")+'</div>';one(current.role,q.text);box.querySelectorAll("[data-mini]").forEach(b=>b.onclick=()=>{let ok=Number(b.dataset.mini)===q.answer;evidence("prediction",{correct:ok});b.classList.add(ok?"correct":"wrong");one(ok?current.role:"checker",ok?q.reason:"再观察数学对象，想想关系是否正确。")})}

root.addEventListener("pointerdown",e=>{if(phase!=="experiment"||!current?.lesson||e.target.closest("[data-ch4-action]"))return;let svg=e.target.closest('svg[data-drag="1"]');if(svg){drag=svg.getBoundingClientRect();e.preventDefault()}});document.addEventListener("pointermove",e=>{if(!drag||phase!=="experiment"||!current?.lesson)return;let c=current.lesson.cfg;st.value=Math.round(c.min+Math.max(0,Math.min(1,(e.clientX-drag.left)/drag.width))*(c.max-c.min));draw()});document.addEventListener("pointerup",()=>drag=null);document.addEventListener("pointercancel",()=>drag=null);
function rocket(){let d=document.createElement("div");d.className="flight";d.innerHTML='<div><div class="rocket">🚀</div><h2>挑战成功！</h2><button>返回</button></div>';document.body.append(d);d.querySelector("button").onclick=()=>d.remove();one("lin","火箭升空！这是你完成挑战获得的奖励。","Celebrate")}
