'use strict';
const LIB=[
{id:'q23',name:'数轴双动点',title:'相遇与距离',num:23,
 description:'A表示−2、B表示8。题目【背景知识】已给：距离=|a−b|，中点=(a+b)÷2。P从A向右每秒3格，Q从B向左每秒2格。',
 rule:'距离公式与中点公式题目已经给了，先抄下来再用；位置式=起点＋方向×速度×t。',duration:3,
 steps:[
 {q:'出发1秒，P和Q分别在哪里？',choices:['P=1，Q=6','P=−5，Q=10','P=3，Q=2'],answer:0,
  why:'P=−2+3×1=1；Q=8−2×1=6。方向决定正负：向右加、向左减。',hint:'向右坐标增加，向左坐标减少。'},
 {q:'按照原来的速度，两点在多少秒后相遇？',expected:[2],placeholder:'写秒数',
  why:'−2+3t=8−2t ⇒ 5t=10 ⇒ t=2（相遇点：−2+3×2=4）。相遇就是两个位置式相等。',hint:'让两个位置式相等，先别急着代数字。'},
 {q:'原卷第3问：PQ=½AB 时，t 有哪两个值？',expected:[1,3],placeholder:'两个时间用逗号隔开',
  why:'AB=|−2−8|=10，½AB=5。PQ=|(−2+3t)−(8−2t)|=|5t−10|=5 ⇒ 5t−10=−5 或 5 ⇒ t=1 或 3。相遇前、相遇后各一次。',
  hint:'越过相遇点后，距离会重新拉开，别只找一个。'}
 ]},
{id:'q22',name:'四格新运算',title:'看懂新规则',num:22,
 description:'规定 |a b; c d| = ad−bc。主对角线相乘，减副对角线相乘。',
 rule:'先标清 a、b、c、d 各是谁；能化简就先化简，再整体代入。',duration:3,
 steps:[
 {q:'|−1 2; −3 4| 的结果是什么？',choices:['−10','2','10'],answer:1,
  why:'(−1)×4−2×(−3)=−4+6=2。减负数等于加它的相反数。',hint:'先算左上×右下，再减右上×左下。'},
 {q:'|2x−1 3x; 2 1| = 3，x 等于多少？',expected:[-1],placeholder:'填写 x',
  why:'(2x−1)×1−3x×2=3 ⇒ −4x−1=3 ⇒ −4x=4 ⇒ x=−1。',hint:'含 x 的项相减时，符号最容易漏。'},
 {q:'原卷第3问：m、n 互为相反数，求 |−3m+1 3; −n −1| 的值。',expected:[-1],placeholder:'填写结果',
  why:'(−3m+1)(−1)−3×(−n)=3m−1+3n=3(m+n)−1；m+n=0 ⇒ −1。先化简出能整体代入的一块。',
  hint:'互为相反数先翻成一条能用的关系，再找式子里哪一块能整块换掉。'}
 ]},
{id:'q21',name:'仓库双账本',title:'为什么少了12吨？',num:21,
 description:'进出库净变化，与搬运运费是两种账。库存按带符号求和，运费按搬运吨数算。',
 rule:'正负分堆先各自合起来；运费这一问不带负号。',duration:5,
 steps:[
 {q:'进出库记录 −8、+5、−6、+3、−6 吨，库存净变化多少吨？',choices:['减少6吨','减少12吨','增加12吨'],answer:1,
  why:'负数一堆：−8−6−6=−20；正数一堆：5+3=8；合计 −12，即减少12吨。',hint:'先把所有入库加起来，再减去所有出库。'},
 {q:'运进8吨每吨40元，运出20吨每吨70元，总运费是多少？',expected:[1720],placeholder:'运费（元）',
  why:'8×40+20×70=320+1400=1720（元）。这项原卷已经做对了。',hint:'不要把出库吨数的负号带进运费里。'},
 {q:'运出费用改成每吨80元，总费用现在是多少？',expected:[1920],placeholder:'运费（元）',
  why:'只变了单价：20×(80−70)=200；1720+200=1920（元）。',hint:'只要算增加的那部分，不必整题重算。'}
 ]},
{id:'q20',name:'重叠面积',title:'交叉处为什么要加回',num:20,
 description:'长 a、宽 b 的长方形绿地，横竖各一条宽 1 的小路。求空白面积，再代入 a=3、b=2。',
 rule:'两条路都被减了一次，交叉的 1×1 被减了两次，要加回一次。',duration:4,
 steps:[
 {q:'空白面积的式子是哪一个？',choices:['ab−a−b−1','ab−a−b+1','ab−a−b'],answer:1,
  why:'总面积 ab；横路 a×1=a、竖路 b×1=b；交叉 1×1=1 被减了两次，加回一次 ⇒ ab−a−b+1。',hint:'想想那个交叉的小方块，被数了几次。'},
 {q:'当 a=3、b=2 时，空白面积是多少？',expected:[2],placeholder:'填写面积',
  why:'3×2−3−2+1=6−5+1=2；也可把路推到边上：(3−1)(2−1)=2。',hint:'把数值代回去，顺便检验上一问的式子。'},
 {q:'换一组数：a=5、b=4 时，空白面积是多少？',expected:[12],placeholder:'填写面积',
  why:'(a−1)(b−1)=(5−1)(4−1)=12；展开式 20−5−4+1=12，两边对得上。',hint:'把小路推到边上，会变成一个更小的长方形。'}
 ]},
{id:'q19',name:'偶次幂与分支',title:'别漏掉第二种可能',num:19,
 description:'a、b互为倒数，m是最大的负整数，|n|=2。为什么会有两个答案？',
 rule:'负一的偶次幂是1；绝对值表示距离，要保留正负两条分支。',duration:3,
 steps:[
 {q:'m²⁰²⁶ 的结果是多少？',choices:['−1','1','2026'],answer:1,
  why:'m=−1，(−1)²⁰²⁶=1（负一的偶次幂为正）。注意 −1²⁰²⁶ 与 (−1)²⁰²⁶ 不一样。',hint:'两个负一相乘等于正一，先写前四次找规律。'},
 {q:'ab−n+m²⁰²⁶，全部可能值是哪两个？',expected:[0,4],placeholder:'两个结果用逗号隔开',
  why:'ab=1、m²⁰²⁶=1 ⇒ 式子是 2−n；n=2 得 0，n=−2 得 4。',hint:'|n|=2 不意味着 n 只能取 2。'},
 {q:'如果 |n|=3、指数为 2024，结果有哪两个？',expected:[-1,5],placeholder:'两个结果用逗号隔开',
  why:'仍有 ab=1、偶次幂=1 ⇒ 2−n；n=3 得 −1，n=−3 得 5。',hint:'把绝对值条件拆成两条路，各自代一遍。'}
 ]},
{id:'q18',name:'次数与项数',title:'两个条件同时成立',num:18,
 description:'2xᵐy²−(n−3)x+1 要成为关于 x、y 的三次二项式。项数和次数缺一不可。',
 rule:'二项式=化简后只剩两项；单项式次数=所有字母指数之和。',duration:3,
 steps:[
 {q:'为了使中间那一项消失，n 取多少？',choices:['2','3','4'],answer:1,
  why:'让系数为零：n−3=0 ⇒ n=3。不是把项划掉，是让它消失。',hint:'中间项系数要等于零。'},
 {q:'最高次数为 3，m 是多少？',expected:[1],placeholder:'填写 m',
  why:'xᵐy² 的次数是 m+2（y 也贡献 2 次）；m+2=3 ⇒ m=1。',hint:'别只数 x 的指数，y 也贡献次数。'},
 {q:'换条件：5xᵏy+7 是四次二项式，k 是多少？',expected:[3],placeholder:'填写 k',
  why:'xᵏy 的次数是 k+1；k+1=4 ⇒ k=3。系数 5 不参与次数。',hint:'别忽略 y 本身贡献一次。'}
 ]},
{id:'q10',name:'循环规律',title:'2025次输出是多少？',num:10,
 description:'从 48 出发，偶数除以 2、奇数加 3。已知第 1 次输出是 24，求第 2025 次输出。',
 rule:'起点 48 不算第 1 次输出；先写出前几项找到循环，再核对序号。',duration:9,
 steps:[
 {q:'48→24→12→6→3，下一次输出是多少？',choices:['0','6','3'],answer:1,
  why:'3 是奇数，+3 得 6；6 是偶数，÷2 又回到 3，于是 3⇄6 循环。',hint:'先判断 3 是奇数还是偶数。'},
 {q:'如果第 1 次输出 24，第 2025 次输出是多少？',expected:[6],placeholder:'填写数字',
  why:'输出依次 24,12,6,3,6,3…；从第 3 次起奇数序号 6、偶数序号 3；2025 是奇数 ⇒ 6。',hint:'从第几次开始重复？几个一循环？'},
 {q:'新起点 96，规则不变。第 2025 次输出是多少？',expected:[3],placeholder:'填写数字',
  why:'96→48→24→12→6→3→6…；起点变了，进入循环的序号也变了，2025 落在 3。',hint:'别套上一步的结论，重新定循环的起点。'}
 ]}

function normalizeAnswer(s){return String(s).trim().toLowerCase().replace(/[−－]/g,'-').replace(/[＋]/g,'+').replace(/\s+/g,'').replace(/[，、；;]/g,',');}
function lessonCorrect(v,a){let x=normalizeAnswer(v),y=normalizeAnswer(a);if(!x)return false;if(y.includes(',')){let l=x.split(',').sort(),r=y.split(',').sort();return l.length===r.length&&l.every((v,i)=>v!==''&&Number(v)===Number(r[i]));}return x===y||(/^[-+]?\d+(\.\d+)?$/.test(x)&&/^[-+]?\d+(\.\d+)?$/.test(y)&&Number(x)===Number(y));}

 const next=i=>{if(epoch!==token||!$('lessonScene')||i>=segments.length)return;let [phase,line]=segments[i];directorPhase=phase;let guide=document.querySelector('.lessonGuide p');if(guide)guide.textContent=line;paintLesson(0);let start=performance.now(),duration=Math.max(1000,line.length*90),audioDone=muted,animDone=false,advanced=false;const advance=()=>{if(epoch!==token||advanced||!audioDone||!animDone)return;advanced=true;next(i+1)};if(!muted){speakLine(line,function(){audioDone=true;advance()})}

function renderLesson(play=false){view='game';const a=LESSONS[w][q][lessonStep],list=LESSONS[w][q],key=lessonKey()+'-'+lessonStep,show=!!solved[key]||!a[2]||lessonMode==='teacher';$('hdr').textContent=`第${LIB[w].num}题 · 分步讲解`;root.innerHTML=`<div class="mission-head"><div><div class="eyebrow">第${q+1}问 · 第${lessonStep+1}/${list.length}步</div><h2>${W[w].names[q]}</h2></div><button id="lessonGame">独立挑战</button></div><div class="lessonmodes"><button id="modeTeacher" class="${lessonMode==='teacher'?'selected':''}">老师带我做</button><button id="modeTogether" class="${lessonMode==='together'?'selected':''}">一起做</button><button id="lessonPaper">草稿板</button></div><details class="originaldetails"><summary>查看原题与条件</summary><p>${esc(LIB[w].description)}</p><p>${esc(LIB[w].steps[q].q)}</p></details><div class="guide lessonGuide"><img src="${portrait.talk}" alt="林老师"><p>${esc(a[0])}</p></div><div class="stage lessonstage"><div id="lessonScene"></div></div><div class="calcwork"><div class="eyebrow">当前这一步，不用心算</div><div class="calcformula">${esc(a[1])}</div>${a[2]?`<div class="line"><input id="lessonInput" autocomplete="off" placeholder="写下这一步的结果" value="${esc(drafts[key]||'')}"><button id="lessonCheck" class="primary">检查</button></div>`:''}<div id="lessonResult" class="feedback" role="status">${show?esc((a[2]?'结果：'+a[2]+'。':'')+a[3]):'慢慢算，老师等你。'}</div><div class="lessonhelp"><button id="lessonHint">给我提示</button><button id="lessonReplay">重听重看</button><button id="lessonReveal">老师算给我看</button></div></div><div class="lessonnav"><button id="lessonPrev" ${lessonStep===0?'disabled':''}>上一步</button><button id="lessonNext" class="primary" ${show?'':'disabled'}>${lessonStep===list.length-1?'进入场景验证':'我懂了，继续'}</button></div><div class="pills lessonpills">${[0,1,2].map(i=>`<button data-q="${i}" class="${i===q?'selected':''}">第${i+1}问</button>`).join('')}</div>`;root.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>open(w,+b.dataset.q));$('lessonGame').onclick=enterGame;$('lessonPaper').onclic function openScratch(){let key=lessonKey(),m=document.createElement('div');m.className='scratchOverlay';m.innerHTML=`<div class="scratchPanel"><div class="mission-head"><h2>数学草稿板</h2><button id="scratchClose" class="primary">返回</button></div><p>可以用手指写算式，也可以在下面打字。没有时间限制。</p><canvas id="scratchCanvas" width="640" height="640" aria-label="手写草稿"></canvas><div class="lessonhelp"><button id="scratchUndo">撤销一笔</button><button id="scratchClear">清空手写</button></div><textarea id="scratchText" placeholder="在这里列式、记数字……">${esc(scratchNotes[key]||'')}</textarea></div>`;document.body.append(m);let cv=m.querySelector('canvas'),ctx=cv.getContext('2d'),strokes=scratchNotes[key+'-ink']||[],current=null;function redraw(){ctx.fillStyle='#fffdf5';ctx.fillRect(0,0,640,640);ctx.strokeStyle='#e9e3d8';ctx.lineWidth=1;for(let i=40;i<640;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(640,i);ctx.stroke();}ctx.strokeStyle='#172c3b';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';strokes.forEach(st=>{if(!st.length)return;ctx.beginPath();ctx.moveTo(st[0][0],st[0][1]);if(st.length===1)ctx.lineTo(st[0][0]+.1,st[0][1]);st.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke()});}function point(e){let r=cv.getBoundingClientRect();return [(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*640/r.height]}cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);current=[point(e)];strokes.push(current);redraw()};cv.onpointermove=e=>{if(current){current.push(point(e));redraw()}};cv.onpointerup=cv.onpointercancel=()=>{current=null};m.querySelector('#scratchUndo').onclick=()=>{strokes.pop();redraw()};m.querySelector('#scratchClear').onclick=()=>{strokes.length=0;redraw()};m.querySelector('#scratchText').oninput=e=>scratchNotes[key]=e.target.value;m.querySelector('#scratchClose').onclick=()=>{scratchNotes[key+'-ink']=strokes;m.remove()};scratchNotes[key+'-ink']=strokes;redraw();}

$('home').onclick=home;$('voice').onclick=()=>{muted=!muted;$('voice').textContent=muted?'语音 关':'语音 开';if(muted){try{speechSynthesis.cancel()}catch{}}else if(teaching&&$('lessonScene'))playLesson('', 'normal');else speak(last||'峰玮，欢迎来到猫咪数学大冒险。')};document.addEventListener('visibilitychange',()=>{if(document.hidden)try{speechSynthesis.cancel()}catch{}});home();

(function(){
 try{

   if(!SS||!subEl)return;

   try{sessionStorage.setItem('lin-sound-unlocked','1')}catch(e){}
   if(gate.parentNode)gate.parentNode.removeChild(gate);
  }
  btn.addEventListener('click',unlock);
  if(noSS){btn.textContent='开始学习（本设备不支持语音）';gate.querySelector('.sg-sub').textContent='本设备浏览器不支持语音，可看文字和动画学习。';}
 }catch(e){}
