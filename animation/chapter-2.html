 if(q.sci){const p=parseSci(raw);if(p){const ok=relEq(p.v,q.num[0])&&Math.abs(p.a)>=1&&Math.abs(p.a)<10;let msg=null;if(!ok&&relEq(p.v,q.num[0]))msg='数值没错，但 a 必须满足 1 ≤ |a| < 10。';return {ok,vals:[p.v],msg};}
  const t=normIn(raw).replace(/[,，、]/g,'');if(/^[+-]?\d+(\.\d+)?$/.test(t)){const v=+t;return {ok:false,vals:[v],msg:relEq(v,q.num[0])?'数值没错，但题目要求写成 a × 10ⁿ 的形式。':null};}return null;}
 if(q.big){const t=normIn(raw).replace(/[,，、']/g,'');if(/^[+-]?\d+(\.\d+)?$/.test(t)){const v=+t;return {ok:relEq(v,q.num[0]),vals:[v]};}const p=parseSci(raw);if(p)return {ok:false,vals:[p.v],msg:'题目要的是原数（普通写法），不是科学记数法。'};return null;}
 if(q.dec!=null){const t=normIn(raw);const m=t.match(/^([+-]?)(\d+)(?:\.(\d+))?$/);if(!m)return null;const v=+t;const d=(m[3]||'').length;const ok=relEq(v,q.num[0])&&d===q.dec;let msg=null;if(!ok&&relEq(v,q.num[0]))msg=`数值对了，可精确到这一位要写 ${q.dec} 位小数（末尾的 0 不能删）。`;return {ok,vals:[v],msg};}

function askUI(box,it,meta,label){return new Promise(res=>{
 const t=meta&&meta.id?T(meta.id):null;
 const el=H(`<div class="dxq" data-tp="${it.tp}" data-role="${meta.role}"><div class="dxh">${label||ROLE[meta.role]||''}${t&&meta.role!=='confirm'&&meta.role!=='retest'?`：<b>${t.nm}</b>${t.ch===0?' <span class="dxg">小学'+t.g+'</span>':t.ch!==DX.CH?' <span class="dxg">第一章</span>':''}`:''}</div><p class="qtext">${it.q}</p><div class="dxa"></div><div class="dxfb"></div></div>`);
 box.appendChild(el);el._it=it;const A=$('.dxa',el),fb=$('.dxfb',el);let done=false;
 function fin(ok,shown){done=true;fb.innerHTML=`<div class="fbtxt ${ok?'ok':'no'}">${ok?'✓ 对了。':'✗ 不对。'+(it.in?'正确答案：'+it.at+'。':'')}${it.e}</div>`;const go=H('<div class="row"><button class="btn dxgo">继续 →</button></div>');fb.appendChild(go);go.firstChild.onclick=()=>{go.remove();res(ok);};}
 if(it.in){const row=H(`<div><div class="inrow"><input class="ans dxin" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${it.sci?'如 5.6×10^7':'写出答案，如 −5 或 1/2'}"><button class="btn dxok">确定</button></div><div class="keys"></div></div>`);A.appendChild(row);const inp=$('.dxin',row);
  (it.keys||(it.sci?['−','.','×10^']:it.dec!=null?['−','.']:['−','/','.','或'])).forEach(k=>{const b=H(`<button class="key">${k}</button>`);b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e2=inp.selectionEnd??s;const ins=k==='或'?' 或 ':k;inp.value=inp.value.slice(0,s)+ins+inp.value.slice(e2);inp.focus();};$('.keys',row).appendChild(b);});
  const sub=()=>{if(done)return;const g=gradeIt(it,inp.value.trim());if(!g){toast(it.sci?'写成 a×10^n 的样子，比如 5.6×10^7':'没看懂你的答案：写成数字，比如 −5、1/2、0.5');return;}inp.disabled=true;$('.dxok',row).disabled=true;$$('.key',row).forEach(x=>x.disabled=true);inp.classList.add(g.ok?'ok':'no');fin(g.ok);};
  $('.dxok',row).onclick=sub;inp.addEventListener('keydown',e=>{if(e.key==='Enter')sub();});}
 else{const ch=H('<div class="chips"></div>');A.appendChild(ch);it.o.forEach((o,j)=>{const b=H(`<button class="chip dxc">${o}</button>`);b.onclick=()=>{if(done)return;$$('.chip',ch).forEach(x=>x.disabled=true);const ok=j===it.a;b.classList.add(ok?'ok':'no');if(!ok)$$('.chip',ch)[it.a].classList.add('ok');fin(ok);};ch.appendChild(b);});}
 if(el.scrollIntoView)setTimeout(()=>{try{el.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(_){}},30);
});}
function pathHTML(trail){return '<div class="dxpath">'+trail.filter(x=>x.role!=='fix'&&x.role!=='retest').map(x=>`<span class="${x.ok?'ok':'no'}">${T(x.id).nm} ${x.ok?'✓':'✗'}</span>`).join('<i>→</i>')+'</div>';}
function linkBtn(id){const l=DX.link(id);if(!l.href)return `<span class="dxlk dxprim">${l.txt}（下面的小提示就是它的要点）</span>`;return `<a class="btn ghost dxlk" href="${l.href}"${l.ext?' target="_blank"':''}>${l.txt} →</a>`;}
function openReview(href,label){
 const dialog=H('<dialog class="reviewDialog"><div class="reviewBar"><button type="button" class="btn">返回复测</button></div><iframe></iframe></dialog>');
 const frame=dialog.querySelector('iframe');
 frame.title=label;
 const target=new URL(href,location.href);target.searchParams.set("review","1");frame.src=target.href;
 dialog.querySelector('button').onclick=()=>dialog.close();
 dialog.addEventListener('close',()=>dialog.remove(),{once:true});
 document.body.appendChild(dialog);
 dialog.showModal();
}
const DXUI={};
DXUI.run=function(card,ctx,cb){
 const tags=(DX.TAG[ctx.lid]||[])[ctx.qi];if(!tags){cb&&cb(null);return;}const ts=tags.split(',').map(full);
 const box=H(`<div class="dxbox"><div class="step"><i>🔎</i>诊断 <span style="font-weight:500;font-size:13px;color:var(--muted)">先用一道追问看看卡在哪一步</span></div><div class="dxlog"></div></div>`);card.appendChild(box);const log=$('.dxlog',box);
 const ask=(it,meta)=>askUI(log,it,meta);
 const say=(k,r)=>new Promise(res=>{if(k==='diag'){const d=H(`<div class="dxres"><div class="dxh">诊断结果</div><p class="dxt">${r.text}</p>${r.root&&r.root!==r.main?`<p class="muted2">建议先补：<b>${T(r.root).nm}</b></p>`:''}</div>`);log.appendChild(d);setTimeout(res,300);}
  else{const id=r.root||r.main;const t=T(id);const d=H(`<div class="dxfix"><div class="dxh">🩹 先补「${t.nm}」</div><p>${t.h}</p><div class="row">${linkBtn(id)}<button class="btn dxgo">我看懂了，再试一题 →</button></div></div>`);log.appendChild(d);const review=$('a.dxlk',d);if(review){review.removeAttribute('target');review.onclick=e=>{e.preventDefault();openReview(review.getAttribute('href'),review.textContent);};}$('.dxgo',d).onclick=()=>{$('.dxgo',d).remove();res();};}});
 DX.diagnose({main:ts[0],subs:ts.slice(1),P:DX.DP[ctx.lid+':'+ctx.qi],shenWrong:ctx.info&&ctx.info.shen===false},ask,say).then(r=>{
  log.appendChild(H(`<div class="dxend">${pathHTML(r.trail)}<p class="fbtxt ${r.retestOk?'ok':'no'}">${r.retestOk?(DX.state(r.main)==='weak'?'✓ 新题做对了！再做对 1 次，这个点就从“薄弱”变回“实际答对过”。':'✓ 新题做对了，这个点记为“实际答对过”。'):'新题还没做对：它留在“薄弱”，知识地图里会提醒你从这里补。'}</p>${r.root&&r.root!==r.main?`<div class="row">${linkBtn(r.root)}</div>`:''}</div>`));
  cb&&cb(r);}).catch(e=>{console.error(e);cb&&cb(null);});};
// 反思：诊断给出的建议
DXUI.suggest=function(list){list=list.filter(r=>r&&r.err);if(!list.length)return null;const c={};list.forEach(r=>{c[r.err]=(c[r.err]||0)+1;});const err=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];const r=list.find(x=>x.err===err);return {err,text:r.text,root:r.root};};

// ---- 知识地图 ----
DXUI.topicCheck=function(id){
 const root=H('<div></div>');
 root.appendChild(topBar('知识点自测',null));
 const view=H(`<div class="view"><div class="card"><h1>${T(id).nm}</h1><div class="dxlog"></div><div class="row"><a class="btn ghost" href="knowledge.html#${id}">← 回知识图谱</a></div></div></div>`);
 root.appendChild(view);app().replaceChildren(root);bindGo(root);
 const log=$('.dxlog',view),ep=EPOCH;
 (async()=>{
  let score=0;
  const seen=new Set();
  for(let i=0;i<2;i++){
   const question=DX.gen(id,i?'r':'k',null,seen);seen.add(question.q);
   const ok=await askUI(log,question,{role:'check',id},`第 ${i+1} / 2 题`);
   if(ep!==EPOCH)return;
   DX.rec(id,ok,'check');if(ok)score++;
  }
  log.appendChild(H(`<p class="fbtxt" role="status">这次答对 ${score} / 2 题。</p>`));
 })();
};
DXUI.home=function(v){
 const start=H(`<a class="btn ghost" href="#/start" id="gostart">${ST.start[DX.CH]?'重做本章诊断':'做本章诊断'} →</a>`);
 $('#chapter-diagnosis',v).appendChild(start);
 v.querySelector('.view').appendChild(H(DXUI.footer()));
};
DXUI.footer=()=>`<div class="dxfoot">知识点与先修关系改编自 <a href="https://github.com/xiaoyang111222/cn-math-taxonomy" target="_blank" rel="noopener">cn-math-taxonomy</a>（作者 xiaoyang111222），采用 <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.zh-hans" target="_blank" rel="noopener">CC BY-NC 4.0</a> 许可。<b>已修改</b>：按人教版 2024 七上逐条审核先修关系（删去不合理的、补上课本里明确的），诊断题重新编写并用程序验算。仅供非商业使用。</div>`;
// ---- 开局诊断 ----
DXUI.startView=function(){const root=H('<div></div>');root.appendChild(topBar('开局诊断',null));const v=H(`<div class="view"><div class="hero"><h1>开局诊断</h1><p>最多 10 题。从这一章最后面的知识点开始问，答错了就往前查，找到最该先补的点。每题先想清楚再点。</p></div><div class="card" id="stc"><div class="dxlog"></div></div></div>`);root.appendChild(v);app().replaceChildren(root);bindGo(root);
 const log=$('#stc .dxlog',v);const ep=EPOCH;
 DX.startRun((it,meta)=>askUI(log,it,meta,`开局诊断 第 ${meta.k}/${meta.max} 题`)).then(r=>{if(ep!==EPOCH)return;ST.start[DX.CH]={t:Date.now(),asked:r.asked.length};dsave();
  const rec=DX.startHere();log.appendChild(H(`<div class="dxres"><div class="dxh">诊断完成：做了 ${r.asked.length} 题，对 ${r.asked.filter(x=>x.ok).length} 题</div>${pathHTML(r.asked.map(x=>({id:x.id,ok:x.ok,role:'start'})))}<p class="dxt">${rec?`从这里补起：<b>${T(rec).nm}</b>。${T(rec).h}`:'这次问到的点你都答对了。去各节课刷题，继续验证其他点。'}</p><div class="row">${rec&&DX.link(rec).href?`<a class="btn" href="${DX.link(rec).href}">${DX.link(rec).txt} →</a>`:''}<a class="btn ghost" href="#/">看我的知识地图</a></div></div>`));});};
DX.START={1:['cnm_009','cnm_008','cnm_002','cnm_003'],2:['cnm_021','cnm_013','cnm_017','cnm_022','cnm_023']};
DX.startRun=async function(askFn,max){max=max||10;const S=shown();const asked=[];const seen=new Set();const q=[...DX.START[DX.CH]];
 const order2=[...S].filter(id=>T(id).ch===DX.CH).sort((a,b)=>order(b)-order(a));
 while(asked.length<max){let id=q.shift();if(!id){id=order2.find(x=>!seen.has(x));if(!id)break;}if(seen.has(id)||!DX.G[id])continue;seen.add(id);
  const it=DX.gen(id,T(id).ch===0?'k':(DX.G[id].r?'r':'k'));const ok=await askFn(it,{role:'start',id,k:asked.length+1,max});DX.rec(id,ok,'start');asked.push({id,ok});
  if(!ok){const pre=DX.pre(id).filter(p=>S.has(p)&&!seen.has(p));q.unshift(...pre.slice(0,2));}}
 return {asked};};
window.DXUI=DXUI;
})();

if(new URLSearchParams(location.search).get("review")==="1")document.body.classList.add("reviewing");
route();
</script></body></html>
