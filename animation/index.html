function scene(sc,kind){const col=kind==='w'?'#c8372d':'#2b8a55';const w=H(`<div class="scn ${kind}"><div class="scn-t">${kind==='w'?'按你的答案，会是这样：':'正确的是这样：'}</div></div>`);

 else if(sc.r){const [mn,mx]=sc.r;const step=sc.step||1;const W=340,y=62;const X=v=>22+(v-mn)/(mx-mn)*(W-44);
  const svg=S('svg',{viewBox:`0 0 ${W} 104`});const g=S('g',{},svg);
  if(sc.b){S('rect',{x:X(sc.b[0]),y:y-9,width:X(sc.b[1])-X(sc.b[0]),height:18,rx:4,fill:'#cfeedd',stroke:'#2b8a55','stroke-width':1},g);}
  S('line',{x1:10,y1:y,x2:W-10,y2:y,stroke:'#5b4a3c','stroke-width':1.8},g);S('path',{d:`M${W-6},${y} l-9,-5 v10 z`,fill:'#5b4a3c'},g);
  const n=Math.round((mx-mn)/step);const every=n>13?2:1;
  for(let k=0;k<=n;k++){const v=mn+k*step;const isZ=near(v,0);S('line',{x1:X(v),y1:y-(isZ?7:4),x2:X(v),y2:y+(isZ?7:4),stroke:'#5b4a3c','stroke-width':isZ?2.2:1.2},g);if(k%every===0)txt(g,{x:X(v),y:y+20,'text-anchor':'middle','font-size':11,fill:isZ?'#2a211b':'#7b6b5d','font-weight':isZ?800:400},fmt(v));}
  if(sc.dir){txt(g,{x:W-12,y:y-14,'text-anchor':'end','font-size':11,fill:'#d45216','font-weight':700},sc.dir+' →');if(sc.neg)txt(g,{x:12,y:y-14,'font-size':11,fill:'#7b6b5d'},'← '+sc.neg);}
  const ropes=(sc.p||[]).map(p=>{const x1=X(p[0]),x2=X(p[1]);const h=Math.min(26,Math.abs(x2-x1)/2+6);const path=S('path',{d:`M${x1},${y} Q${(x1+x2)/2},${y-h*2} ${x2},${y}`,fill:'none',stroke:col,'stroke-width':3,'stroke-linecap':'round',opacity:.75},g);const L=path.getTotalLength?0:0;const lab=txt(g,{x:(x1+x2)/2,y:y-h-4,'text-anchor':'middle','font-size':12,'font-weight':800,fill:col,opacity:0},p[2]||'');return {path,lab};});
  const ms=(sc.m||[]).map(m=>({v:m[0],t:m[1],o:m[2]==='o'})).sort((a,b)=>a.v-b.v);let px=-99,lv=0;ms.forEach(m=>{const x=X(m.v);lv=(x-px<40)?(lv+1)%2:0;px=x;m.lv=lv;});
  const mel=ms.map(m=>{const gg=S('g',{},g);S('circle',{r:6.5,fill:m.o?'#fff':col,stroke:col,'stroke-width':2},gg);const tl=txt(gg,{y:m.lv?32:-14,'text-anchor':'middle','font-size':12,'font-weight':800,fill:col},m.t);if(m.lv)tl.setAttribute('y',-30);return {gg,x:X(m.v)};});
  w.appendChild(svg);
  setTimeout(()=>{tween(700,e=>{mel.forEach((m,i)=>{const k=clamp(e*1.4-i*.15,0,1);m.gg.setAttribute('transform',`translate(${m.x},${lerp(y-40,y,EASE(k))})`);m.gg.setAttribute('opacity',k);});ropes.forEach(r=>{const len=300;r.path.setAttribute('stroke-dasharray',len);r.path.setAttribute('stroke-dashoffset',len*(1-e));r.lab.setAttribute('opacity',e);});});},60);

 }

// ---------- quiz ----------
const TN={b:'基础',v:'变式',e:'考试题',mix:'混合'};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function htmlText(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function parseAns(s){s=String(s).replace(/[−－–—]/g,'-').replace(/＋/g,'+').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[．。]/g,'.').replace(/／/g,'/');
 const toks=s.split(/[或,，、;；\s]+|和/).filter(Boolean);const out=[];
 for(let t of toks){let pm=false;if(t[0]==='±'){pm=true;t=t.slice(1);}const m=t.match(/^([+-]?)(\d+(?:\.\d+)?|\.\d+)(?:\/(\d+(?:\.\d+)?))?$/);if(!m)return null;if(m[3]!=null&&+m[3]===0)return null;let v=+m[2]/(m[3]!=null?+m[3]:1);if(m[1]==='-')v=-v;if(!Number.isFinite(v))return null;out.push(v);if(pm&&v!==0)out.push(-v);}
 return out.length?out:null;}
function sameSet(a,b){const u=x=>{const r=[];x.forEach(v=>{if(!r.some(w=>Math.abs(w-v)<1e-9))r.push(v);});return r;};a=u(a);b=u(b);return a.length===b.length&&a.every(v=>b.some(w=>Math.abs(w-v)<1e-9));}
function renderQuiz(L,box,qs){const qd=()=>DB.qd[L.id]||(DB.qd[L.id]={});let mode=null,set=[],i=0,res=[],times=[],dxs=[];
 const tierIdx=t=>qs.map((q,k)=>q.t===t?k:-1).filter(k=>k>=0);
 const prog=t=>{const ids=tierIdx(t);return [ids.filter(k=>qd()[k]).length,ids.length];};
 function pick(m){mode=m;if(m==='mix'){const pools=['b','v','e'].map(t=>shuffle(tierIdx(t)).sort((a,b)=>(qd()[a]?1:0)-(qd()[b]?1:0)));const pat=shuffle([2,2,1]);set=[];pat.forEach((n,j)=>set.push(...pools[j].slice(0,n)));set=shuffle(set);}else set=shuffle(tierIdx(m)).slice(0,5);i=0;res=[];times=[];dxs=[];draw();}
 function head(){const tabs=['b','v','e'].map(t=>{const [d,n]=prog(t);return `<button class="tier ${mode===t?'on':''} ${d===n?'full':''}" data-t="${t}"><b>${TN[t]}</b><small>已掌握 ${d}/${n}</small><span class="bar"><span style="width:${(d/n*100).toFixed(0)}%"></span></span></button>`;}).join('');
  return `<div class="step"><i>4</i>刷题 <span class="muted" style="font-weight:500;font-size:13px">每组 5 题，每题先审题</span></div>
  <div class="tiers">${tabs}<button class="tier mix ${mode==='mix'?'on':''}" data-t="mix"><b>换一组</b><small>三档混合</small><span class="bar"><span style="width:${(Object.keys(qd()).filter(k=>qs[k]).length/qs.length*100).toFixed(0)}%"></span></span></button></div>`;}
 function bindTabs(){$$('.tier',box).forEach(b=>b.onclick=()=>pick(b.dataset.t));}
 function draw(){if(i>=set.length)return reflect();const qi=set[i],q=qs[qi];
  box.innerHTML=head()+`<div class="qmeta"><span>${TN[mode]} · 第 ${i+1} / ${set.length} 题 <span class="tt2">${TN[q.t]}${q.in?' · 填空':''}</span></span><span class="dots">${set.map((_,k)=>`<span class="${res[k]===true?'ok':res[k]===false?'no':k===i?'cur':''}"></span>`).join('')}</span></div>`;bindTabs();
  const card=H(`<div></div>`);box.appendChild(card);ask(card,q,(ok,secs,info)=>{res[i]=ok;times.push(secs);
   const key=L.id+':'+qi;const tg=(DX.TAG[L.id]||[])[qi];if(ok&&tg)DX.rec('cnm_'+tg.split(',')[0],true,'quiz');

  for(let i=0;i<2;i++){
   const question=DX.gen(id,i?'r':'k',null,seen);seen.add(question.q);
   const ok=await askUI(log,question,{role:'check',id},`第 ${i+1} / 2 题`);
   if(ep!==EPOCH)return;
   DX.rec(id,ok,'check');if(ok)score++;
  }
  log.appendChild(H(`<p class="fbtxt" role="status">这次答对 ${score} / 2 题。</p>`));
 })();
};

  const rec=DX.startHere();log.appendChild(H(`<div class="dxres"><div class="dxh">诊断完成：做了 ${r.asked.length} 题，对 ${r.asked.filter(x=>x.ok).length} 题</div>${pathHTML(r.asked.map(x=>({id:x.id,ok:x.ok,role:'start'})))}<p class="dxt">${rec?`从这里补起：<b>${T(rec).nm}</b>。${T(rec).h}`:'这次问到的点你都答对了。去各节课刷题，继续验证其他点。'}</p><div class="row">${rec&&DX.link(rec).href?`<a class="btn" href="${DX.link(rec).href}">${DX.link(rec).txt} →</a>`:''}<a class="btn ghost" href="#/">看我的知识地图</a></div></div>`));});};
DX.START={1:['cnm_009','cnm_008','cnm_002','cnm_003'],2:['cnm_021','cnm_013','cnm_017','cnm_022','cnm_023']};
DX.startRun=async function(askFn,max){max=max||10;const S=shown();const asked=[];const seen=new Set();const q=[...DX.START[DX.CH]];
 const order2=[...S].filter(id=>T(id).ch===DX.CH).sort((a,b)=>order(b)-order(a));
 while(asked.length<max){let id=q.shift();if(!id){id=order2.find(x=>!seen.has(x));if(!id)break;}if(seen.has(id)||!DX.G[id])continue;seen.add(id);
  const it=DX.gen(id,T(id).ch===0?'k':(DX.G[id].r?'r':'k'));const ok=await askFn(it,{role:'start',id,k:asked.length+1,max});DX.rec(id,ok,'start');asked.push({id,ok});
  if(!ok){const pre=DX.pre(id).filter(p=>S.has(p)&&!seen.has(p));q.unshift(...pre.slice(0,2));}}
 return {asked};};
window.DXUI=DXUI;
})();
