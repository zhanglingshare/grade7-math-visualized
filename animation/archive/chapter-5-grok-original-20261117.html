<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>第五章 一元一次方程 · 动手感悟原理（诊断版）</title><style>:root{--bg:#f4eee4;--paper:#fffaf2;--ink:#2a211b;--muted:#7b6b5d;--line:#e8dccb;--or:#d45216;--or2:#fbe6d8;--gr:#2b8a55;--gr2:#e1f1e6;--rd:#c8372d;--rd2:#fbe3df;--bl:#2f6fd1;--bl2:#e4ecfb;--sh:0 10px 30px rgba(90,60,30,.07)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.view{max-width:1040px;margin:0 auto;padding:12px 14px 60px}
.top{position:sticky;top:0;z-index:20;background:rgba(244,238,228,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
.top .tt{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{color:var(--or);font-weight:700;margin-right:6px}
.ib{min-height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:14px;white-space:nowrap}
.ib:disabled{opacity:.35}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.step{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:0 0 8px}
.step i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--or);color:#fff;font-size:13px;flex:none}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;line-height:1.35;text-align:left;transition:all .25s cubic-bezier(.16,1,.3,1)}
.chip:hover{border-color:#d9c3a8}
.chip.on{border-color:var(--or);background:var(--or2)}
.chip.ok{border-color:var(--gr);background:var(--gr2);color:#145233}
.chip.no{border-color:var(--rd);background:var(--rd2);color:#7d1c15}
.chip:disabled{cursor:default}
.chip.dim{opacity:.45}
.guess{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;border-radius:14px;background:#fff4ea;border:1px dashed #efc3a3;margin-bottom:10px;font-size:14.5px}
.guess b{color:var(--or)}
.guess .chip{min-height:36px;padding:4px 12px;font-size:14px}
.guess .gv{flex-basis:100%;font-size:13.5px;color:var(--muted)}
.stagewrap{position:relative;border-radius:14px;background:#fffdf8;border:1px solid var(--line);overflow:hidden}
.stagewrap svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.tag{margin-left:auto;white-space:nowrap;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff;font-size:12.5px;opacity:.85;pointer-events:none;transition:opacity .4s}
.tag.go{background:var(--or)}
.mission{margin:10px 0 0;padding:10px 12px;border-radius:14px;background:var(--or2);border:1.5px solid #f1b994;font-size:15.5px;font-weight:700;line-height:1.45}
.mission small{display:block;font-weight:600;color:var(--or);font-size:12.5px}
.mission.done{background:var(--gr2);border-color:#9fd3b3}
.mission.done small{color:var(--gr)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;min-height:40px;padding:0 12px;font-size:14px}
.seg button.on{background:var(--or);color:#fff}
.tog{min-height:40px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:14px}
.tog.on{border-color:var(--or);background:var(--or2);color:#9a3a0d;font-weight:700}
.readout{margin-top:10px;font-size:15px;min-height:24px;line-height:1.5}
.readout b{color:var(--or)}
input[type=range]{width:100%;height:36px;accent-color:var(--or)}
.mlist{list-style:none;margin:0;padding:0;counter-reset:m}
.mlist li{position:relative;padding:9px 10px 9px 40px;border-radius:12px;margin-bottom:6px;font-size:14.5px;background:#fff;border:1px solid var(--line);line-height:1.45}
.mlist li:before{counter-increment:m;content:counter(m);position:absolute;left:10px;top:9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#efe5d7;color:var(--muted);font-size:12px;font-weight:800}
.mlist li.cur{border-color:#f1b994;background:#fff6ee;font-weight:700}
.mlist li.ok:before{content:"✓";background:var(--gr);color:#fff}
.mlist li .aha{display:block;margin-top:4px;color:#1d6b41;font-weight:600;font-size:13.5px}
.mlist li.pop{animation:pop .7s cubic-bezier(.16,1,.3,1)}
@keyframes pop{0%{transform:scale(.96);background:#d6f0de}100%{transform:none}}
.lgrid{display:grid;gap:0 14px}
@media(min-width:900px){.lgrid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}.lgrid .side{position:sticky;top:70px}}
.rule{border-left:4px solid var(--or);background:#fff6ee;padding:10px 12px;border-radius:0 12px 12px 0;font-size:15px;margin-top:10px}
.rule h4{margin:0 0 4px;font-size:14px;color:var(--or)}
.rq{margin-bottom:12px}
.rq p{margin:0 0 6px;font-weight:700}
.fbtxt{margin-top:6px;font-size:14.5px}
.fbtxt.ok{color:#1d6b41}.fbtxt.no{color:#9b241b}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.dots{display:flex;gap:4px}.dots span{width:9px;height:9px;border-radius:50%;background:#e6d9c6}.dots span.ok{background:var(--gr)}.dots span.no{background:var(--rd)}.dots span.cur{background:var(--or)}
.shen{padding:10px;border-radius:14px;background:var(--bl2);margin-bottom:10px}
.shen p{margin:0 0 6px;font-size:14.5px}.shen p b{color:var(--bl)}
.shen .chip{min-height:40px;font-size:14.5px}
.qbody{transition:opacity .4s}
.qbody.lock{opacity:.35;pointer-events:none}
.qtext{font-size:17px;font-weight:700;margin:0 0 10px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;z-index:50;background:#2a211b;color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;transition:all .45s cubic-bezier(.16,1,.3,1);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scn{margin-top:10px;border-radius:14px;padding:8px 10px;border:1.5px solid}
.scn.w{border-color:#efb3ab;background:#fff5f3}.scn.r{border-color:#a9d9bb;background:#f3fbf6}
.scn-t{font-size:12.5px;font-weight:800}.scn.w .scn-t{color:var(--rd)}.scn.r .scn-t{color:var(--gr)}
.scn svg{display:block;width:100%;height:auto;max-height:150px}
.scn p{margin:2px 0 0;font-size:14.5px}
.morph{display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:800;padding:10px 0;flex-wrap:wrap}
.morph .b{opacity:0;transform:translateX(-14px);animation:mIn .8s .6s cubic-bezier(.16,1,.3,1) forwards}
.morph .arr{opacity:0;animation:mIn .5s .3s forwards;color:var(--muted)}
@keyframes mIn{to{opacity:1;transform:none}}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--or);color:#fff;font-weight:700;font-size:15.5px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero{padding:18px 4px 8px}
.hero h1{margin:0;font-size:26px;line-height:1.25}
.hero h1 span{color:var(--or)}
.hero p{margin:6px 0 0;color:var(--muted);font-size:15px}
.loop{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.loop span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.loop span b{color:var(--or)}
.lcards{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.lcards{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.lcards{grid-template-columns:1fr 1fr 1fr}}
.lc{display:block;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.lc:hover{transform:translateY(-2px)}
.lc .no{color:var(--or);font-weight:800;font-size:13px}
.lc h3{margin:2px 0 4px;font-size:19px}
.lc p{margin:0;color:var(--muted);font-size:14px}
.lc svg{width:100%;height:56px;display:block;margin:8px 0}
.prog{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prog span{font-size:12.5px;padding:2px 8px;border-radius:999px;background:#f1e8db;color:var(--muted)}
.prog span.ok{background:var(--gr2);color:#1d6b41}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--or)}
.stat small{font-size:12px;color:var(--muted)}
.wi{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;margin-bottom:10px}
.wi .src{font-size:12.5px;color:var(--or);font-weight:700}
textarea{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:12px;padding:8px;font:inherit;font-size:15px;background:#fff}
h2.sec{font-size:18px;margin:18px 4px 10px}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01s!important;animation-duration:.2s!important}}
.step{white-space:nowrap}
@media(max-width:480px){.step .muted{display:none}}
button.lc{display:flex;flex-direction:column;justify-content:flex-start}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tier{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 4px 7px;text-align:center;min-height:56px;line-height:1.25}
.tier b{display:block;font-size:14px}.tier small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.tier .bar{display:block;height:4px;border-radius:2px;background:#efe5d7;margin:4px 6px 0;overflow:hidden}.tier .bar span{display:block;height:100%;background:var(--gr);border-radius:2px}
.tier.on{border-color:var(--or);background:var(--or2)}.tier.on b{color:#9a3a0d}
.tier.full small{color:var(--gr);font-weight:700}
.tier.mix{border-style:dashed}
.tt2{display:inline-block;margin-left:4px;padding:0 7px;border-radius:999px;background:#f1e8db;font-size:11.5px}
.inrow{display:flex;gap:8px}
.ans{flex:1;min-width:0;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:18px;background:#fff}
.ans:focus{outline:none;border-color:var(--or)}
.ans.ok{border-color:var(--gr);background:var(--gr2)}.ans.no{border-color:var(--rd);background:var(--rd2)}
.keys{display:flex;gap:6px;margin-top:8px}
.key{min-width:48px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:700}
.stp{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.stp span{padding:0 4px 0 10px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.stp button{border:0;background:none;min-width:40px;min-height:40px;font-size:20px;font-weight:700;color:var(--or)}
.stp button:disabled{opacity:.3}
.stp b{min-width:34px;text-align:center;font-size:16px}
.qtext sup,.chip sup,.morph sup,.rule sup,.mission sup,.readout sup,.aha sup{font-size:.7em}
.big2{font-size:18px}

/* ---- primary module additions ---- */
.hero .kick{display:inline-block;font-size:13px;font-weight:800;color:#fff;background:var(--or);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.stat.stat4{grid-template-columns:repeat(4,1fr)}
.stat.stat4 b{font-size:20px}
.road{margin:0;padding:0;list-style:none;display:grid;gap:6px;grid-template-columns:1fr}
@media(min-width:700px){.road{grid-template-columns:1fr 1fr}}
.road li{padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.road li b{display:block;color:var(--ink);font-size:14.5px}
.road li.now{border-color:var(--or);background:var(--or2)}
.road li.now b{color:#9a3a0d}
.foot{font-size:12.5px;color:var(--muted);margin:14px 4px}
.foot a{color:var(--muted)}
.est{padding:10px;border-radius:14px;background:#fff7dc;border:1px solid #f0dc9a;margin-bottom:10px;transition:opacity .4s}
.est p{margin:0 0 6px;font-size:14.5px}.est p b{color:#9a6a00}
.est .chip{min-height:40px;font-size:14.5px}
.est.lock{opacity:.35;pointer-events:none}
.chk{margin-top:10px;padding:10px 12px;border-radius:14px;border:2px dashed #9fd3b3;background:#f3fbf6;animation:mIn .5s cubic-bezier(.16,1,.3,1)}
.chk p{margin:0;font-size:15px}.chk p b{color:var(--gr)}
.chk .cmp{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:14.5px}
.chk .cmp b{color:var(--or)}
.chk .row{margin-top:8px}
.pvwrap{overflow-x:auto;padding:4px 0}
.pvt{border-collapse:separate;border-spacing:3px;margin:4px auto;font-weight:800}
.pvt th{font-size:11.5px;color:var(--muted);font-weight:700;padding:0 4px;min-width:34px}
.pvt td{min-width:34px;height:38px;text-align:center;font-size:22px;background:#fff;border:1px solid var(--line);border-radius:8px}
.pvt td.lb{font-size:12px;color:var(--muted);background:none;border:0;min-width:0;text-align:right;padding-right:4px;white-space:nowrap}
.pvt td.dp,.pvt th.dp{min-width:8px;width:8px;background:none;border:0;padding:0;font-size:24px}
.pvt tr{animation:pvIn .6s cubic-bezier(.16,1,.3,1) both}
@keyframes pvIn{from{opacity:0;transform:translateY(6px)}}
.chip.on{border-color:var(--or);background:var(--or2)}
.tier.gen{grid-column:1/-1;min-height:46px;border-color:#7a5fc4;border-style:dashed;background:#f6f2ff}.tier.gen b{color:#5a3fa8}.tier.gen.on{border-style:solid;background:#ebe3ff}

.dxbox{margin-top:12px;border:1.5px solid #efc3a3;background:#fff7ef;border-radius:16px;padding:12px}
.dxbox .step i{background:#2a211b;font-size:12px}
.dxq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.dxq .qtext{margin:4px 0 8px;font-weight:600}
.dxh{font-size:13.5px;font-weight:800;color:var(--or)}
.dxh b{color:var(--ink)}
.dxg{display:inline-block;font-size:11px;font-weight:700;color:#5b4a3c;background:#efe6d9;border-radius:8px;padding:0 6px;margin-left:4px}
.dxres{background:#2a211b;color:#fff;border-radius:14px;padding:12px;margin:10px 0}
.dxres .dxh{color:#ffb98f}
.dxres .dxt{margin:4px 0 0;font-size:16.5px;font-weight:700;line-height:1.5}
.dxres .muted2{margin:6px 0 0;color:#e8dccb;font-size:14px}
.dxres .dxpath span{background:rgba(255,255,255,.08)}
.dxres .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.dxfix{background:var(--gr2);border:1px solid #b9dfc8;border-radius:14px;padding:10px 12px;margin:8px 0}
.dxfix .dxh{color:#145233}
.dxfix p{margin:4px 0 8px}
.dxpath{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0 2px;font-size:13px}
.dxpath span{border-radius:10px;padding:2px 8px;font-weight:700}
.dxpath span.ok{background:var(--gr2);color:#145233}
.dxpath span.no{background:var(--rd2);color:#7d1c15}
.dxpath i{font-style:normal;color:#b0a090}
.dxend{margin-top:6px}
.dxlk{display:inline-flex;align-items:center;text-decoration:none;min-height:42px;font-size:14.5px}
.dxprim{color:#145233;font-size:13.5px;font-weight:600}
.dxsug{margin:8px 0 0;padding:8px 10px;border-radius:12px;background:#fff4ea;border:1px dashed #efc3a3;font-size:14px}
.dxroot{margin:6px 0 8px;padding:8px 10px;border-radius:12px;background:#fff4ea;border:1px dashed #efc3a3;font-size:14px}
.dxroot span{color:var(--rd);font-weight:700}
.dxmapcard{margin-top:12px}
.dxnote{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.dxleg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;font-size:13px;font-weight:700}
.dxleg span{border-radius:10px;padding:3px 10px;border:1.4px solid}
.dxleg .ok,.dxst.ok{background:#dff3e7;border-color:#2b8a55;color:#145233}
.dxleg .none,.dxst.none{background:#fff;border-color:#bfb2a3;border-style:dashed;color:#7b6b5d}
.dxleg .weak,.dxst.weak{background:#fbe1dd;border-color:#c8372d;color:#7d1c15}
.dxst{display:inline-block;border:1.2px solid;border-radius:9px;padding:0 7px;font-size:12px;font-weight:700;margin:2px 2px 0 0}
.dxsvg{width:100%;max-width:560px;margin:0 auto}
.dxmap{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.dxreco{margin-top:8px;padding:10px 12px;border-radius:14px;background:#fff4ea;border:1.5px solid #f0b48e}
.dxsm{margin:4px 0;font-size:13.5px;color:#5b4a3c}
.dxpanel{margin-top:8px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.dxpanel p{margin:4px 0}
.dxfoot{margin:22px 4px 0;font-size:12px;line-height:1.6;color:var(--muted)}
.dxfoot a{color:var(--or)}
.dxtop .lc{text-decoration:none;color:inherit}
a.btn{display:inline-flex;align-items:center;text-decoration:none}

.keys{flex-wrap:wrap}
.key{min-width:42px}
.segw{flex-wrap:wrap;max-width:100%}
.segw button{padding:0 10px;font-size:13.5px}
.opsbox{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.opb{min-height:46px;min-width:76px;padding:0 14px;border-radius:23px;border:0;background:var(--or);color:#fff;font-weight:800;font-size:16px;box-shadow:0 3px 0 #a83e0e}
.opb:active{transform:translateY(2px);box-shadow:0 1px 0 #a83e0e}
.stories{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-top:4px}
.stories .chip{font-size:14px;min-height:40px}
.vtb{border-collapse:collapse;margin:8px auto;font-size:15px;max-width:100%}
.vtb th,.vtb td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.vtb th{background:#f7efe4;font-weight:700;font-size:13.5px}
.vtb td.rh{text-align:left;font-weight:700;background:#fffaf2}
.scn.w .vtb td:not(.rh){color:#c8372d;font-weight:800}
.scn.r .vtb td:not(.rh){color:#2b8a55;font-weight:800}
.scn .vtb tr.ok td:not(.rh){color:#2b8a55}

.subt{margin-top:10px;padding:10px;border-radius:12px;background:#fffaf2;border:1px solid var(--line)}
.subh{margin:0 0 6px;font-size:14px;line-height:1.5}
.subt .chips{display:flex;flex-wrap:wrap;gap:6px}
.subt .chip{min-height:38px;font-size:14px}
.subrow{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;padding:6px 8px;border-radius:10px;font-size:14px}
.subrow.ok{background:#eaf7ef;color:#1f6e43}.subrow.no{background:#fdecea;color:#a3261d}
.subrow b{font-weight:800}
.fcard{cursor:grab;touch-action:none}
.qtext sup,.fbtxt sup{font-size:.7em}

/* ===== 第五章：方程排版 + 天平/操作按钮 ===== */

// ===== 第五章：方程小工具（分数显示、解析“x = …”、列方程判等价、代回检验）=====
function gcdI(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
// 浮点 → 最接近的分数（分母 ≤ 1000），用来显示 −2/3 这种答案
function toFrac(v){if(!isFinite(v))return null;const s=v<0?-1:1;v=Math.abs(v);for(let d=1;d<=1000;d++){const n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9){const g=gcdI(n,d);return [s*n/g,d/g];}}return null;}
function fq(v){if(Math.abs(v)<1e-12)return '0';const f=toFrac(v);if(!f)return fmt(v);const [n,d]=f;if(d===1)return String(n).replace('-','−');
 // 有限小数且位数少：给小数；否则给分数
 const dec=+(n/d).toFixed(6);if([2,4,5,8,10,20,25,50,100].includes(d))return String(dec).replace('-','−');return (n<0?'−':'')+Math.abs(n)+'/'+d;}
function fqF(v){if(Math.abs(v)<1e-12)return '0';const f=toFrac(v);if(!f)return fmt(v);const [n,d]=f;if(d===1)return String(n).replace('-','−');return (n<0?'−':'')+Math.abs(n)+'/'+d;}
function nrm5(s){return String(s).replace(/[−－–—]/g,'-').replace(/＋/g,'+').replace(/＝/g,'=').replace(/[０-９Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[．。]/g,'.').replace(/／/g,'/').replace(/（/g,'(').replace(/）/g,')').replace(/\s+/g,'');}
// 一个数：整数、小数、a/b，可以带“x=”前缀；返回数值或 null
function numOne(t){const m=t.match(/^([+-]?)(\d+(?:\.\d+)?|\.\d+)(?:\/(\d+(?:\.\d+)?))?$/);if(!m)return null;if(m[3]!=null&&+m[3]===0)return null;let v=+m[2]/(m[3]!=null?+m[3]:1);if(m[1]==='-')v=-v;return v;}
function stripU(t){for(let k=0;k<12&&t&&!/[\d.]$/.test(t);k++){const n=t.replace(/([\u3000-\u9fff%（）()\/]|km|cm|m|h|s)$/i,'');if(n===t)break;t=n;}return t;}
function parseX(raw,v){let s=nrm5(raw);if(!s)return null;const toks=s.split(/[,，、;；]|或|和/).map(stripU).filter(Boolean);const out=[];
 for(let t of toks){const m=t.match(/^([a-z])=(.*)$/i);if(m){if(v&&m[1].toLowerCase()!==v)return {bad:true,msg:`题目里的未知数是 ${v}，写成 ${v} = … 或者直接写数。`};t=m[2];}
  const n=numOne(t);if(n==null)return null;out.push(n);}return out.length?out:null;}
// 解析方程 “L = R”
function eqParse(raw){const s=String(raw).replace(/＝/g,'=');const p=s.split('=');if(p.length!==2)return null;const L=exParse(p[0]),R=exParse(p[1]);if(!L||!R)return null;return {L,R,vars:new Set([...L.vars,...R.vars])};}
function eqF(P,env){return exEval(P.L.ast,env)-exEval(P.R.ast,env);}
const EQPTS=[-3.7,0.3,1.9,4.1,7.3,-11.3];
// 一元方程的根（只对一次方程有效）：返回 {kind:'one',x}|{kind:'none'}|{kind:'all'}|{kind:'nonlin'}
function eqRoot(P,v){const f=x=>eqF(P,{[v]:x});const a=f(0),b=f(1),c=f(2),d=f(-5);if(![a,b,c,d].every(isFinite))return {kind:'nonlin'};const k=b-a;
 if(Math.abs((c-a)-2*k)>1e-7*Math.max(1,Math.abs(k))||Math.abs((d-a)+5*k)>1e-7*Math.max(1,Math.abs(k)))return {kind:'nonlin'};

// 列方程：孩子写的方程和标准方程是不是“同一个等量关系”（左边−右边 成比例）
function gradeEqW(q,raw){const v=q.v||'x';if(!/=|＝/.test(raw))return {bad:true,msg:'列方程要有等号：把“相等的两个量”用 = 连起来。'};const P=eqParse(raw);if(!P)return null;

 let ratio=null,ok=true;for(const x of EQPTS){const fr=eqF(R,{[v]:x}),fc=eqF(P,{[v]:x});if(!isFinite(fr)||!isFinite(fc)){ok=false;break;}if(Math.abs(fr)<1e-9){if(Math.abs(fc)>1e-7){ok=false;break;}continue;}const r=fc/fr;if(ratio==null)ratio=r;else if(Math.abs(r-ratio)>1e-7*Math.max(1,Math.abs(ratio))){ok=false;break;}}

function rAst(a,m,first){const R=(x,f)=>rAst(x,m,f);const pr=x=>({n:9,v:9,'^':8,'*':6,'/':6,neg:4,'+':2,'-':2}[x[0]]);const P=s=>'('+s+')';

// 选择题：o[0] 是正确答案，载入时打乱（o0 保留原顺序，给 Python 核对）
function QC(t,tg,chk,s,q,o,e,x){x=x||{};const ord=shuffle(o.map((_,i)=>i));const oo=ord.map(i=>o[i]);const w={};if(x.w)for(const k in x.w){const j=oo.indexOf(k);if(j>=0)w[j]=x.w[k];}if(x.wd)w.d=x.wd;
 return Object.assign({t,tg,chk,s:SH(s),q,o:oo,o0:o,a:oo.indexOf(o[0]),e},x,{w});}
// 填数（解方程/求参数/应用题）：可以写 x = 3，也可以只写 3；分数、小数等价都算对
function QX(t,tg,chk,s,q,num,e,x){x=x||{};const v=x.v||(chk&&chk.p)||(chk&&chk.v)||'x';const nm=[].concat(num);const r=Object.assign({t,tg,chk,s:SH(s),q,in:true,x5:true,v,num:nm,at:`${v} = ${nm.map(fq).join(' 或 ')}`,e},x);if(chk&&chk.eq&&!chk.p&&!x.noeqc&&!r.ckq)r.eqc=chk.eq;if(x.bare)r.at=nm.map(fq).join(' 或 ');return r;}
// 应用题填数：答案是题目问的那个量（ckq 的式子里 x = 孩子写的答案）
function QA(t,tg,wp,s,q,num,e,x){x=x||{};const r=QX(t,tg,{wp},s,q,num,e,Object.assign({bare:1},x));r.v=null;r.at=r.num.map(fq).join(' 或 ')+(x.unit||'');delete r.eqc;if(x.rows)r.ckq={v:'x',rows:x.rows,goal:x.goal};return r;}

 if(rec){const t=T(rec);rc.innerHTML=`<div class="dxreco"><div class="dxh">📍 从这里补起：<b>${t.nm}</b>${t.ch===0?' <span class="dxg">小学'+t.g+'</span>':t.ch!==DX.CH?' <span class="dxg">'+CHN[t.ch]+'</span>':''}</div><p class="dxsm">它是你薄弱点里最底层的一个——先把它补牢，后面的才站得住。</p><div class="row"><button class="btn dxgorec">先测这个点</button>${DX.link(rec).href?`<a class="btn ghost" href="${DX.link(rec).href}">${DX.link(rec).txt} →</a>`:''}</div></div>`;$('.dxgorec',rc).onclick=()=>detail(rec);}
 else if(cnt.ok===0)rc.innerHTML=`<div class="dxreco"><div class="dxh">还没有数据</div><p class="dxsm">做一次「开局诊断」（最多 10 题），地图就会亮起来。</p><div class="row"><a class="btn" href="#/start">开始开局诊断 →</a></div></div>`;
 else{const un=S.filter(id=>DX.state(id)==='none'&&T(id).ch===DX.CH).sort((a,b)=>order(a)-order(b))[0];rc.innerHTML=`<div class="dxreco"><div class="dxh">目前没有薄弱点 👍</div>${un?`<p class="dxsm">还没验证的：<b>${T(un).nm}</b>，测一测就知道。</p><div class="row"><button class="btn ghost dxun">测「${T(un).nm}」</button></div>`:''}</div>`;const b=$('.dxun',rc);if(b)b.onclick=()=>detail(un);}
 return card;};
DXUI.home=function(v){const lcs=$('#lcs',v);if(!lcs)return;const sec=H(`<div><h2 class="sec">诊断</h2><div class="lcards dxtop"><a class="lc" href="#/start" id="gostart"><div class="no">开局诊断</div><h3>${ST.start[DX.CH]?'再测一次':'找到从哪里开始'}</h3><p>最多 10 题，沿着知识的先后顺序往回查，找到最该先补的那一个点。</p></a></div></div>`);

DXUI.startView=function(){const root=H('<div></div>');root.appendChild(topBar('开局诊断',null));const v=H(`<div class="view"><div class="hero"><h1>开局诊断</h1><p>最多 10 题。从这一章最后面的知识点开始问，答错了就往前查，找到最该先补的点。每题先想清楚再点。</p></div><div class="card" id="stc"><div class="dxlog"></div></div></div>`);root.appendChild(v);app().replaceChildren(root);bindGo(root);
 const log=$('#stc .dxlog',v);const ep=EPOCH;
 DX.startRun((it,meta)=>askUI(log,it,meta,`开局诊断 第 ${meta.k}/${meta.max} 题`)).then(r=>{if(ep!==EPOCH)return;ST.start[DX.CH]={t:Date.now(),asked:r.asked.length};dsave();
  const rec=DX.startHere();log.appendChild(H(`<div class="dxres"><div class="dxh">诊断完成：做了 ${r.asked.length} 题，对 ${r.asked.filter(x=>x.ok).length} 题</div>${pathHTML(r.asked.map(x=>({id:x.id,ok:x.ok,role:'start'})))}<p class="dxt">${rec?`从这里补起：<b>${T(rec).nm}</b>。${T(rec).h}`:'这次问到的点你都答对了。去各节课刷题，继续验证其他点。'}</p><div class="row">${rec&&DX.link(rec).href?`<a class="btn" href="${DX.link(rec).href}">${DX.link(rec).txt} →</a>`:''}<a class="btn ghost" href="#/">看我的知识地图</a></div></div>`));});};
DX.START={5:['cnm_048','cnm_047','cnm_046','cnm_044','cnm_043','cnm_042','cnm_040','cnm_039'],4:['cnm_037','cnm_036','cnm_035','cnm_034','cnm_032','cnm_031'],3:['cnm_030','cnm_029','cnm_027','cnm_026','cnm_025'],1:['cnm_009','cnm_008','cnm_002','cnm_003'],2:['cnm_021','cnm_013','cnm_017','cnm_022','cnm_023']};
DX.startRun=async function(askFn,max){max=max||10;const S=shown();const asked=[];const seen=new Set();const q=[...DX.START[DX.CH]];
 const order2=[...S].filter(id=>T(id).ch===DX.CH).sort((a,b)=>order(b)-order(a));
 while(asked.length<max){let id=q.shift();if(!id){id=order2.find(x=>!seen.has(x));if(!id)break;}if(seen.has(id)||!DX.G[id])continue;seen.add(id);
  const it=DX.gen(id,T(id).ch===0?'k':(DX.G[id].r?'r':'k'));const ok=await askFn(it,{role:'start',id,k:asked.length+1,max});DX.rec(id,ok,'start');asked.push({id,ok});
  if(!ok){const pre=DX.pre(id).filter(p=>S.has(p)&&!seen.has(p));q.unshift(...pre.slice(0,2));}}
 return {asked};};
window.DXUI=DXUI;
