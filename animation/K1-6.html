=x+1，x∈{0，1，2}。函数值中的最大值是多少？","a":"3","o":"数与代数","t":"procedural"},{"i":"cnm_h030","n":"函数的表示方法","b":"H","g":10,"k":"必修一","u":"第三章","c":"高一 第三章 函数的概念与性质 3.1","d":"知道函数可以用解析式、图象、列表表示，并能在列表和图象上读值。","m":["能说出函数的三种表示","能从图象或表格读出函数值"],"q":"表格中 x=1 时 y=4，x=2 时 y=7。这两个函数值的差 y(2)−y(1) 是多少？","a":"3","o":"数与代数","t":"conceptual"},{"i":"cnm_h031","n":"分段函数","b":"H","g":10,"k":"必修一","u":"第三章","c":"高一 第三章 函数的概念与性质 3.1","d":"会按自变量所在的段选择解析式求值，并能处理简单的分段计费。","m":["能判断自变量落在哪一段","能分别计算各段的函数值"],"q":"x<0 时 f(x)=x+1，x≥0 时 f(x)=2x。求 f(−2)。","a":"-1","o":"数与代数","t":"procedural"},{"i":"cnm_h032","n":"函数的单调性","b":"H","g":10,"k":"必修一","u":"第三章","c":"高一 第三章 函数的概念与性质 3.2","d":"能用图象和定义判断一次函数、二次函数在指定区间上的增减。","m":["能说出增函数、减函数的含义","能判断 y=kx+b 的单调性"],"q":"f(x)=2x+1 在实数集上是？","a":"增函数","o":"数与代数","t":"conceptual"},{"i":"cnm_h033","n":"用定义证明单调性","b":"H","g":10,"k":"必修一","u":"第三章","c":"高一 第三章 函数的概念与性质 3.2","d":"会在区间上任取 x1<x2，用作差判断 f(x1) 与 f(x2) 的大小。","m":["能正确作差并因式分解","能由差的符号得出增减"],"q":"f(x)=3x−1。取 x1=1，x2=4，计算 f(x2)−f(x1)。","a":"9","o":"数与代数","t":"reasoning"},{"i":"cnm_h034","n":"函数的最大（小）值","b":"H","g":10,"k":"必修一","u":"第三章","c":"高一 第三章 函数的概念与性质 3.2","d":"能求二次函数在闭区间上的最大、最小值。","m":["能比较端点和顶点的函数值","能指出最值在哪一点取到"],"q":"f(x)=x²，x∈[−1，2]。最大值是多少？","a":"4","o":"数与代数","t":"procedural"},{"i":"cnm_h035","n":"函数的奇偶性","b":"H","g":10,"k":"必修一","u":"第三章","c":"高一 第三章 函数的概念与性质 3.2","d":"知道奇函数满足 f(−x)=−f(x)，偶函数满足 f(−x)=f(x)，并且定义域关于原点对称。","m":["能根据定义判断奇偶","知道定义域不对称就不是奇函数或偶函数"],"q":"f(x)=x² 是？","a":"偶函数","o":"数与代数","t":"conceptual"},{"i":"cnm_h036","n":"奇偶性与图象","b":"H","g":10,"k":"必修一","u":"第三章","c":"高一 第三章 函数的概念与性质 3.2","d":"知道偶函数图象关于 y 轴对称，奇函数图象关于原点对称，并能由此求对称点的函数值。","m":["能由对称性写出另一点的函数值","能判断既奇又偶的函数"],"q":"偶函数 f(2)=7。f(−2) 是多少？","a":"7","o":"数与代数","t":"reasoning"},{"i":"cnm_h037","n":"幂函数","b":"H","g":10,"k":"必修一","u":"第三章","c":"高一 第三章 函数的概念与性质 3.3","d":"能区分五个基本幂函数在第一象限的增减，并计算整数点的函数值。","m":["能说出 y=x、y=x²、y=x³、y=√x、y=1/x 哪几个递增","能计算这些函数在正整数处的值"],"q":"幂函数 y=x³，求 x=2 时的函数值。","a":"8","o":"数与代数","t":"conceptual"},{"i":"cnm_h038","n":"用函数描述简单对应","b":"H","g":10,"k":"必修一","u":"第三章","c":"高一 第三章 函数的概念与性质 3.4","d":"能把单价、路程等简单数量关系写成函数，并求值。","m":["能指出自变量和函数值","能用解析式回答具体问题"],"q":"每本笔记本 4 元，买 x 本的金额 f(x)=4x。买 6 本多少元？","a":"24","o":"数与代数","t":"application"},{"i":"cnm_h039","n":"分数指数幂","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.1","d":"能把根式写成分数指数幂，并计算可开尽的有理数指数幂。","m":["能计算整数指数幂和简单的分数指数幂","能说出负指数是倒数"],"q":"计算 2 的 −3 次方。","a":"1/8","o":"数与代数","t":"procedural"},{"i":"cnm_h040","n":"指数幂的运算","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.1","d":"会用同底数幂相乘、相除和幂的乘方计算整数指数幂。","m":["能把同底数幂的乘法写成指数相加","能计算幂的乘方"],"q":"计算 2³×2⁴。","a":"128","o":"数与代数","t":"procedural"},{"i":"cnm_h041","n":"指数函数的概念","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.2","d":"知道 y=a^x（a>0 且 a≠1）是指数函数，会求具体的函数值。","m":["能判断一个解析式是不是指数函数","能计算 a 为具体正数时的函数值"],"q":"f(x)=2^x，求 f(5)。","a":"32","o":"数与代数","t":"conceptual"},{"i":"cnm_h042","n":"指数函数的性质","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.2","d":"能按底数大于 1 或介于 0 与 1 之间判断指数函数的单调性，并比较大小。","m":["能判断底数对单调性的影响","能比较同一底数的两个指数式"],"q":"y=2^x 在实数集上是？","a":"增函数","o":"数与代数","t":"reasoning"},{"i":"cnm_h043","n":"对数的概念","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.3","d":"知道 log_a N 是 a 的多少次方等于 N，会求简单对数。","m":["能把对数式写成指数式","能计算以 2 或 10 为底的简单对数"],"q":"计算 log₂32。","a":"5","o":"数与代数","t":"procedural"},{"i":"cnm_h044","n":"对数的运算性质","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.3","d":"会用对数的加法、减法和数乘性质计算。","m":["能把积的对数写成对数之和","能计算简单的对数式"],"q":"计算 log₂8+log₂4。","a":"5","o":"数与代数","t":"procedural"},{"i":"cnm_h045","n":"换底公式","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.3","d":"会用换底公式把对数化为以 2 或 10 为底的对数。","m":["能写出换底公式","能计算可以换到底数 2 的对数"],"q":"计算 log₄16。","a":"2","o":"数与代数","t":"procedural"},{"i":"cnm_h046","n":"对数函数","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.4","d":"知道 y=log_a x（a>0 且 a≠1）的定义域是正实数，会求具体函数值。","m":["能说出对数函数的定义域","能计算简单的对数值"],"q":"f(x)=log₂x，求 f(16)。","a":"4","o":"数与代数","t":"conceptual"},{"i":"cnm_h047","n":"对数函数的性质","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.4","d":"能按底数判断对数函数的单调性，并比较两个对数的大小。","m":["能判断底数大于 1 时的增减","能比较同底对数的大小"],"q":"y=log₂x 在 (0，+∞) 上是？","a":"增函数","o":"数与代数","t":"reasoning"},{"i":"cnm_h048","n":"指数与对数互为反函数","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.4","d":"知道 y=a^x 与 y=log_a x 互为反函数，会用这个关系求值。","m":["能说出互为反函数的两对对应","能计算 log_a(a^k) 和 a^(log_a k)"],"q":"计算 log₂(2⁵)。","a":"5","o":"数与代数","t":"reasoning"},{"i":"cnm_h049","n":"函数零点","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.5","d":"知道函数零点就是方程 f(x)=0 的实根，也是图象与 x 轴交点的横坐标。","m":["能求简单函数的零点","能用函数值变号判断零点所在区间"],"q":"f(x)=x²−4 的正零点是多少？","a":"2","o":"数与代数","t":"procedural"},{"i":"cnm_h050","n":"二分法","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.5","d":"能用二分法把含根区间缩小一半，并计算中点的函数值。","m":["能求出区间中点","能根据中点函数值的符号选择下一区间"],"q":"区间 (1，3) 的中点是多少？","a":"2","o":"数与代数","t":"procedural"},{"i":"cnm_h051","n":"选择函数模型","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.5","d":"能根据增减快慢，区分一次、二次和指数模型，并代入计算。","m":["能指出哪种变化适合指数模型","能用给定模型求值"],"q":"某种细菌每小时数量变为原来的 2 倍，开始有 100 个。3 小时后有多少个？","a":"800","o":"数与代数","t":"application"},{"i":"cnm_h052","n":"函数模型的拟合与预测","b":"H","g":10,"k":"必修一","u":"第四章","c":"高一 第四章 指数函数与对数函数 4.5","d":"能用给定的函数模型做一步预测，并知道预测需要回到实际中检验。","m":["能把已知数据代入模型","能说明预测不是精确事实"],"q":"按模型 P=20+3t，t=10 时的值是多少？","a":"50","o":"数与代数","t":"application"},{"i":"cnm_h053","n":"数学建模的过程","b":"H","g":10,"k":"必修一","u":"数学建模","c":"高一 数学建模 建立函数模型","d":"知道数学建模包括提出问题、收集数据、建立模型、求解和检验。","m":["能按顺序说出建模的主要步骤","能指出检验是建模的一部分"],"q":"数学建模的合理顺序是？","a":"提出问题，收集数据，建立模型，求解并检验","o":"综合与实践","t":"modeling"},{"i":"cnm_h054","n":"用函数模型解决实际问题","b":"H","g":10,"k":"必修一","u":"数学建模","c":"高一 数学建模 建立函数模型","d":"能选择一次或指数函数描述一组简单数据，并计算预测值。","m":["能根据「每次加固定数」或「每次乘固定数」选择模型","能用模型算出指定时刻的值"],"q":"水位每小时上升 3 厘米，开始时 20 厘米。4 小时后按一次模型是多少厘米？","a":"32","o":"综合与实践","t":"modeling"},{"i":"cnm_h055","n":"任意角","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.1","d":"知道角可以按旋转方向分正角、负角和零角，大小可以超过一周。","m":["能判断正角和负角","知道任意角不一定在 0° 到 360° 之间"],"q":"按逆时针方向旋转形成的角是？","a":"正角","o":"数与代数","t":"conceptual"},{"i":"cnm_h056","n":"终边相同的角","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.1","d":"知道与角 α 终边相同的角可以写成 α+k·360°，k 为整数。","m":["能把指定范围内的终边相同角写出来","能判断两个角的终边是否相同"],"q":"与 400° 终边相同、且在 0° 到 360° 之间的角是多少度？","a":"40","o":"数与代数","t":"procedural"},{"i":"cnm_h057","n":"弧度制","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.1","d":"知道弧度是弧长与半径的比，1 弧度约等于半径长的弧所对的圆心角。","m":["能说出弧度的定义","知道 π 弧度等于 180°"],"q":"π 弧度等于多少度？","a":"180","o":"数与代数","t":"conceptual"},{"i":"cnm_h058","n":"角度与弧度的换算","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.1","d":"会把特殊角在角度和弧度之间换算。","m":["能把 π 的简单倍数写成角度","能把 30°、45°、60°、90° 写成弧度的系数"],"q":"π/6 弧度等于多少度？","a":"30","o":"数与代数","t":"procedural"},{"i":"cnm_h059","n":"弧长公式","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.1","d":"在弧度制下会用弧长等于半径乘圆心角。","m":["能由半径和弧度求弧长","能由弧长和半径求圆心角"],"q":"半径为 5、圆心角为 2 弧度，弧长是多少？","a":"10","o":"数与代数","t":"procedural"},{"i":"cnm_h060","n":"三角函数的定义","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.2","d":"借助单位圆，用终边与单位圆交点的坐标定义正弦和余弦。","m":["能说出正弦是纵坐标、余弦是横坐标","能求 0°、30°、90° 的正弦或余弦"],"q":"求 sin90°。","a":"1","o":"数与代数","t":"conceptual"},{"i":"cnm_h061","n":"三角函数的符号","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.2","d":"能按象限判断正弦、余弦的符号，并求轴上的特殊值。","m":["能说出各象限正弦、余弦的符号","能求 180°、270° 的正弦或余弦"],"q":"求 sin180°。","a":"0","o":"数与代数","t":"procedural"},{"i":"cnm_h062","n":"同角三角函数关系","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.2","d":"会用 sin²θ+cos²θ=1，以及用一个三角函数表示另一个。","m":["能由同角关系检验平方和","能由正弦求余弦的平方"],"q":"计算 sin²30°+cos²30°。","a":"1","o":"数与代数","t":"reasoning"},{"i":"cnm_h063","n":"由一个三角函数求其他值","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.2","d":"在已知角所在象限时，能由一个三角函数值求出其他值。","m":["能先确定符号再开方","能计算由此得到的整数或分数"],"q":"θ 为锐角，sinθ=1/2。求 2sinθ。","a":"1","o":"数与代数","t":"procedural"},{"i":"cnm_h064","n":"诱导公式","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.3","d":"知道终边相同、以及与 π±α、π/2±α 有关的诱导公式，能说出正弦、余弦如何变化。","m":["能说出 sin(π−α)=sinα","能说出 cos(π−α)=−cosα"],"q":"sin(180°−α) 等于？","a":"sinα","o":"数与代数","t":"conceptual"},{"i":"cnm_h065","n":"用诱导公式求值","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.3","d":"能把 120°、150°、180°、210°、270°、360° 的三角函数化为特殊值。","m":["能选择合适的诱导公式","能得到 0、±1 或 ±1/2"],"q":"求 sin150°。","a":"1/2","o":"数与代数","t":"procedural"},{"i":"cnm_h066","n":"正弦函数的图象与性质","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.4","d":"知道 y=sin x 的定义域、值域、最大最小值和周期性。","m":["能说出值域是 [−1，1]","能说出最小正周期是 2π"],"q":"y=sin x 的最大值是多少？","a":"1","o":"数与代数","t":"conceptual"},{"i":"cnm_h067","n":"正弦函数的单调区间","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.4","d":"能在 [−π/2，π/2] 一类区间上判断正弦的增减，并求端点函数值。","m":["能说出 [−π/2，π/2] 上正弦递增","能计算区间端点的正弦"],"q":"y=sin x 在 [−π/2，π/2] 上是？","a":"增函数","o":"数与代数","t":"reasoning"},{"i":"cnm_h068","n":"余弦函数的图象与性质","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.4","d":"知道 y=cos x 是偶函数，最大值为 1，最小值为 −1，最小正周期是 2π。","m":["能求 0°、60°、180° 的余弦","能说出余弦是偶函数"],"q":"求 cos0°。","a":"1","o":"数与代数","t":"conceptual"},{"i":"cnm_h069","n":"正切函数","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.4","d":"知道正切在余弦为 0 时没有定义，会求 0° 和 45° 的正切。","m":["能说出正切的无定义角","能求 tan0° 和 tan45°"],"q":"求 tan0°。","a":"0","o":"数与代数","t":"procedural"},{"i":"cnm_h070","n":"两角差的正弦","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.5","d":"会用 sin(α−β)=sinα cosβ−cosα sinβ 计算可以化成特殊角的值。","m":["能把公式用在 60° 与 30° 上","能把结果化成 1/2 这类值"],"q":"计算 sin60°cos30°−cos60°sin30°。已知 sin60°=cos30°=√3/2，cos60°=sin30°=1/2。","a":"1/2","o":"数与代数","t":"procedural"},{"i":"cnm_h071","n":"两角和的正弦与余弦","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.5","d":"会用和角公式计算能化成 0、±1/2、±1 的值。","m":["能计算 sin(α+β) 在特殊角上的值","能区分和角与差角公式的符号"],"q":"计算 sin30°cos60°+cos30°sin60°。已知 sin30°=cos60°=1/2，cos30°=sin60°=√3/2。","a":"1","o":"数与代数","t":"procedural"},{"i":"cnm_h072","n":"两角和与差的正切","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.5","d":"会用正切的和差公式计算分母不为 0 的特殊值。","m":["能计算 tan(α−β)","知道分母为 0 时公式不能用"],"q":"计算 (tan45°−tan0°)/(1+tan45°·tan0°)。","a":"1","o":"数与代数","t":"procedural"},{"i":"cnm_h073","n":"二倍角公式","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.5","d":"会用 cos2α=2cos²α−1=1−2sin²α 计算特殊角。","m":["能用余弦的二倍角公式求值","能说出二倍角公式的三种余弦形式"],"q":"计算 2cos²60°−1。","a":"-1/2","o":"数与代数","t":"procedural"},{"i":"cnm_h074","n":"简单的三角恒等变换","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.5","d":"能把同角关系和二倍角用在求值里，结果保持为整数或分数。","m":["能先化简再代入特殊角","能判断哪一种公式更合适"],"q":"计算 1+cos60°。","a":"3/2","o":"数与代数","t":"procedural"},{"i":"cnm_h075","n":"正弦型函数","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.6","d":"知道 y=Asin(ωx+φ) 中 A 影响振幅，ω 影响周期。","m":["能指出振幅是 |A|","能由 ω 说出周期与 2π 的关系"],"q":"y=2sin x 的最大值是多少？","a":"2","o":"数与代数","t":"conceptual"},{"i":"cnm_h076","n":"正弦型函数的参数","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.6","d":"能从解析式读出振幅、周期和初相。","m":["能读出 A 和 ω","能计算 x 取特殊值时的函数值"],"q":"y=2sin(2x+φ) 的振幅是多少？","a":"2","o":"数与代数","t":"procedural"},{"i":"cnm_h077","n":"由条件确定正弦型函数","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.6","d":"能由最大值、最小值和周期求出振幅、平衡位置和 ω。","m":["能用最大值和最小值求振幅","能由周期求 ω"],"q":"一个正弦型函数最大值是 5，最小值是 −1。振幅是多少？","a":"3","o":"数与代数","t":"procedural"},{"i":"cnm_h078","n":"三角函数的应用","b":"H","g":10,"k":"必修一","u":"第五章","c":"高一 第五章 三角函数 5.7","d":"能用正弦型函数描述温度、摩天轮高度等简单周期现象。","m":["能由平衡位置和振幅求最高、最低","能说明周期是现象重复一次的时间"],"q":"温度按 y=10+8sin(ωt) 变化。最高温度是多少？","a":"18","o":"数与代数","t":"application"},{"i":"cnm_h079","n":"平面向量的概念","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.1","d":"知道向量既有大小又有方向，长度叫做模。","m":["能区分向量和数量","能说出零向量的模是 0"],"q":"向量和数量的差别是？","a":"向量有方向，数量没有方向","o":"图形与几何","t":"conceptual"},{"i":"cnm_h080","n":"相等向量与共线向量","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.1","d":"知道相等向量方向相同且模相等，共线向量方向相同或相反。","m":["能判断两个向量是否相等","能区分相等和共线"],"q":"两个向量相等，是指？","a":"模相等并且方向相同","o":"图形与几何","t":"conceptual"},{"i":"cnm_h081","n":"向量加法","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.2","d":"会用三角形法则和平行四边形法则作向量加法，并在坐标下相加。","m":["能计算两个坐标向量的和","能说出加法满足交换律"],"q":"向量 (1，2) 与 (3，4) 的和的横坐标是多少？","a":"4","o":"图形与几何","t":"procedural"},{"i":"cnm_h082","n":"向量减法","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.2","d":"知道 a−b=a+(−b)，会在坐标下做减法。","m":["能计算坐标向量的差","能说出减去一个向量等于加上它的相反向量"],"q":"向量 (5，1) 减去 (2，3)，差的横坐标是多少？","a":"3","o":"图形与几何","t":"procedural"},{"i":"cnm_h083","n":"向量数乘","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.2","d":"会把向量乘以实数：正数不改方向，负数改成相反方向，模乘以绝对值。","m":["能计算数乘后的坐标","能说出数乘后的模"],"q":"3 乘以向量 (1，−2)，纵坐标是多少？","a":"-6","o":"图形与几何","t":"procedural"},{"i":"cnm_h084","n":"向量共线定理","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.2","d":"知道非零向量 b 与 a 共线，当且仅当存在实数 λ 使 b=λa。","m":["能判断一个向量是否为另一个的实数倍","能求出这个倍数"],"q":"向量 (2，4) 是 (1，2) 的多少倍？","a":"2","o":"图形与几何","t":"reasoning"},{"i":"cnm_h085","n":"平面向量基本定理","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.3","d":"知道不共线的两个向量可以作基底，平面内任一向量都能唯一分解到这组基底上。","m":["能说出基底必须不共线","能把向量写成两个不共线向量的线性组合"],"q":"作为平面向量基底的两个向量必须？","a":"不共线","o":"图形与几何","t":"conceptual"},{"i":"cnm_h086","n":"向量的坐标表示","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.3","d":"会在平面直角坐标系里用起点和终点的坐标表示向量。","m":["能由起点和终点写出向量坐标","能说出坐标等于终点坐标减起点坐标"],"q":"起点 (1，2)，终点 (4，6)。这个向量的横坐标是多少？","a":"3","o":"图形与几何","t":"procedural"},{"i":"cnm_h087","n":"坐标运算","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.3","d":"会用坐标做加法、减法和数乘。","m":["能对坐标分别进行加减","能求线性组合的坐标"],"q":"a=(2，−1)，b=(1，4)。2a+b 的横坐标是多少？","a":"5","o":"图形与几何","t":"procedural"},{"i":"cnm_h088","n":"向量数量积","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.4","d":"知道 a·b=|a||b|cosθ，也会用坐标计算 x1x2+y1y2。","m":["能用坐标求数量积","知道数量积是一个数"],"q":"求 (1，2)·(3，4)。","a":"11","o":"图形与几何","t":"procedural"},{"i":"cnm_h089","n":"数量积的运算律","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.4","d":"会用分配律把数量积拆开，并知道 a·a 等于模的平方。","m":["能计算 a·a","能用分配律求 (a+b)·c"],"q":"a=(3，4)。|a|²=a·a，|a| 是多少？","a":"5","o":"图形与几何","t":"procedural"},{"i":"cnm_h090","n":"向量的模与夹角","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.4","d":"能由坐标求模，并判断两个向量是否垂直。","m":["能用勾股定理求模","知道数量积为 0 时垂直"],"q":"求向量 (3，4) 的模。","a":"5","o":"图形与几何","t":"procedural"},{"i":"cnm_h091","n":"余弦定理","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.4","d":"会用余弦定理求第三边的平方，已知两边及其夹角的余弦。","m":["能写出余弦定理","能在 cos 为 0、1 或 1/2 时算出第三边的平方"],"q":"两边为 2 和 3，夹角的余弦是 1/2。第三边的平方是多少？","a":"7","o":"图形与几何","t":"procedural"},{"i":"cnm_h092","n":"正弦定理","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.4","d":"会用 a/sinA=2R 在特殊角下求边或直径。","m":["能在 sin 为 1 或 1/2 时使用正弦定理","能说出正弦定理与外接圆直径的关系"],"q":"a=2，A=30°，sin30°=1/2。a/sinA 等于多少？","a":"4","o":"图形与几何","t":"procedural"},{"i":"cnm_h093","n":"解三角形","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.4","d":"能选择正弦或余弦定理，求出三角形中未知的边或角的相关数值。","m":["能判断该用正弦还是余弦","能在直角三角形中求出第三边"],"q":"三角形两边为 6 和 8，夹角 90°。第三边是多少？","a":"10","o":"图形与几何","t":"application"},{"i":"cnm_h094","n":"解三角形的实际应用","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.4","d":"能把简单的测量问题归结为求三角形的边或角。","m":["能指出测量问题里的已知边角","能在直角情形下求距离"],"q":"船从岸边垂直驶出 12 千米，再沿垂直方向驶 5 千米。离出发点的直线距离是多少千米？","a":"13","o":"图形与几何","t":"application"},{"i":"cnm_h095","n":"向量方法研究图形","b":"H","g":11,"k":"必修二","u":"第六章","c":"高二 第六章 平面向量及其应用 6.4","d":"会用向量的模和数量积说明垂直、长度等简单几何事实。","m":["能用数量积判断垂直","能用模比较长度"],"q":"平行四边形邻边向量为 (2，1) 和 (1，−2)。它们的数量积是多少？","a":"0","o":"图形与几何","t":"reasoning"},{"i":"cnm_h096","n":"用向量研究三角形","b":"H","g":11,"k":"必修二","u":"数学探究","c":"高二 数学探究 用向量研究三角形","d":"能按探究步骤用向量重写三角形的边角关系，并计算一个具体例子。","m":["能说出探究要有猜想、推算和检验","能用向量坐标计算三角形的一条边长"],"q":"三角形顶点 A(0，0)、B(4，0)、C(0，3)。边 BC 的长是多少？","a":"5","o":"综合与实践","t":"modeling"},{"i":"cnm_h097","n":"复数的概念","b":"H","g":11,"k":"必修二","u":"第七章","c":"高二 第七章 复数 7.1","d":"知道复数 z=a+bi（a、b 为实数，i²=−1），a 是实部，b 是虚部。","m":["能指出实部和虚部","知道实数是虚部为 0 的复数"],"q":"复数 3−2i 的实部是多少？","a":"3","o":"数与代数","t":"conceptual"},{"i":"cnm_h098","n":"复数的几何意义","b":"H","g":11,"k":"必修二","u":"第七章","c":"高二 第七章 复数 7.1","d":"知道复数 a+bi 对应复平面上的点 (a，b)，模是该点到原点的距离。","m":["能写出复数对应的点","能计算可开尽的模"],"q":"复数 3+4i 的模是多少？","a":"5","o":"数与代数","t":"conceptual"},{"i":"cnm_h099","n":"复数相等","b":"H","g":11,"k":"必修二","u":"第七章","c":"高二 第七章 复数 7.1","d":"知道 a+bi=c+di 当且仅当 a=c 且 b=d。","m":["能分别比较实部和虚部","能由此求出未知实数"],"q":"若 x+2i=3+yi，且 x、y 为实数，则 x 是多少？","a":"3","o":"数与代数","t":"procedural"},{"i":"cnm_h100","n":"复数加法与减法","b":"H","g":11,"k":"必修二","u":"第七章","c":"高二 第七章 复数 7.2","d":"会把实部与实部相加减，虚部与虚部相加减。","m":["能计算两个复数的和","能计算两个复数的差"],"q":"(1+2i)+(3+4i) 的实部是多少？","a":"4","o":"数与代数","t":"procedural"},{"i":"cnm_h101","n":"复数加减的几何意义","b":"H","g":11,"k":"必修二","u":"第七章","c":"高二 第七章 复数 7.2","d":"知道复数加减对应向量加减，和的模不超过模的和。","m":["能把复数看成向量后做加减","能比较和的模与模的和"],"q":"复数 3 与 4i 的模分别是 3 和 4。它们的和 3+4i 的模是多少？","a":"5","o":"数与代数","t":"reasoning"},{"i":"cnm_h102","n":"复数乘法","b":"H","g":11,"k":"必修二","u":"第七章","c":"高二 第七章 复数 7.2","d":"会按分配律做复数乘法，并把 i² 换成 −1。","m":["能计算两个复数的积的实部","能计算 i 的正整数次幂中可化为 ±1 的情形"],"q":"计算 (1+i)(1−i) 的结果。","a":"2","o":"数与代数","t":"procedural"},{"i":"cnm_h103","n":"复数除法","b":"H","g":11,"k":"必修二","u":"第七章","c":"高二 第七章 复数 7.2","d":"会用分母的共轭把除法化成乘法，并计算结果的实部或虚部。","m":["能指出共轭复数","能计算分母为实数或可化为整数的商"],"q":"(4+6i)/2 的实部是多少？","a":"2","o":"数与代数","t":"procedural"},{"i":"cnm_h104","n":"复数的幂","b":"H","g":11,"k":"必修二","u":"第七章","c":"高二 第七章 复数 7.2","d":"会计算 i 的整数次幂，以及实系数下可化为整数的简单幂。","m":["能把 i 的幂化成 1、−1、i 或 −i 中的实数情形","能计算 (a+bi)(a−bi)"],"q":"i³=−i。它的虚部是多少？","a":"-1","o":"数与代数","t":"procedural"},{"i":"cnm_h105","n":"棱柱的结构","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.1","d":"认识棱柱的底面、侧面、侧棱和顶点，会数简单棱柱的顶点数、棱数和面数。","m":["能说出棱柱的构成要素","能数出直棱柱的顶点、棱和面"],"q":"长方体有多少个顶点？","a":"8","o":"图形与几何","t":"conceptual"},{"i":"cnm_h106","n":"圆柱、圆锥与球","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.1","d":"能说出圆柱、圆锥、球的主要元素，并和棱柱区分开。","m":["能指出圆柱的母线和高","能说出球的半径"],"q":"圆柱可以看成？","a":"矩形绕它的一条边旋转一周","o":"图形与几何","t":"conceptual"},{"i":"cnm_h107","n":"简单组合体","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.1","d":"能把简单组合体拆成柱、锥、球，并数出可见的简单个数。","m":["能指出组合体由哪些基本几何体组成","能分别使用各部分的数量"],"q":"一个几何体由 1 个圆柱和 1 个圆锥拼成。基本几何体的个数是多少？","a":"2","o":"图形与几何","t":"procedural"},{"i":"cnm_h108","n":"斜二测画法","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.2","d":"知道水平放置的图形在斜二测直观图里，平行于横轴的线段长度不变，平行于纵轴的线段画成一半。","m":["能说出哪一个方向的长度不变","能把平行于纵轴的长度折半"],"q":"水平放置的图形中，平行于横轴的线段长 6。直观图上这条线段画成多长？","a":"6","o":"图形与几何","t":"procedural"},{"i":"cnm_h109","n":"水平放置的平面图形直观图","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.2","d":"能根据斜二测规则，计算直观图里已知线段对应的长度。","m":["能分别处理横、纵两个方向","能判断原来平行的线段在直观图中仍平行"],"q":"正方形边长为 4，放在水平面上，一条边平行于横轴。这条边在直观图上的长度是多少？","a":"4","o":"图形与几何","t":"procedural"},{"i":"cnm_h110","n":"简单几何体的表面积","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.3","d":"会计算棱柱、正方体的表面积；圆柱、圆锥在已知底面积或侧面展开数据时能代入。","m":["能计算正方体和长方体的表面积","能把曲面展开后的数据代进公式"],"q":"棱长为 3 的正方体，表面积是多少？","a":"54","o":"图形与几何","t":"procedural"},{"i":"cnm_h111","n":"简单几何体的体积","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.3","d":"会用底面积乘高求柱体体积，并用三分之一求锥体体积。","m":["能计算棱柱和已知底面积的圆柱体积","能计算已知底面积和高的圆锥体积"],"q":"底面积为 20、高为 4 的棱柱，体积是多少？","a":"80","o":"图形与几何","t":"procedural"},{"i":"cnm_h112","n":"球的体积与表面积","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.3","d":"知道球的体积与半径的立方成正比，表面积与半径的平方成正比，会比较不同半径的倍数。","m":["能由半径比求体积比","能由半径比求表面积比"],"q":"半径变为原来的 2 倍时，球的体积变为原来的多少倍？","a":"8","o":"图形与几何","t":"reasoning"},{"i":"cnm_h113","n":"平面的基本事实","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.4","d":"了解确定平面的基本事实，以及两个平面相交的基本事实。","m":["能说出过不共线三点确定一个平面","能说出两平面相交成一条直线"],"q":"经过不在同一条直线上的三点，可以确定几个平面？","a":"有且只有一个","o":"图形与几何","t":"conceptual"},{"i":"cnm_h114","n":"空间直线的位置关系","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.4","d":"能区分相交、平行和异面，知道异面直线既不平行也不相交。","m":["能判断两条直线是否共面","能说出异面直线的含义"],"q":"异面直线是指？","a":"不同在任何一个平面内的两条直线","o":"图形与几何","t":"conceptual"},{"i":"cnm_h115","n":"直线与平面、平面与平面的位置","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.4","d":"能区分线面相交、线面平行、线在面内，以及面面平行、面面相交。","m":["能说出直线与平面的三种位置","能说平面与平面要么平行要么相交"],"q":"直线与平面的位置关系有几种？","a":"在平面内、平行、相交，共三种","o":"图形与几何","t":"conceptual"},{"i":"cnm_h116","n":"直线与平面平行的判定","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.5","d":"会用「平面外一条直线平行于平面内一条直线」判定线面平行。","m":["能说出判定定理的条件","能指出缺了哪一条条件就不能用"],"q":"直线 a 不在平面内，且 a 平行于平面内的直线 b。则？","a":"a 与这个平面平行","o":"图形与几何","t":"reasoning"},{"i":"cnm_h117","n":"直线与平面平行的性质","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.5","d":"知道过这条直线的平面若与已知平面相交，则交线与该直线平行。","m":["能说出交线与已知直线平行","能区分判定和性质"],"q":"直线 a 平行于平面 α。过 a 的平面与 α 交于 b。则？","a":"a 平行于 b","o":"图形与几何","t":"reasoning"},{"i":"cnm_h118","n":"平面与平面平行的判定","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.5","d":"会用「一个平面内的两条相交直线都平行于另一个平面」判定面面平行。","m":["能说出需要两条相交直线","能说明一条直线不够"],"q":"平面 α 内两条相交直线都平行于平面 β。则？","a":"α 平行于 β","o":"图形与几何","t":"reasoning"},{"i":"cnm_h119","n":"平面与平面平行的性质","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.5","d":"知道两个平行平面被第三个平面所截，两条交线互相平行。","m":["能说出两条交线平行","能在长方体中指出这样的交线"],"q":"两个平行平面被第三个平面所截，得到的两条交线？","a":"互相平行","o":"图形与几何","t":"reasoning"},{"i":"cnm_h120","n":"直线与平面垂直的判定","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.6","d":"会用「垂直于平面内两条相交直线」判定直线与平面垂直。","m":["能说出必须垂直于两条相交直线","能说明只垂直于一条不够"],"q":"直线 l 垂直于平面内两条相交直线。则？","a":"l 垂直于这个平面","o":"图形与几何","t":"reasoning"},{"i":"cnm_h121","n":"直线与平面垂直的性质","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.6","d":"知道垂直于同一平面的两条直线互相平行。","m":["能由线面垂直得到两条直线平行","能在长方体里举出例子"],"q":"垂直于同一个平面的两条直线？","a":"互相平行","o":"图形与几何","t":"reasoning"},{"i":"cnm_h122","n":"平面与平面垂直","b":"H","g":11,"k":"必修二","u":"第八章","c":"高二 第八章 立体几何初步 8.6","d":"知道若一个平面过另一个平面的垂线，则这两个平面垂直。不计算二面角的大小。","m":["能用平面的垂线判定面面垂直","知道本图谱不要求计算二面角的度数"],"q":"一个平面经过另一个平面的一条垂线，则这两个平面？","a":"互相垂直","o":"图形与几何","t":"reasoning"},{"i":"cnm_h123","n":"获取数据的途径","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.1","d":"知道可以通过调查、试验、观察和资料获取数据，并能按问题选择途径。","m":["能说出常见的数据来源","能判断一个问题适合普查还是抽样"],"q":"想知道一批灯泡的使用寿命，又不能把灯泡全部用坏。更合适的是？","a":"抽样试验","o":"统计与概率","t":"conceptual"},{"i":"cnm_h124","n":"简单随机抽样","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.1","d":"会用抽签或随机数做简单随机抽样，知道每个个体被抽到的机会相同。","m":["能计算每个人被抽到的概率","能说出简单随机抽样的特点"],"q":"总体有 20 人，用简单随机抽样抽 1 人。每个人被抽到的概率是多少？","a":"1/20","o":"统计与概率","t":"procedural"},{"i":"cnm_h125","n":"分层随机抽样","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.1","d":"能按各层的个体数比例分配样本。","m":["能计算每一层应抽的人数","能把各层人数加总核对样本量"],"q":"甲层 40 人、乙层 60 人，按 1/10 分层抽样。甲层应抽多少人？","a":"4","o":"统计与概率","t":"procedural"},{"i":"cnm_h126","n":"抽样方法的选择","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.1","d":"能根据总体是否分层，选择简单随机抽样或分层抽样。","m":["能指出比例抽样是分层","能说明样本不是总体本身"],"q":"学校三个年级人数差很多，要了解全校每天的作业时间。更合适的是？","a":"分层随机抽样","o":"统计与概率","t":"reasoning"},{"i":"cnm_h127","n":"频率分布直方图","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.2","d":"知道小长方形的面积表示频率，高是频率除以组距，各面积之和为 1。","m":["能由频率、组距和样本容量求频数","能检验各频率之和"],"q":"组距为 5，频率除以组距等于 0.04，样本容量为 50。这一组的频数是多少？","a":"10","o":"统计与概率","t":"procedural"},{"i":"cnm_h128","n":"从直方图读取信息","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.2","d":"能从频率和组距还原频数，并比较哪一组更多。","m":["能计算指定组的频数","能比较两组频率"],"q":"样本容量 40，某组频率 0.25。这一组的频数是多少？","a":"10","o":"统计与概率","t":"procedural"},{"i":"cnm_h129","n":"百分位数","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.2","d":"会按人教练习中常见的做法求百分位数：数据从小到大排好，i=n×p%。i 不是整数时取第 ceil(i) 个数；i 是整数时取第 i 个和第 i+1 个的平均数。","m":["能判断 i 是否为整数","能按规则取出对应的数"],"q":"数据 1，2，3，4 已按从小到大排列，n=4。求第 50 百分位数。规则：i=n×50%；i 是整数时取第 i 个和第 i+1 个的平均数。","a":"5/2","o":"统计与概率","t":"procedural"},{"i":"cnm_h130","n":"用样本估计总体的中心","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.2","d":"会计算样本平均数和中位数，并用来估计总体的中心。","m":["能求一组数据的平均数","能求中位数"],"q":"样本 2，4，6，8 的平均数是多少？","a":"5","o":"统计与概率","t":"procedural"},{"i":"cnm_h131","n":"用样本估计总体的离散程度","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.2","d":"会用极差和总体方差（除以 n）比较数据的波动。题干若说方差，都指除以 n。","m":["能计算极差","能计算除以 n 的方差"],"q":"数据 2，4，4，6 的极差是多少？","a":"4","o":"统计与概率","t":"procedural"},{"i":"cnm_h132","n":"统计图表的选择","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.2","d":"能根据问题选择条形图、折线图、扇形图或直方图。","m":["能说出扇形图适合看占比","能说出折线图适合看变化"],"q":"要看各部分占总体的百分比，更合适的是？","a":"扇形图","o":"统计与概率","t":"reasoning"},{"i":"cnm_h133","n":"统计案例","b":"H","g":11,"k":"必修二","u":"第九章","c":"高二 第九章 统计 9.3","d":"能在简单案例中比较两组样本的平均数，并说明结论是估计。","m":["能计算并比较两组平均数","能说出样本结论不能当成绝对事实"],"q":"甲组 4 人的体重数据 60，62，64，66。平均数是多少？","a":"63","o":"统计与概率","t":"application"},{"i":"cnm_h134","n":"样本点与样本空间","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.1","d":"知道一次试验的每个可能结果是样本点，全体样本点组成样本空间。","m":["能列出有限试验的全部样本点","能说出样本空间用集合表示"],"q":"抛一枚均匀硬币 2 次，样本点有多少个？","a":"4","o":"统计与概率","t":"conceptual"},{"i":"cnm_h135","n":"随机事件","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.1","d":"知道事件是样本空间的子集，必然事件是样本空间本身，不可能事件是空集。","m":["能判断一个事件是不是必然或不可能","能说出事件的概率在 0 和 1 之间"],"q":"必然事件的概率是？","a":"1","o":"统计与概率","t":"conceptual"},{"i":"cnm_h136","n":"事件的关系与运算","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.1","d":"会用交、并、补表示事件同时发生、至少一个发生和对立事件。","m":["能说出并事件和交事件的含义","能计算有限样本空间中对立事件的样本点数"],"q":"样本空间有 8 个样本点，事件 A 有 3 个。A 的对立事件有几个样本点？","a":"5","o":"统计与概率","t":"procedural"},{"i":"cnm_h137","n":"古典概型","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.1","d":"在有限且等可能的样本空间里，用事件的样本点数除以总数求概率。","m":["能判断是否等可能","能用组合数计算抽取的概率"],"q":"袋中 5 红 3 蓝，共 8 个球，随机摸 2 个。摸到 2 个红球的概率是多少？","a":"5/14","o":"统计与概率","t":"procedural"},{"i":"cnm_h138","n":"概率的加法","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.1","d":"会用互斥事件的加法：P(A∪B)=P(A)+P(B)。也会用容斥处理不互斥的情形。","m":["能判断两个事件是否互斥","能计算互斥事件的并的概率"],"q":"A、B 互斥，P(A)=1/4，P(B)=1/5。P(A∪B) 是多少？","a":"9/20","o":"统计与概率","t":"procedural"},{"i":"cnm_h139","n":"互斥与对立","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.1","d":"能区分互斥和对立：对立一定互斥，互斥不一定对立。","m":["能判断一对事件是互斥还是对立","能计算对立事件的概率"],"q":"对立一定互斥吗？","a":"一定","o":"统计与概率","t":"reasoning"},{"i":"cnm_h140","n":"事件的相互独立","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.2","d":"知道若 P(A∩B)=P(A)P(B)，则 A 与 B 相互独立。独立不是互斥。","m":["能用乘法计算两个独立事件同时发生的概率","能说出独立和互斥不同"],"q":"A 与 B 相互独立，P(A)=1/2，P(B)=1/3。P(A∩B) 是多少？","a":"1/6","o":"统计与概率","t":"conceptual"},{"i":"cnm_h141","n":"独立事件的概率计算","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.2","d":"会计算多次独立重复中「都发生」或「至少一次」的概率。条件概率不在必修范围。","m":["能计算 n 次独立都发生的概率","能用对立事件求至少一次"],"q":"每次命中概率为 1/2，三次独立射击都命中的概率是多少？","a":"1/8","o":"统计与概率","t":"procedural"},{"i":"cnm_h142","n":"频率与概率","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.3","d":"知道频率会在试验次数增多时稳定到概率附近，频率本身不是概率。","m":["能计算一批试验的频率","能说出频率和概率的区别"],"q":"做了 200 次试验，事件出现 40 次。频率是多少？","a":"1/5","o":"统计与概率","t":"conceptual"},{"i":"cnm_h143","n":"用频率估计概率","b":"H","g":11,"k":"必修二","u":"第十章","c":"高二 第十章 概率 10.3","d":"能用大量重复试验的频率估计概率，并比较哪一个估计用的试验更多。","m":["能选出试验次数更多的估计","能计算频率作为估计值"],"q":"1000 次试验中事件出现 320 次。用频率估计的概率是多少？","a":"8/25","o":"统计与概率","t":"application"},{"i":"cnm_h144","n":"空间向量的概念","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.1","d":"空间向量是空间中既有大小又有方向的量，可以由平面向量推广得到。","m":["能说出空间向量与有向线段的关系","能判断方向相同但长度不同的向量不相等"],"q":"下面哪一项符合空间向量的含义？","a":"既有大小又有方向的量","o":"图形与几何","t":"conceptual"},{"i":"cnm_h145","n":"空间向量的线性运算","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.1","d":"会做空间向量的加法、减法和数乘，法则与平面向量相同。","m":["能计算两个空间向量的和与差","能计算空间向量的数乘"],"q":"a=(1，0，2)，b=(3，4，−1)。a+b 的横坐标是多少？","a":"4","o":"图形与几何","t":"procedural"},{"i":"cnm_h146","n":"空间向量的数量积","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.1","d":"空间向量的数量积等于对应坐标的乘积之和，也等于模与夹角余弦的乘积。","m":["能用坐标计算数量积","知道数量积为 0 时两个非零向量垂直"],"q":"a=(1，2，2)，b=(2，0，1)。a·b 等于多少？","a":"4","o":"图形与几何","t":"procedural"},{"i":"cnm_h147","n":"空间向量的模与夹角","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.1","d":"空间向量的模用坐标的平方和开方计算，夹角由数量积和两个模决定。","m":["能用坐标求向量的模","能根据数量积判断夹角是锐角、直角还是钝角"],"q":"a=(2，3，6)。|a| 等于多少？","a":"7","o":"图形与几何","t":"procedural"},{"i":"cnm_h148","n":"空间向量共线","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.1","d":"存在实数 λ 使 b=λa 时，a 与 b 共线；坐标成比例也可以判断。","m":["能判断两个空间向量是否共线","能由共线条件求参数"],"q":"b=(2，4，−6)，a=(1，2，−3)。若 b=λa，λ 等于多少？","a":"2","o":"图形与几何","t":"reasoning"},{"i":"cnm_h149","n":"空间向量基本定理","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.2","d":"空间中任一向量都可以由三个不共面的向量唯一线性表示。","m":["能说出基底需要三个不共面的向量","能判断一组向量能不能作为基底"],"q":"空间向量基本定理里，基底通常要有几个不共面的向量？","a":"3 个","o":"图形与几何","t":"conceptual"},{"i":"cnm_h150","n":"空间向量的正交分解","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.2","d":"若三个基底两两垂直，向量可以沿这三个方向做正交分解。","m":["能说出正交分解要求基底两两垂直","能在两两垂直的方向上读出分量"],"q":"正交分解所用的三个方向需要满足什么？","a":"两两垂直","o":"图形与几何","t":"reasoning"},{"i":"cnm_h151","n":"空间直角坐标系","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.3","d":"空间直角坐标系由原点发出三条两两垂直的数轴，点用有序三元数 (x，y，z) 表示。","m":["能说出三条坐标轴两两垂直","能读出点的三个坐标"],"q":"点 P(3，−1，5) 的竖坐标是多少？","a":"5","o":"图形与几何","t":"conceptual"},{"i":"cnm_h152","n":"空间向量的坐标","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.3","d":"起点为 A、终点为 B 的向量坐标等于终点坐标减去起点坐标。","m":["能由两点写出向量坐标","能把向量坐标写成分量形式"],"q":"A(1，2，0)，B(4，2，5)。向量 AB 的横坐标是多少？","a":"3","o":"图形与几何","t":"procedural"},{"i":"cnm_h153","n":"坐标下的向量运算","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.3","d":"在坐标下，线性运算按分量计算，数量积是对应分量乘积之和。","m":["能在坐标下做加法和数乘","能在坐标下计算数量积"],"q":"a=(1，0，2)，b=(3，4，−1)。2a+b 的横坐标是多少？","a":"5","o":"图形与几何","t":"procedural"},{"i":"cnm_h154","n":"空间两点间的距离","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.3","d":"空间两点的距离等于这两点所连向量的模，用三个坐标差的平方和开方。","m":["能用坐标差计算两点距离","知道距离公式来自勾股定理"],"q":"A(0，0，0)，B(2，3，6)。AB 的长度是多少？","a":"7","o":"图形与几何","t":"procedural"},{"i":"cnm_h155","n":"直线的方向向量","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"与直线平行的非零向量叫做这条直线的方向向量，一条直线的方向向量不唯一。","m":["能由直线上两点写出一个方向向量","知道方向向量乘非零实数后仍是方向向量"],"q":"直线过 A(1，2，3) 和 B(4，6，3)。一个方向向量的横坐标是多少？","a":"3","o":"图形与几何","t":"conceptual"},{"i":"cnm_h156","n":"平面的法向量","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"垂直于一个平面的非零向量叫做这个平面的法向量。","m":["能说明法向量垂直于平面内的两条相交直线","知道法向量的非零倍数仍是法向量"],"q":"平面的法向量与这个平面是什么关系？","a":"垂直","o":"图形与几何","t":"conceptual"},{"i":"cnm_h157","n":"用向量判断线面平行","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"直线的方向向量与平面的法向量垂直，且直线不在平面内时，直线与平面平行。","m":["能用方向向量和法向量的数量积判断线面平行","能区分平行和直线在平面内"],"q":"方向向量 d=(1，−1，0)，法向量 n=(1，1，1)。d·n 等于多少？","a":"0","o":"图形与几何","t":"reasoning"},{"i":"cnm_h158","n":"用向量判断面面平行","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"两个平面的法向量共线时，这两个平面平行或重合。","m":["能用法向量是否共线判断面面平行","知道法向量共线还要排除两个平面重合"],"q":"n1=(1，−2，2)，n2=(2，−4，4)。n2 是 n1 的几倍？","a":"2","o":"图形与几何","t":"reasoning"},{"i":"cnm_h159","n":"用向量判断线面垂直","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"直线的方向向量与平面的法向量共线时，直线与平面垂直。","m":["能比较方向向量和法向量是否共线","能由线面垂直写出方向向量与法向量的倍数关系"],"q":"直线方向向量 d=(2，−2，4)，平面法向量 n=(1，−1，2)。d 是 n 的几倍？","a":"2","o":"图形与几何","t":"reasoning"},{"i":"cnm_h160","n":"用向量判断面面垂直","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"两个平面的法向量互相垂直时，这两个平面互相垂直。","m":["能用法向量的数量积判断面面垂直","能把面面垂直转化成法向量垂直"],"q":"n1=(1，0，1)，n2=(1，2，−1)。n1·n2 等于多少？","a":"0","o":"图形与几何","t":"reasoning"},{"i":"cnm_h161","n":"空间角","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"异面或相交直线的夹角、直线与平面所成的角，都可以化为方向向量、法向量的夹角。","m":["能用方向向量的数量积讨论线线角","知道线面角的正弦与方向向量、法向量有关"],"q":"两条直线的方向向量是 d1=(1，0，0) 和 d2=(0，1，0)。d1·d2 等于多少？","a":"0","o":"图形与几何","t":"procedural"},{"i":"cnm_h162","n":"二面角","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"二面角的大小可以用法向量的夹角来表示，取法向量时要注意哪一侧是二面角的内部。","m":["能写出两个半平面的法向量","知道二面角的平面角与法向量夹角相等或互补"],"q":"两个半平面的法向量 n1=(1，0，0)，n2=(0，1，0)。n1·n2 等于多少？","a":"0","o":"图形与几何","t":"procedural"},{"i":"cnm_h163","n":"点到平面的距离","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"点到平面 ax+by+cz+d=0 的距离等于把点代入后的绝对值除以法向量的模。","m":["能代入点到平面的距离公式","知道分子是绝对值、分母是法向量的模"],"q":"平面 x+2y+2z−6=0，点 (1，1，1) 到平面的距离是多少？","a":"1/3","o":"图形与几何","t":"procedural"},{"i":"cnm_h164","n":"用向量解决简单立体几何问题","b":"H","g":12,"k":"选必一","u":"第一章","c":"选必一 第一章 空间向量与立体几何 1.4","d":"把平行、垂直和距离都写成向量条件后，可以用坐标运算代替一部分几何证明。","m":["能把一个立体几何条件写成向量等式","能用坐标结果说明平行或垂直"],"q":"长方体中一条棱的方向向量是 (4，0，0)，另一条棱的方向向量是 (0，3，0)。它们的数量积是多少？","a":"0","o":"图形与几何","t":"application"},{"i":"cnm_h165","n":"直线的倾斜角","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.1","d":"直线向上方向与 x 轴正方向所成的最小正角叫做倾斜角，范围是 0 度到 180 度。","m":["能说出倾斜角的范围","能区分倾斜角和直线与 x 轴的另一个夹角"],"q":"直线倾斜角的取值范围是？","a":"大于等于 0 度且小于 180 度","o":"图形与几何","t":"conceptual"},{"i":"cnm_h166","n":"直线的斜率","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.1","d":"斜率是倾斜角的正切。倾斜角为 90 度时直线与 x 轴垂直，斜率不存在。","m":["能说出斜率是倾斜角的正切","能判断垂直于 x 轴的直线没有斜率"],"q":"斜率存在时，它等于什么？","a":"倾斜角的正切","o":"图形与几何","t":"conceptual"},{"i":"cnm_h167","n":"过两点的斜率公式","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.1","d":"过不同两点 (x1，y1)、(x2，y2) 的直线，在 x1≠x2 时斜率为 (y2−y1)/(x2−x1)。","m":["能用两点坐标求斜率","知道横坐标相同的两点连线没有斜率"],"q":"直线过 (1，1) 和 (4，7)。斜率是多少？","a":"2","o":"图形与几何","t":"procedural"},{"i":"cnm_h168","n":"用斜率判断平行与垂直","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.1","d":"两条斜率都存在的直线：斜率相等则平行，斜率乘积为 −1 则垂直。","m":["能用斜率判断平行","能用斜率乘积判断垂直"],"q":"两条不重合的直线斜率都是 3。它们的位置关系是？","a":"平行","o":"图形与几何","t":"reasoning"},{"i":"cnm_h169","n":"直线的点斜式","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.2","d":"过点 (x0，y0)、斜率为 k 的直线可以写成 y−y0=k(x−x0)。","m":["能由一点和斜率写点斜式","能从点斜式读出斜率和经过的点"],"q":"直线过 (1，2)，斜率是 3。它在 y 轴上的截距是多少？","a":"-1","o":"图形与几何","t":"procedural"},{"i":"cnm_h170","n":"直线的截距式","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.2","d":"与两条坐标轴分别交于 (a，0)、(0，b) 且 a、b 都不为 0 的直线，可以写成 x/a+y/b=1。","m":["能从截距式读出横截距和纵截距","知道过原点的直线不能写成截距式"],"q":"直线 x/2+y/3=1 的纵截距是多少？","a":"3","o":"图形与几何","t":"procedural"},{"i":"cnm_h171","n":"直线的一般式","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.2","d":"平面内的直线都可以写成 Ax+By+C=0，其中 A、B 不全为 0。B≠0 时斜率为 −A/B。","m":["能把点斜式化成一般式","能从一般式求斜率"],"q":"直线 2x−y+4=0 的斜率是多少？","a":"2","o":"图形与几何","t":"procedural"},{"i":"cnm_h172","n":"两条直线的交点","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.3","d":"两条直线的交点坐标是它们的方程联立后的公共解。","m":["能联立两个一次方程求交点","知道斜率相等时没有唯一交点"],"q":"直线 x+y=5 与 x−y=1 的交点横坐标是多少？","a":"3","o":"图形与几何","t":"procedural"},{"i":"cnm_h173","n":"两点间的距离","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.3","d":"平面上两点的距离等于横、纵坐标之差的平方和的算术平方根。","m":["能用两点距离公式计算","知道公式是勾股定理"],"q":"(1，2) 与 (4，6) 的距离是多少？","a":"5","o":"图形与几何","t":"procedural"},{"i":"cnm_h174","n":"点到直线的距离","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.3","d":"点 (x0，y0) 到直线 Ax+By+C=0 的距离是 |Ax0+By0+C| 除以 √(A²+B²)。","m":["能代入点到直线的距离公式","知道点在直线上时距离为 0"],"q":"原点到直线 3x+4y−10=0 的距离是多少？","a":"2","o":"图形与几何","t":"procedural"},{"i":"cnm_h175","n":"平行直线间的距离","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.3","d":"两条平行直线 Ax+By+C1=0 与 Ax+By+C2=0 的距离是 |C1−C2| 除以 √(A²+B²)。","m":["能把平行直线写成 A、B 相同的一般式","能计算平行线间的距离"],"q":"平行直线 3x+4y−1=0 与 3x+4y−11=0 的距离是多少？","a":"2","o":"图形与几何","t":"procedural"},{"i":"cnm_h176","n":"圆的标准方程","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.4","d":"圆心为 (a，b)、半径为 r 的圆，方程是 (x−a)²+(y−b)²=r²。","m":["能由圆心和半径写标准方程","能从标准方程读出圆心和半径"],"q":"圆 (x−2)²+(y+1)²=25 的半径是多少？","a":"5","o":"图形与几何","t":"procedural"},{"i":"cnm_h177","n":"圆的一般方程","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.4","d":"x²+y²+Dx+Ey+F=0 在 D²+E²−4F>0 时表示圆，圆心是 (−D/2，−E/2)。","m":["能配方求出圆心和半径","能判断一般方程是否表示圆"],"q":"圆 x²+y²−4x+2y−4=0 的半径是多少？","a":"3","o":"图形与几何","t":"procedural"},{"i":"cnm_h178","n":"由条件确定圆的方程","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.4","d":"圆心、半径或圆上的点可以确定圆的方程，常用待定系数。","m":["能由圆心和半径写方程","能用圆上的点求待定系数"],"q":"圆心在原点，圆经过 (3，4)。半径是多少？","a":"5","o":"图形与几何","t":"reasoning"},{"i":"cnm_h179","n":"直线与圆的位置关系","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.5","d":"圆心到直线的距离 d 与半径 r 比较：d<r 相交，d=r 相切，d>r 相离。","m":["能计算圆心到直线的距离","能根据 d 与 r 判断位置关系"],"q":"圆 x²+y²=25，直线 x=3。圆心到直线的距离是多少？","a":"3","o":"图形与几何","t":"reasoning"},{"i":"cnm_h180","n":"直线被圆截得的弦","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.5","d":"弦心距为 d、半径为 r 时，半弦长是 √(r²−d²)，弦长是它的 2 倍。","m":["能由弦心距和半径求弦长","知道相切时弦长为 0"],"q":"圆 x²+y²=25，直线 x=3。弦长是多少？","a":"8","o":"图形与几何","t":"procedural"},{"i":"cnm_h181","n":"圆与圆的位置关系","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.5","d":"设两圆半径为 r1、r2，圆心距为 d。d=r1+r2 外切，d=|r1−r2| 内切，介于两者之间则相交。","m":["能计算圆心距","能用圆心距和半径判断位置关系"],"q":"两圆圆心距是 5，半径是 3 和 4。公共点有几个？","a":"2","o":"图形与几何","t":"reasoning"},{"i":"cnm_h182","n":"直线与圆的简单应用","b":"H","g":12,"k":"选必一","u":"第二章","c":"选必一 第二章 直线和圆的方程 2.5","d":"航线、管道是否与圆形区域相交，可以化成直线与圆的位置关系。","m":["能把圆形区域写成圆的方程","能用距离与半径比较得出结论"],"q":"圆形喷灌区圆心在原点，半径 10。笔直管道沿直线 x=6。圆心到管道的距离是多少？","a":"6","o":"图形与几何","t":"application"},{"i":"cnm_h183","n":"椭圆的定义","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.1","d":"平面内到两个定点的距离之和等于常数（大于两定点间距离）的点的轨迹是椭圆。","m":["能说出椭圆定义中的距离之和","知道这个常数必须大于两焦点间的距离"],"q":"椭圆定义里，动点到两个焦点的距离有什么关系？","a":"和等于一个大于焦距的常数","o":"图形与几何","t":"conceptual"},{"i":"cnm_h184","n":"椭圆的标准方程","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.1","d":"焦点在 x 轴上时，椭圆标准方程是 x²/a²+y²/b²=1，其中 a>b>0。","m":["能写出焦点在 x 轴上的标准方程","能从标准方程读出 a 和 b"],"q":"椭圆 x²/25+y²/16=1 中，a 等于多少？","a":"5","o":"图形与几何","t":"procedural"},{"i":"cnm_h185","n":"椭圆的 a、b、c 关系","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.1","d":"椭圆中 a、b、c 满足 c²=a²−b²，焦距是 2c，离心率是 c/a。","m":["能由 a、b 求 c","能计算离心率"],"q":"椭圆 a=5，b=4。c 等于多少？","a":"3","o":"图形与几何","t":"reasoning"},{"i":"cnm_h186","n":"椭圆的简单几何性质","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.1","d":"焦点在 x 轴上的椭圆，长轴长 2a，短轴长 2b，范围是 −a≤x≤a、−b≤y≤b。","m":["能说出长轴和短轴的长","能写出椭圆的范围"],"q":"椭圆 x²/25+y²/9=1 的长轴长是多少？","a":"10","o":"图形与几何","t":"conceptual"},{"i":"cnm_h187","n":"椭圆的简单应用","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.1","d":"行星轨道、椭圆形场地可以用椭圆的长半轴、短半轴和距离之和描述。","m":["能把距离之和解释成 2a","能由 a、b 求焦点到中心的距离"],"q":"椭圆形跑道可看成椭圆，长半轴 5，短半轴 4。轨道上一点到两个焦点的距离之和是多少？","a":"10","o":"图形与几何","t":"application"},{"i":"cnm_h188","n":"双曲线的定义","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.2","d":"平面内到两个定点的距离之差的绝对值等于常数（小于两定点间距离）的点的轨迹是双曲线。","m":["能说出双曲线用的是距离之差","知道常数要小于焦距"],"q":"双曲线定义比较的是动点到两焦点距离的什么？","a":"差的绝对值","o":"图形与几何","t":"conceptual"},{"i":"cnm_h189","n":"双曲线的标准方程","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.2","d":"焦点在 x 轴上时，双曲线标准方程是 x²/a²−y²/b²=1。","m":["能写出焦点在 x 轴上的标准方程","能从方程区分椭圆和双曲线"],"q":"双曲线 x²/9−y²/16=1 中，a 等于多少？","a":"3","o":"图形与几何","t":"procedural"},{"i":"cnm_h190","n":"双曲线的简单几何性质","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.2","d":"焦点在 x 轴上时，实轴长 2a，虚轴长 2b，并且 c²=a²+b²。","m":["能由 a、b 求 c","能说出实轴和虚轴的长"],"q":"双曲线 a=3，b=4。c 等于多少？","a":"5","o":"图形与几何","t":"conceptual"},{"i":"cnm_h191","n":"双曲线的渐近线","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.2","d":"双曲线 x²/a²−y²/b²=1 的渐近线是 y=(b/a)x 和 y=−(b/a)x。","m":["能写出渐近线方程","能由 a、b 求渐近线的斜率"],"q":"双曲线 x²/9−y²/16=1 的一条渐近线斜率的绝对值是多少？","a":"4/3","o":"图形与几何","t":"conceptual"},{"i":"cnm_h192","n":"抛物线的定义","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.3","d":"平面内到一个定点和一条定直线的距离相等的点的轨迹是抛物线。定点是焦点，定直线是准线。","m":["能说出抛物线定义中的距离相等","能区分焦点和准线"],"q":"抛物线定义比较的是哪两个距离？","a":"到焦点的距离和到准线的距离","o":"图形与几何","t":"conceptual"},{"i":"cnm_h193","n":"抛物线的标准方程","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.3","d":"顶点在原点、焦点在 x 轴正半轴的抛物线是 y²=2px（p>0），焦点是 (p/2，0)。","m":["能由 2p 写出焦点坐标","能判断抛物线的开口方向"],"q":"抛物线 y²=8x。焦点的横坐标是多少？","a":"2","o":"图形与几何","t":"procedural"},{"i":"cnm_h194","n":"抛物线的简单几何性质","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.3","d":"y²=2px（p>0）的范围是 x≥0，对称轴是 x 轴，准线是 x=−p/2。","m":["能写出准线方程","能说出对称轴和范围"],"q":"抛物线 y²=8x 的准线方程中，x 等于多少？","a":"-2","o":"图形与几何","t":"conceptual"},{"i":"cnm_h195","n":"抛物线的简单应用","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.3","d":"探照灯、卫星天线的截面常用抛物线，光线平行于轴时会汇到焦点。","m":["能由截面方程求出焦点位置","能用定义比较到焦点和到准线的距离"],"q":"天线截面是 y²=16x，单位为米。焦点到顶点的距离是多少？","a":"4","o":"图形与几何","t":"application"},{"i":"cnm_h196","n":"直线与椭圆的交点个数","b":"H","g":12,"k":"选必一","u":"第三章","c":"选必一 第三章 圆锥曲线的方程 3.3","d":"把直线代入椭圆方程，得到的二次方程有几个实根，直线与椭圆就有几个交点。","m":["能把直线代入椭圆方程","能根据实根个数判断交点个数"],"q":"椭圆 x²/4+y²/3=1 与直线 y=x 的交点有几个？","a":"2","o":"图形与几何","t":"reasoning"},{"i":"cnm_h197","n":"数列的概念","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.1","d":"数列是按一定顺序排成的一列数，每一项都有确定的序号。","m":["能说出数列是有序的","能根据序号指出某一项"],"q":"下面哪一项最能说明数列和数集的差别？","a":"数列讲究顺序，数集不讲究顺序","o":"数与代数","t":"conceptual"},{"i":"cnm_h198","n":"数列的表示","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.1","d":"数列可以用列举、通项公式或图象表示。图象是一串孤立的点。","m":["能从列举中读出指定的项","知道数列图象不是连续曲线"],"q":"通项公式 a_n=2n+1。第 4 项是多少？","a":"9","o":"数与代数","t":"conceptual"},{"i":"cnm_h199","n":"通项公式","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.1","d":"通项公式用序号 n 表示第 n 项。知道通项就可以求出指定的一项。","m":["能把序号代入通项公式","能由前几项写出简单的通项"],"q":"a_n=3n−1。a_4 等于多少？","a":"11","o":"数与代数","t":"procedural"},{"i":"cnm_h200","n":"简单递推关系","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.1","d":"递推公式用前面的项表示后面的项。知道首项和递推，就可以逐项算下去。","m":["能由首项和递推算出下一项","能区分通项公式和递推公式"],"q":"a_1=3，a_{n+1}=a_n+4。a_2 等于多少？","a":"7","o":"数与代数","t":"procedural"},{"i":"cnm_h201","n":"等差数列的概念","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.2","d":"从第 2 项起，每一项与前一项的差都等于同一个常数，这个数列就是等差数列，常数叫做公差。","m":["能判断一个数列是不是等差数列","能求出公差"],"q":"等差数列 3，7，11，15 的公差是多少？","a":"4","o":"数与代数","t":"conceptual"},{"i":"cnm_h202","n":"等差数列的通项","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.2","d":"首项 a1、公差 d 的等差数列，通项是 a_n=a1+(n−1)d。","m":["能用首项和公差求指定项","能由两项求公差"],"q":"等差数列 a_1=3，d=4。a_6 等于多少？","a":"23","o":"数与代数","t":"procedural"},{"i":"cnm_h203","n":"等差中项","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.2","d":"若 a、b、c 成等差数列，则 2b=a+c，b 是 a 与 c 的等差中项。","m":["能用两端求等差中项","能判断三个数是否成等差"],"q":"5 和 11 的等差中项是多少？","a":"8","o":"数与代数","t":"procedural"},{"i":"cnm_h204","n":"等差数列的前 n 项和","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.2","d":"前 n 项和 S_n=n(a1+a_n)/2，也可以写成 S_n=na1+n(n−1)d/2。","m":["能用首末两项求前 n 项和","能用首项和公差求前 n 项和"],"q":"等差数列 a_1=3，a_6=23。前 6 项和是多少？","a":"78","o":"数与代数","t":"procedural"},{"i":"cnm_h205","n":"等差数列与一次函数","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.2","d":"等差数列的通项 a_n=dn+(a1−d) 是 n 的一次函数，公差就是一次项系数。","m":["能把通项写成一次函数","能从一次项系数读出公差"],"q":"通项 a_n=4n−1。公差是多少？","a":"4","o":"数与代数","t":"reasoning"},{"i":"cnm_h206","n":"等差数列的应用","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.2","d":"分期等额增加的存款、座位排数等，常常可以看成等差数列。","m":["能把逐期增加的常数认成公差","能求指定一期或前若干期的和"],"q":"剧场第 1 排 20 个座位，往后每排多 2 个。第 6 排有多少个座位？","a":"30","o":"数与代数","t":"application"},{"i":"cnm_h207","n":"等比数列的概念","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.3","d":"从第 2 项起，每一项与前一项的比都等于同一个非零常数，这个数列就是等比数列，常数叫做公比。","m":["能判断一个数列是不是等比数列","能求出公比"],"q":"等比数列 2，6，18，54 的公比是多少？","a":"3","o":"数与代数","t":"conceptual"},{"i":"cnm_h208","n":"等比数列的通项","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.3","d":"首项 a1、公比 q 的等比数列，通项是 a_n=a1·q^(n−1)。","m":["能用首项和公比求指定项","能由两项求公比"],"q":"等比数列 a_1=2，q=3。a_4 等于多少？","a":"54","o":"数与代数","t":"procedural"},{"i":"cnm_h209","n":"等比中项","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.3","d":"若 a、G、b 成等比数列且各项同号，则 G²=ab。G 是 a 与 b 的等比中项。","m":["能求两个正数的等比中项","能区分等差中项和等比中项"],"q":"2 和 8 的正等比中项是多少？","a":"4","o":"数与代数","t":"procedural"},{"i":"cnm_h210","n":"等比数列的前 n 项和","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.3","d":"公比 q≠1 时，S_n=a1(q^n−1)/(q−1)。q=1 时，S_n=na1。","m":["能用公比不等于 1 的求和公式","知道公比为 1 时要单独求和"],"q":"等比数列 a_1=2，q=3。前 4 项和是多少？","a":"80","o":"数与代数","t":"procedural"},{"i":"cnm_h211","n":"等比数列与指数函数","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.3","d":"等比数列的通项 a_n=a1·q^(n−1) 是指数型的，底数是公比。","m":["能指出公比就是指数的底","能比较等比数列和指数函数的定义域"],"q":"a_n=3×2^(n−1)。公比是多少？","a":"2","o":"数与代数","t":"reasoning"},{"i":"cnm_h212","n":"等比数列的应用","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.3","d":"按同一比率增长或衰减的量，可以用等比数列表示。","m":["能把固定增长率认成公比","能求若干期后的数量"],"q":"一种细菌每小时数量变为原来的 2 倍，开始有 3 个。3 小时后有多少个？","a":"24","o":"数与代数","t":"application"},{"i":"cnm_h213","n":"数学归纳法的原理","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.4","d":"数学归纳法先验证起点成立，再证明「若 n=k 成立则 n=k+1 成立」，从而对全体正整数成立。","m":["能说出归纳法的两步","知道只验证若干个具体数不算证明"],"q":"数学归纳法的第一步通常做什么？","a":"验证起始的正整数成立","o":"数与代数","t":"conceptual"},{"i":"cnm_h214","n":"用数学归纳法证明简单命题","b":"H","g":13,"k":"选必二","u":"第四章","c":"选必二 第四章 数列 4.4","d":"证明与正整数有关的等式时，要写清起点和从 k 到 k+1 的推导。","m":["能完成起点验证","能在归纳步骤里使用归纳假设"],"q":"前 n 个正整数的和是 n(n+1)/2。n=5 时，这个和是多少？","a":"15","o":"数与代数","t":"reasoning"},{"i":"cnm_h215","n":"平均变化率","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.1","d":"函数在区间上的平均变化率是函数值的增量除以自变量的增量。","m":["能计算给定区间上的平均变化率","能说出平均变化率对应割线的斜率"],"q":"f(x)=x²。从 x=1 到 x=3 的平均变化率是多少？","a":"4","o":"数与代数","t":"procedural"},{"i":"cnm_h216","n":"瞬时变化率与极限思想","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.1","d":"让自变量的增量趋于 0，平均变化率的极限就是瞬时变化率。这里只用具体的有理结果认识这个过程。","m":["能说出瞬时变化率是平均变化率的极限","能把增量取得更小并观察平均变化率"],"q":"f(x)=x²。从 2 到 2.5 的平均变化率是多少？","a":"9/2","o":"数与代数","t":"conceptual"},{"i":"cnm_h217","n":"导数的概念","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.1","d":"函数在一点的导数就是这一点的瞬时变化率。导数仍是自变量的函数，记为 f'(x)。","m":["能说出导数是瞬时变化率","能计算基本幂函数在一点的导数值"],"q":"f(x)=x²，则 f'(x)=2x。f'(3) 等于多少？","a":"6","o":"数与代数","t":"conceptual"},{"i":"cnm_h218","n":"导函数","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.1","d":"把每一点的导数值合在一起，就得到导函数。原函数和导函数的定义域可能不同。","m":["能由导函数求某一点的导数","能区分 f(x) 和 f'(x)"],"q":"f'(x)=3x²−3。f'(2) 等于多少？","a":"9","o":"数与代数","t":"conceptual"},{"i":"cnm_h219","n":"导数的几何意义","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.1","d":"函数在一点的导数，是曲线在这一点处切线的斜率。","m":["能把导数值解释成切线斜率","能判断导数为正时切线上升"],"q":"曲线 y=x² 在 x=1 处的导数是 2。切线斜率是多少？","a":"2","o":"数与代数","t":"conceptual"},{"i":"cnm_h220","n":"切线方程","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.1","d":"曲线在 (x0，y0) 处的切线，斜率是 f'(x0)，方程用点斜式书写。","m":["能求切点处的斜率","能写出切线的点斜式并求截距"],"q":"曲线 y=x² 在点 (1，1) 处的切线斜率是 2。切线在 y 轴上的截距是多少？","a":"-1","o":"数与代数","t":"procedural"},{"i":"cnm_h221","n":"基本初等函数的导数","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.2","d":"常函数导数为 0，(x^n)'=nx^(n−1)。正整数次幂可以据此直接求导。","m":["能求幂函数的导数","知道常函数的导数是 0"],"q":"f(x)=x³ 的导函数在 x=2 的值是多少？","a":"12","o":"数与代数","t":"procedural"},{"i":"cnm_h222","n":"导数的四则运算","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.2","d":"和的导数是导数的和，差也一样。常数倍可以提到导数符号外面。","m":["能对多项式逐项求导","能求常数倍的导数"],"q":"f(x)=x²+3x。f'(1) 等于多少？","a":"5","o":"数与代数","t":"procedural"},{"i":"cnm_h223","n":"简单复合函数的导数","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.2","d":"形如 f(ax+b) 的导数，等于外层导数乘内层的系数 a。","m":["能对 f(ax+b) 求导","能把系数 a 乘到外层导数上"],"q":"y=(2x+1)²。在 x=1 处的导数是多少？","a":"12","o":"数与代数","t":"procedural"},{"i":"cnm_h224","n":"导数与单调性","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.3","d":"在一个区间上 f'(x)>0 时函数递增，f'(x)<0 时函数递减。","m":["能由导数符号判断增减","知道导数为 0 的个别点不改变整个区间的单调性"],"q":"f(x)=x²，f'(x)=2x。f'(−1) 等于多少？","a":"-2","o":"数与代数","t":"reasoning"},{"i":"cnm_h225","n":"用导数求单调区间","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.3","d":"先求导，再解 f'(x)>0 与 f'(x)<0，得到不超过三次的多项式函数的单调区间。","m":["能求多项式的导函数","能把导数为正的解集写成递增区间"],"q":"f(x)=x²−4x。f'(x)=0 时，x 等于多少？","a":"2","o":"数与代数","t":"procedural"},{"i":"cnm_h226","n":"极值的条件","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.3","d":"导数为 0 是可导函数取极值的必要条件。两侧导数变号，才是极值的充分条件。","m":["能求导数为 0 的点","能用两侧符号区分极大和极小"],"q":"f(x)=x²−4x+1。可能的极值点横坐标是多少？","a":"2","o":"数与代数","t":"reasoning"},{"i":"cnm_h227","n":"闭区间上的最值","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.3","d":"闭区间上的连续函数，最值在极值点或端点取得。比较这些点的函数值即可。","m":["能列出极值点和端点","能比较函数值得到最大或最小"],"q":"f(x)=x²−2x 在 [0，3] 上的最大值是多少？","a":"3","o":"数与代数","t":"procedural"},{"i":"cnm_h228","n":"用导数解决优化问题","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.3","d":"把面积、利润写成函数后，用导数求定义域内的最大或最小值。","m":["能把实际限制写成函数和定义域","能用导数求出最优值"],"q":"矩形周长是 20。当长和宽相等时面积最大。这个最大面积是多少？","a":"25","o":"数与代数","t":"application"},{"i":"cnm_h229","n":"不超过三次的多项式函数","b":"H","g":13,"k":"选必二","u":"第五章","c":"选必二 第五章 一元函数的导数及其应用 5.3","d":"课标要求用导数研究不超过三次的多项式。三次多项式的导数是二次函数。","m":["能对三次多项式求导","能求导数为 0 的点"],"q":"f(x)=x³−3x+1。f'(0) 等于多少？","a":"-3","o":"数与代数","t":"procedural"},{"i":"cnm_h230","n":"分类加法计数原理","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.1","d":"完成一件事有若干类办法，类与类互斥，总办法数等于各类办法数相加。","m":["能判断情形是否要分类相加","能计算互斥类别的办法总数"],"q":"从甲地到乙地，汽车有 3 班，火车有 2 班，两类不能同时乘坐。一共有多少种走法？","a":"5","o":"统计与概率","t":"conceptual"},{"i":"cnm_h231","n":"分步乘法计数原理","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.1","d":"完成一件事要依次做若干步，每步的办法数相乘就是总办法数。","m":["能判断情形是否要分步相乘","能计算各步办法数的乘积"],"q":"有 3 件上衣、4 条裤子。上衣和裤子各选 1 件，有多少种搭配？","a":"12","o":"统计与概率","t":"conceptual"},{"i":"cnm_h232","n":"分类与分步综合计数","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.1","d":"一件事里既有分类又有分步时，先分清哪一段相加、哪一段相乘，再合并。","m":["能在同一问题里分别使用加法和乘法","能按步骤写出算式"],"q":"从 3 名男生和 2 名女生中选 1 人做代表，再从 4 本笔记本中选 1 本发给代表。一共有多少种做法？","a":"20","o":"统计与概率","t":"procedural"},{"i":"cnm_h233","n":"排列的概念","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.2","d":"从 n 个不同元素中取出 k 个排成一列，顺序不同算不同的排列。","m":["能说出排列与顺序有关","能计算很小的排列个数"],"q":"下面哪一项是排列？","a":"从 4 名同学中选 2 名排成先后顺序","o":"统计与概率","t":"conceptual"},{"i":"cnm_h234","n":"排列数公式","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.2","d":"排列数 A(n,k)=n!/(n−k)!，也就是从 n 起连乘 k 个递减的正整数。","m":["能计算排列数","能说出排列数公式的含义"],"q":"A(6,2) 等于多少？","a":"30","o":"统计与概率","t":"procedural"},{"i":"cnm_h235","n":"排列的简单应用","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.2","d":"排队、分配不同职务、组成无重复数字，都要按有顺序的选取来计数。","m":["能判断实际问题是不是排列","能用排列数写出结果"],"q":"5 名同学站成一排拍照，每人都要站。有多少种站法？","a":"120","o":"统计与概率","t":"application"},{"i":"cnm_h236","n":"组合的概念","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.2","d":"从 n 个不同元素中取出 k 个成一组，只看元素、不看顺序，叫做组合。","m":["能区分组合和排列","能计算很小的组合个数"],"q":"下面哪一项是组合？","a":"从 4 名同学中选 2 名参加会议，不计先后","o":"统计与概率","t":"conceptual"},{"i":"cnm_h237","n":"组合数公式","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.2","d":"组合数 C(n,k)=n!/(k!(n−k)!)，也等于排列数除以 k 的阶乘。","m":["能计算组合数","知道 C(n,0)=1"],"q":"C(6,2) 等于多少？","a":"15","o":"统计与概率","t":"procedural"},{"i":"cnm_h238","n":"组合数的性质","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.2","d":"C(n,k)=C(n,n−k)。相邻组合数还有 C(n,k)+C(n,k−1)=C(n+1,k)。","m":["能用对称性计算组合数","能用加法公式核对组合数"],"q":"已知 C(8,3)=C(8,5)。C(8,5) 等于多少？","a":"56","o":"统计与概率","t":"reasoning"},{"i":"cnm_h239","n":"组合的简单应用","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.2","d":"选人、选物且不计顺序时用组合；若还要按类别分别选取，再把组合数相乘。","m":["能判断实际问题用组合而不是排列","能计算分类选取的组合数"],"q":"从 6 名同学中选 3 人参加活动，不计顺序。有多少种选法？","a":"20","o":"统计与概率","t":"application"},{"i":"cnm_h240","n":"二项式定理","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.3","d":"(a+b)^n 的展开式是 C(n,k) a^(n−k) b^k 各项的和，k 从 0 取到 n。","m":["能说出展开式的项数","能求出指定项的二项式系数"],"q":"(1+x)^3 的展开式中，x² 的系数是多少？","a":"3","o":"统计与概率","t":"conceptual"},{"i":"cnm_h241","n":"二项展开式的指定项","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.3","d":"按 a 的降幂排列时，第 k+1 项是 C(n,k) a^(n−k) b^k。可由指数确定 k。","m":["能由指数求出 k","能计算含系数在内的指定项系数"],"q":"(a+b)^5 按 a 的降幂排列，第 3 项的二项式系数是多少？","a":"10","o":"统计与概率","t":"procedural"},{"i":"cnm_h242","n":"二项式系数的和","b":"H","g":14,"k":"选必三","u":"第六章","c":"选必三 第六章 计数原理 6.3","d":"令 a=b=1，可得二项式系数之和等于 2^n。","m":["能计算一行二项式系数的和","能说明这个和为什么是 2 的 n 次方"],"q":"(a+b)^4 的全部二项式系数之和是多少？","a":"16","o":"统计与概率","t":"reasoning"},{"i":"cnm_h243","n":"杨辉三角的性质","b":"H","g":14,"k":"选必三","u":"数学探究","c":"选必三 数学探究 杨辉三角的性质与应用","d":"杨辉三角的第 n 行（n 从 0 数）就是 (a+b)^n 的二项式系数。左右对称，相邻两数之和等于下一行的数。","m":["能按约定读出杨辉三角中的一个数","能用组合数解释相邻两数之和"],"q":"把 (a+b)^n 的二项式系数排成一行，n 从 0 开始。n=5 这一行、从左数第 3 个数（对应 k=2）是多少？","a":"10","o":"综合与实践","t":"modeling"},{"i":"cnm_h244","n":"条件概率","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.1","d":"在事件 B 已经发生的条件下事件 A 的概率记为 P(A|B)，等于 P(A∩B)/P(B)。","m":["能在缩小后的结果里计算条件概率","能说出条件概率的定义"],"q":"袋中有 5 个红球、3 个蓝球。已经取出 1 个红球并且不放回。再取 1 个球，取到红球的概率是多少？","a":"1/2","o":"统计与概率","t":"conceptual"},{"i":"cnm_h245","n":"概率的乘法公式","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.1","d":"P(A∩B)=P(A)P(B|A)。可以按事件发生的顺序把概率相乘。","m":["能用乘法公式计算两个事件同时发生的概率","能按先后顺序写出条件概率"],"q":"P(A)=1/2，P(B|A)=1/3。P(A 与 B 同时发生) 是多少？","a":"1/6","o":"统计与概率","t":"procedural"},{"i":"cnm_h246","n":"全概率公式","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.1","d":"若几种原因互斥且覆盖全部可能，事件的概率等于各原因的概率乘以相应条件概率后再相加。","m":["能把样本分成互斥的几类","能计算全概率"],"q":"甲箱有 2 个红球、1 个白球，乙箱有 1 个红球、2 个白球。等可能地先选一箱，再从该箱抽 1 球。抽到红球的概率是多少？","a":"1/2","o":"统计与概率","t":"procedural"},{"i":"cnm_h247","n":"贝叶斯公式","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.1","d":"已知结果已经发生，可以用全概率作分母，求这个结果来自某一原因的概率。","m":["能计算由结果反推原因的概率","能说出分母是这个结果的全概率"],"q":"机器 A 生产 3/5，次品率 1/10；机器 B 生产 2/5，次品率 1/5。已知取出的 1 件是次品，它来自 A 的概率是多少？","a":"3/7","o":"统计与概率","t":"procedural"},{"i":"cnm_h248","n":"条件概率与独立性","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.1","d":"若 P(B|A)=P(B)，则 A 发生不改变 B 的概率，A 与 B 相互独立。独立不是互斥。","m":["能用条件概率判断独立","能区分独立和互斥"],"q":"A 与 B 相互独立，P(B)=1/3。P(B|A) 是多少？","a":"1/3","o":"统计与概率","t":"reasoning"},{"i":"cnm_h249","n":"离散型随机变量","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.2","d":"把试验结果对应到实数，得到随机变量。只取有限个或可列个值时，称为离散型。","m":["能指出一个试验中的随机变量取哪些值","能说出离散型是按取值个数来区分的"],"q":"掷一枚均匀骰子，用 X 表示点数。X 有多少个不同的可能取值？","a":"6","o":"统计与概率","t":"conceptual"},{"i":"cnm_h250","n":"分布列","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.2","d":"分布列列出随机变量的每个取值和对应概率。所有概率非负，且总和为 1。","m":["能由概率之和为 1 补出缺少的概率","能检查分布列是否合法"],"q":"X 的取值是 1、2、3。P(X=1)=1/2，P(X=2)=1/3。P(X=3) 是多少？","a":"1/6","o":"统计与概率","t":"procedural"},{"i":"cnm_h251","n":"两点分布","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.2","d":"只取 0 和 1 的随机变量：P(X=1)=p，P(X=0)=1−p。它描述一次试验成功或失败。","m":["能由成功概率写出失败概率","能说出两点分布的均值是 p"],"q":"X 服从两点分布，P(X=1)=1/4。P(X=0) 是多少？","a":"3/4","o":"统计与概率","t":"conceptual"},{"i":"cnm_h252","n":"离散型随机变量的均值","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.3","d":"均值是取值乘对应概率后的和，也叫数学期望。它是概率意义下的加权平均。","m":["能按分布列计算均值","能说出均值是加权平均"],"q":"X 取值 1、2、3，概率分别是 1/2、1/3、1/6。X 的均值是多少？","a":"5/3","o":"统计与概率","t":"procedural"},{"i":"cnm_h253","n":"离散型随机变量的方差","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.3","d":"方差是 (取值−均值) 的平方再按概率加权的和。标准差是方差的算术平方根。","m":["能计算简单分布的方差","知道常数随机变量的方差是 0"],"q":"X 取值 0 和 1，概率都是 1/2。方差是多少？","a":"1/4","o":"统计与概率","t":"procedural"},{"i":"cnm_h254","n":"伯努利试验","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.4","d":"每次试验只有两个结果，成功概率保持为 p，各次相互独立。重复 n 次就是 n 重伯努利试验。","m":["能判断一组试验是不是伯努利试验","能指出试验次数和成功概率"],"q":"每次成功概率都是 1/5，而且各次独立。失败概率是多少？","a":"4/5","o":"统计与概率","t":"conceptual"},{"i":"cnm_h255","n":"二项分布","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.4","d":"n 重伯努利试验中，成功次数 X 服从二项分布。P(X=k)=C(n,k) p^k (1−p)^(n−k)。","m":["能计算二项分布的一个概率","能说出 X 表示成功次数"],"q":"X 服从 B(4,1/2)。P(X=2) 是多少？","a":"3/8","o":"统计与概率","t":"procedural"},{"i":"cnm_h256","n":"二项分布的均值与方差","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.4","d":"若 X 服从 B(n,p)，则均值是 np，方差是 np(1−p)。","m":["能计算二项分布的均值","能计算二项分布的方差"],"q":"X 服从 B(10,1/5)。均值是多少？","a":"2","o":"统计与概率","t":"procedural"},{"i":"cnm_h257","n":"超几何分布","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.4","d":"从 N 个产品里含 K 件次品，不放回地抽 n 件。抽到的次品数服从超几何分布。","m":["能计算不放回抽取的一个概率","能区分超几何分布和有放回的二项分布"],"q":"10 件产品中有 4 件次品，不放回地抽 3 件。恰有 1 件次品的概率是多少？","a":"1/2","o":"统计与概率","t":"procedural"},{"i":"cnm_h258","n":"超几何分布的均值","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.4","d":"不放回抽取 n 件时，抽到的指定类件数的均值是 nK/N。","m":["能计算超几何分布的均值","能说出公式里 N、K、n 的含义"],"q":"总体 10 件，其中指定类 4 件，不放回地抽 3 件。抽到的指定类件数的均值是多少？","a":"6/5","o":"统计与概率","t":"procedural"},{"i":"cnm_h259","n":"正态分布的特征","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.5","d":"正态曲线是单峰、关于均值对称的钟形曲线。均值决定对称轴，方差决定胖瘦。","m":["能说出正态曲线关于均值对称","能说出方差越大曲线越平坦"],"q":"一个正态分布的均值是 5。正态曲线对称轴对应的横坐标是多少？","a":"5","o":"统计与概率","t":"conceptual"},{"i":"cnm_h260","n":"正态曲线的经验规则","b":"H","g":14,"k":"选必三","u":"第七章","c":"选必三 第七章 随机变量及其分布 7.5","d":"教材常用近似说法：约 68% 的取值落在均值左右 1 个标准差内，约 95% 落在 2 个标准差内。","m":["能指出左右 1 个标准差对应的区间","知道这些百分比是近似的经验规则"],"q":"正态分布的均值是 10，标准差是 2。均值左右 1 个标准差的区间，半宽是几个标准差？","a":"1","o":"统计与概率","t":"conceptual"},{"i":"cnm_h261","n":"成对数据的统计相关性","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.1","d":"把成对数据画成散点。点大致沿直线上升是正相关，沿直线下降是负相关。","m":["能根据散点的走向判断正负相关","知道相关不是严格的函数关系"],"q":"散点大致从左下到右上，这表示什么？","a":"正相关","o":"统计与概率","t":"conceptual"},{"i":"cnm_h262","n":"样本相关系数","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.1","d":"样本相关系数 r 用离差乘积来衡量线性相关的方向和强弱，取值在 −1 到 1 之间。","m":["能计算很小数列的离差乘积和","知道 r 接近 1 或 −1 时线性相关强"],"q":"数据 (1，2)、(2，4)、(3，6)。x 的平均数是 2，y 的平均数是 4。离差乘积之和是多少？","a":"4","o":"统计与概率","t":"procedural"},{"i":"cnm_h263","n":"比较相关性的强弱","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.1","d":"比较线性相关的强弱时看 |r|。绝对值更大，线性相关更强；符号只表示方向。","m":["能用绝对值比较两组相关系数","能区分方向和强弱"],"q":"两个样本相关系数是 −3/5 和 1/5。表示线性相关更强的那个绝对值是多少？","a":"3/5","o":"统计与概率","t":"reasoning"},{"i":"cnm_h264","n":"一元线性回归模型","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.2","d":"一元线性回归把响应变量写成解释变量的一次函数再加上随机误差。","m":["能说出模型里有解释变量和响应变量","能在没有误差时由直线算出函数值"],"q":"一元线性回归模型的基本形式是什么？","a":"响应变量等于一次函数再加上随机误差","o":"统计与概率","t":"conceptual"},{"i":"cnm_h265","n":"最小二乘原理","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.2","d":"最小二乘法选择使残差平方和最小的直线。残差是观测值减去预测值。","m":["能计算一个残差","能说出最小二乘是让残差平方和最小"],"q":"某个点的观测值是 5，直线给出的预测值是 3。残差是多少？","a":"2","o":"统计与概率","t":"conceptual"},{"i":"cnm_h266","n":"回归系数的最小二乘估计","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.2","d":"对点 (x_i,y_i)，斜率 b=(n∑xy−∑x∑y)/(n∑x²−(∑x)²)，截距 a=ȳ−b x̄。","m":["能对很少的点算出斜率","能随后算出截距"],"q":"点 (1，1)、(2，3)、(3，5)。用最小二乘公式，斜率 b 是多少？","a":"2","o":"统计与概率","t":"procedural"},{"i":"cnm_h267","n":"用回归直线做预测","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.2","d":"把新的 x 代入回归直线，得到 y 的预测值。预测是估计，不是确定的观测。","m":["能把 x 代入直线得到预测值","知道预测和实测可以不同"],"q":"回归直线是 y=2x−1。x=4 时，y 的预测值是多少？","a":"7","o":"统计与概率","t":"application"},{"i":"cnm_h268","n":"2×2 列联表","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.3","d":"两个分类变量各有两类时，可以排成 2×2 列联表，并计算行合计、列合计和总数。","m":["能计算列联表的总数","能计算一行的合计"],"q":"列联表四格人数是 10、6、4、10。总人数是多少？","a":"30","o":"统计与概率","t":"procedural"},{"i":"cnm_h269","n":"独立性检验的思想","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.3","d":"独立性检验先假设两个分类变量独立，再看观测到的列联表是否偏离这个假设太远。","m":["能说出先假设独立再看偏离","知道 ad−bc 为 0 时四格很均衡"],"q":"独立性检验开始时先做什么假设？","a":"假设两个分类变量相互独立","o":"统计与概率","t":"conceptual"},{"i":"cnm_h270","n":"独立性检验的统计量","b":"H","g":14,"k":"选必三","u":"第八章","c":"选必三 第八章 成对数据的统计分析 8.3","d":"2×2 表可用 χ²=n(ad−bc)²/((a+b)(c+d)(a+c)(b+d))。数值越大，越倾向认为有关联。","m":["能把四格人数代入这个公式","知道公式等于 0 时交叉乘积平衡"],"q":"列联表 a=20，b=5，c=5，d=20。按 χ²=n(ad−bc)²/((a+b)(c+d)(a+c)(b+d)) 计算，结果是多少？","a":"18","o":"统计与概率","t":"procedural"},{"i":"cnm_h271","n":"建立统计模型进行预测","b":"H","g":1 <script>// ===== 数据与工具 =====
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const TOP={},PRE={},SUC={},LIST=DATA.T;const LES=DATA.L;
const BN={P:'小学',J:'初中',H:'高中'};
LIST.forEach((t,k)=>{t.k0=k;TOP[t.i]=t;PRE[t.i]=[];SUC[t.i]=[];});
DATA.E.forEach(e=>{const o={p:e[0],c:e[1],h:!!e[2],r:e[3]||'',ours:!!e[4]};PRE[o.c].push(o);SUC[o.p].push(o);});
const N=LIST.length;const NE_OURS=DATA.E.filter(e=>e[4]).length,NE_REPO=DATA.E.length-NE_OURS;
function skey(t){return ('PJH'.indexOf(t.b))*1e6+t.g*1e4+(t.k.endsWith('下')?5000:0)+t.k0;}
// 全局拓扑序（同时按 学段→年级→上下册 优先）
const TORD={};(function(){const indeg={};LIST.forEach(t=>indeg[t.i]=PRE[t.i].length);let av=LIST.filter(t=>!indeg[t.i]);let k=0;
 while(av.length){av.sort((a,b)=>skey(a)-skey(b));const t=av.shift();TORD[t.i]=k++;SUC[t.i].forEach(e=>{if(--indeg[e.c]===0)av.push(TOP[e.c]);});}
 if(k!==N)console.warn('cycle?',N-k);})();
const BYT=[...LIST].sort((a,b)=>TORD[a.i]-TORD[b.i]);
// 往后依赖计数（位集）
const IDX={};BYT.forEach((t,k)=>IDX[t.i]=k);const WD=Math.ceil(N/32);
const DESC=new Array(N);(function(){for(let k=N-1;k>=0;k--){const t=BYT[k];const b=new Uint32Array(WD);SUC[t.i].forEach(e=>{const j=IDX[e.c];b[j>>5]|=1<<(j&31);const d=DESC[j];for(let w=0;w<WD;w++)b[w]|=d[w];});DESC[k]=b;}})();
const IMPORTANCE={};(function(){const bandOf=BYT.map(t=>t.b);LIST.forEach(t=>{const b=DESC[IDX[t.i]];const c={P:0,J:0,H:0};for(let j=0;j<N;j++)if(b[j>>5]>>>(j&31)&1)c[bandOf[j]]++;IMPORTANCE[t.i]=c;});
 ['P','J','H'].forEach(bd=>{const arr=LIST.filter(t=>t.b===bd).sort((a,b)=>(IMPORTANCE[b.i].J+IMPORTANCE[b.i].H)-(IMPORTANCE[a.i].J+IMPORTANCE[a.i].H));arr.forEach((t,k)=>IMPORTANCE[t.i].rank=k+1);IMPORTANCE['_n'+bd]=arr.length;});})();
function ancestors(id,maxHop,hardOnly){const d=new Map([[id,0]]);let fr=[id];for(let h=1;fr.length&&h<=maxHop;h++){const nx=[];fr.forEach(x=>PRE[x].forEach(e=>{if(hardOnly&&!e.h)return;if(!d.has(e.p)){d.set(e.p,h);nx.push(e.p);}}));fr=nx;}d.delete(id);return d;}
function descendants(id,maxHop){const d=new Map([[id,0]]);let fr=[id];for(let h=1;fr.length&&h<=maxHop;h++){const nx=[];fr.forEach(x=>SUC[x].forEach(e=>{if(!d.has(e.c)){d.set(e.c,h);nx.push(e.c);}}));fr=nx;}d.delete(id);return d;}
function gradeLabel(t){return t.k+(t.u?' · '+t.u:'');}
function longLabel(t){return BN[t.b]+' · 人教'+(t.b==='H'?'A版 ':'版 ')+t.c;}
function toast(m){let e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200);}

// ===== 掌握情况：读我们自己做的页面 + 手动标记 + 导入 =====
const OWN='mathgraph_v1';
let OW={};try{OW=JSON.parse(localStorage.getItem(OWN)||'{}')||{};}catch(e){OW={};}
if(!OW.man||typeof OW.man!=='object')OW.man={};if(!OW.imp||typeof OW.imp!=='object')OW.imp={};
function saveOwn(){try{localStorage.setItem(OWN,JSON.stringify(OW));}catch(e){}}
const PMKEYS=[['pm01_placevalue_v2_plus','小学补课01（加量版）'],['pm01_placevalue_v1','小学补课01']];
let AUTO={},SRC={diag:0,pm:[],imp:0};
function readLS(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function loadAuto(){AUTO={};SRC={diag:0,pm:[],imp:0};const add=(id,r)=>{if(!TOP[id])return;(AUTO[id]||(AUTO[id]=[])).push(r);};
 const dg=readLS('g7_diag_v1');if(dg&&dg.tp&&typeof dg.tp==='object'){Object.entries(dg.tp).forEach(([id,s])=>{if(!s)return;SRC.diag++;add(id,{src:'七上诊断版页面',ok:+s.ok||0,bad:+s.bad||0,weak:!!s.weak,t:+s.t||0});});}
 PMKEYS.forEach(([k,nm])=>{const db=readLS(k);if(!db||typeof db!=='object')return;let any=0;
  Object.entries(DATA.PM).forEach(([lid,tids])=>{const right=Object.keys((db.qd||{})[lid]||{}).length;const wrong=Object.keys(db.w||{}).filter(x=>x.split(':')[0]===lid).length;
   if(!right&&!wrong)return;any=1;const ln=+lid.slice(1);tids.forEach(id=>add(id,{src:nm+' 第'+ln+'课',ok:right,bad:wrong,weak:wrong>0,t:0}));});
  if(any)SRC.pm.push(nm);});
 Object.entries(OW.imp).forEach(([id,r])=>{SRC.imp++;add(id,Object.assign({},r,{src:'导入：'+(r.src||'')}));});}
loadAuto();
function autoState(id){const a=AUTO[id];if(!a)return 'none';if(a.some(r=>r.weak))return 'weak';return a.some(r=>r.ok>0)?'ok':'none';}
function st(id){const m=OW.man[id];if(m)return m;return autoState(id);}
const STN={ok:'实际答对过',weak:'薄弱',none:'未验证'};
function setMan(id,v){if(v==='auto')delete OW.man[id];else OW.man[id]=v;saveOwn();}
window.addEventListener('storage',e=>{if(['g7_diag_v1',OWN].concat(PMKEYS.map(x=>x[0])).includes(e.key)){if(e.key===OWN){try{OW=JSON.parse(e.newValue||'{}');if(!OW.man)OW.man={};if(!OW.imp)OW.imp={};}catch(_){}}loadAuto();if(window.rerender)rerender();}});
// 进度码：导出/导入
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}
function exportCode(){const auto={};Object.keys(AUTO).forEach(id=>{const a=AUTO[id];auto[id]={ok:a.reduce((s,r)=>s+(r.ok||0),0),bad:a.reduce((s,r)=>s+(r.bad||0),0),weak:a.some(r=>r.weak),src:[...new Set(a.map(r=>r.src.replace(/^导入：/,'')))].join('、').slice(0,60),t:Math.max(0,...a.map(r=>r.t||0))};});
 return 'SXTP1.'+b64e(JSON.stringify({v:1,t:Date.now(),a:auto,m:OW.man}));}
function importCode(code){code=String(code||'').trim().replace(/\s+/g,'');const m=code.match(/^SXTP1\.([A-Za-z0-9+/=]+)$/);if(!m)throw new Error('这不是知识图谱的进度码（应以 SXTP1. 开头）');
 const o=JSON.parse(b64d(m[1]));if(!o||o.v!==1||typeof o.a!=='object')throw new Error('进度码内容不对');let n=0;
 Object.entries(o.a).forEach(([id,r])=>{if(!TOP[id]||!r)return;const old=OW.imp[id];if(!old||(r.t||0)>=(old.t||0)){OW.imp[id]={ok:+r.ok||0,bad:+r.bad||0,weak:!!r.weak,src:String(r.src||'').slice(0,60),t:+r.t||0};n++;}});
 let m2=0;Object.entries(o.m||{}).forEach(([id,v])=>{if(TOP[id]&&['ok','weak','none'].includes(v)){OW.man[id]=v;m2++;}});saveOwn();loadAuto();return {n,m:m2};}

function plMath(...parts) {
  return `<div class="pl-math">${parts.map(part => `<span${part.startsWith('*') ? ' class="pl-active"' : ''}>${esc(part.replace(/^\*/, ''))}</span>`).join('')}</div>`;
}

function plPlace(labels, digits, active = []) {
  const separator = labels.indexOf('.');
  const cells = labels.map((label, index) => label === '.'
    ? '<span class="pl-dot" aria-label="小数点">·</span>'
    : `<span class="pl-cell${active.includes(index) ? ' active' : ''}"><small>${label}</small><b>${digits[index] ?? '—'}</b></span>`);
  return `<div class="pl-place${separator < 0 ? '' : ' decimal'}" style="--slots:${labels.length};--left:${Math.max(1, separator)}">${cells.join('')}</div>`;
}

function plStrip(parts, count, label, second = 0) {
  const cells = Array.from({ length: parts }, (_, index) =>
    `<i${index < count ? ' class="fill"' : index < count + second ? ' class="alt"' : ''}></i>`);
  return `<div class="pl-strip" role="img" aria-label="${esc(label)}"><div class="pl-part" style="--units:${parts}">${cells.join('')}</div><small class="pl-caption">${esc(label)}</small></div>`;
}

function plStrips(...strips) {
  return `<div class="pl-strip">${strips.map(args => plStrip(...args)).join('')}</div>`;
}

function plPieces(count, label, join = false) {
  const ones = Array.from({ length: count }, () => '<i></i>').join('');
  return `<div><div class="pl-pieces${join ? ' bundled' : ''}" aria-hidden="true">${ones}</div><small class="pl-caption">${esc(label)}</small></div>`;
}

function plColumns(left, op, right, result = '') {
  return `<div class="pl-column" role="img" aria-label="${esc(`竖式 ${left} ${op} ${right}${result ? ` = ${result}` : ''}`)}"><div><span></span><span>${left}</span></div><div><span>${op}</span><span>${right}</span></div>${result ? `<div><strong>${result}</strong></div>` : ''}</div>`;
}

function plArea(stage) {
  const cells = Array.from({ length: 12 }, (_, index) => {
    const inTwoRows = index < 8;
    const inQuarter = index % 4 === 0;
    const mark = stage === 2 && inTwoRows && inQuarter ? 'intersection' : stage > 0 && inTwoRows ? 'row-shaded' : '';
    return `<i class="${mark}"></i>`;
  }).join('');
  const label = ['一整块分成 3 行、4 列，一共 12 小块', '取 3 行中的 2 行，也就是 2/3', '这两行各取 1 列，一共 2 小块'][stage];
  return `<div class="pl-area" role="img" aria-label="${label}"><div class="pl-grid-figure">${cells}</div><small class="pl-caption">${label}</small></div>`;
}

function plLine(left, right, stage) {
  const start = left + right;
  const points = { zero: 54, left: 24, right: 104 };
  const x = value => points.zero + value * 10;
  const arrow = stage === 1 ? `<path d="M${x(0)} 22H${x(right)}l-2.3 -2m2.3 2l-2.3 2"/>`
    : stage === 2 ? `<path d="M${x(0)} 22H${x(right)}l-2.3 -2m2.3 2l-2.3 2M${x(right)} 13H${x(start)}l2.3 -2m-2.3 2l2.3 2"/>` : '';
  const at = stage === 0 ? 0 : stage === 1 ? right : start;
  const marks = [-2, -1, 0, 1, 2, 3, 4, 5].map(value => `<path d="M${x(value)} 28v4"/><text x="${x(value)}" y="42">${String(value).replace('-', '−')}</text>`);
  return `<svg class="pl-line" role="img" aria-label="数线，当前位置 ${at}" viewBox="${points.left - 10} 5 ${points.right - points.left + 20} 40"><g class="pl-ticks"><path d="M${points.left - 4} 30H${points.right + 4}"/>${marks.join('')}</g><g class="pl-move">${arrow}<circle cx="${x(at)}" cy="30" r="2.5"/></g></svg>`;
}

function plValueTable() {
  return '<table class="pl-table"><thead><tr><th scope="col">本数</th><th scope="col">书钱</th><th scope="col">总价</th></tr></thead><tbody><tr><td>2</td><td>4 × 2 = 8</td><td>10 元</td></tr><tr><td>5</td><td>4 × 5 = 20</td><td>22 元</td></tr><tr class="active"><td>x</td><td>4x</td><td>(4x + 2) 元</td></tr></tbody></table>';
}

  '第一章-有理数-原理动画-诊断版.html': 'index.html',

for (const lesson of PRIMARY_LESSONS) {
  for (const id of lesson.topics) {
    if (!PRIMARY_BY_TOPIC.has(id)) PRIMARY_BY_TOPIC.set(id, []);
    PRIMARY_BY_TOPIC.get(id).push({ url: primaryHash(lesson.id), t: '小学补课 · ' + lesson.title });
  }
}

function readPrimaryProgress() {
  try {
    const stored = JSON.parse(localStorage.getItem(PL_STORAGE) || '{}');
    return {
      resume: PRIMARY_BY_ID.has(stored.resume) ? stored.resume : 'L1',
      frames: stored.frames && typeof stored.frames === 'object' ? stored.frames : {},
      watched: Array.isArray(stored.watched) ? [...new Set(stored.watched.filter(id => PRIMARY_BY_ID.has(id)))] : []
    };
  } catch (_) {
    return { resume: 'L1', frames: {}, watched: [] };
  }
}

let primaryProgress = readPrimaryProgress();
let primaryLesson = null;
let primaryStep = 0;

function primaryHash(id) {
  return '#/learn/' + (id ?? primaryProgress.resume);
}

function savedPrimaryStep(lesson) {
  const step = primaryProgress.frames[lesson.id];
  return Number.isInteger(step) && step >= 0 && step < lesson.steps.length ? step : 0;
}

function savePrimaryStep() {
  primaryProgress.resume = primaryLesson.id;
  primaryProgress.frames[primaryLesson.id] = primaryStep;
  if (primaryStep === primaryLesson.steps.length - 1 && !primaryProgress.watched.includes(primaryLesson.id)) {
    primaryProgress.watched.push(primaryLesson.id);
  }
  try { localStorage.setItem(PL_STORAGE, JSON.stringify(primaryProgress)); } catch (_) {}
}

function lessons(id) {
  const local = PRIMARY_BY_TOPIC.get(id) || [];
  const original = (LES[id] || []).filter(lesson => lesson.k !== 'pm01').map(lesson => ({
    url: (SITE_LESSONS[lesson.f] || lesson.f) + lesson.h, t: lesson.t
  }));
  return [...local, ...original];
}
