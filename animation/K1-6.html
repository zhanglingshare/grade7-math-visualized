 <div class="sec row"><a class="btn" href="${gHash(id,LASTU,LASTD)}">以它为中心看图</a><a class="btn ghost" href="#/p/${id}">从这里补起</a></div>`;}
function openDetail(id){if(isDesk()&&CUR==='g'&&$('#gside')){$('#gside').innerHTML=`<div class="card dt">${detailHTML(id)}</div>`;$('#gside').scrollTop=0;return;}
 window._sheetT=performance.now();const sh=$('#sheet');sh.dataset.id=id;$('#sheetin').innerHTML=detailHTML(id);sh.scrollTop=0;sh.classList.add('on');$('#sheetbg').classList.add('on');}
function closeDetail(){$('#sheet').classList.remove('on');$('#sheetbg').classList.remove('on');}

// ---------- 目录 ----------
function showCat(){CUR='cat';setNav('cat');const tree=[];
 ['P','J','H'].forEach(b=>{const books=new Map();LIST.filter(t=>t.b===b).sort((x,y)=>x.g-y.g||(x.k.endsWith('下')?1:0)-(y.k.endsWith('下')?1:0)||x.k0-y.k0).forEach(t=>{if(!books.has(t.k))books.set(t.k,new Map());const ch=b==='P'?(t.c.split(' ').slice(1).join(' ')||t.c):(t.c.split(' ').slice(1,3).join(' '));const m=books.get(t.k);if(!m.has(ch))m.set(ch,[]);m.get(ch).push(t);});tree.push([b,books]);});
 const nOK=ts=>ts.filter(t=>st(t.i)==='ok').length,nW=ts=>ts.filter(t=>st(t.i)==='weak').length;
 APP.innerHTML=`<div class="view"><div class="card"><h2>知识点目录</h2><p class="small muted" style="margin:0 0 8px">学段 → 年级（册）→ 章 / 单元。点知识点就在图上以它为中心。</p><button class="sbox" data-act="search">🔍 搜知识点</button></div>
 ${tree.map(([b,books])=>{const all=[...books.values()].flatMap(m=>[...m.values()].flat());return `<details class="cat" ${b==='J'?'open':''}><summary><span class="band ${b}">${BN[b]}</span> ${all.length} 个知识点 <span class="small muted">· 答对过 ${nOK(all)} · 薄弱 ${nW(all)}</span></summary><div class="in">
  ${[...books.entries()].map(([bk,chs])=>{const ts=[...chs.values()].flat();return `<details class="cat" ${bk==='七上'?'open':''}><summary>${esc(bk)} <span class="small muted">${ts.length} 个${nW(ts)?` · <b style="color:var(--rd)">薄弱 ${nW(ts)}</b>`:''}</span></summary><div class="in">
   ${[...chs.entries()].map(([ch,ts2])=>`<div class="lab">${esc(ch)}</div><div class="chips">${ts2.map(t=>chip(t.i)).join('')}</div>`).join('')}</div></details>`;}).join('')}</div></details>`;}).join('')}</div>`;}

// ---------- 从这里补起 ----------
function computePath(T,K,hardOnly){const A=ancestors(T,K,hardOnly);const S=new Set([T,...A.keys()]);const C=[...S].filter(id=>st(id)!=='ok').sort((a,b)=>TORD[a]-TORD[b]);const CS=new Set(C);
 const starts=new Set(C.filter(id=>!PRE[id].some(e=>(!hardOnly||e.h)&&CS.has(e.p))));
 const usedFor=id=>{let best=null,bd=1e9;SUC[id].forEach(e=>{if(!S.has(e.c))return;const d=e.c===T?0:A.get(e.c);if(d<bd){bd=d;best=e.c;}});return best;};
 return {A,S,C,starts,usedFor,okN:[...A.keys()].filter(i=>st(i)==='ok').length,wkN:[...A.keys()].filter(i=>st(i)==='weak').length};}
function showPath(T,q){CUR='p';setNav('p');const rec=recommend();T=T||(rec&&rec.i)||DEF;const K=lv(q.get('k')||'3')||3;const soft=q.get('s')==='1';const P=computePath(T,K,!soft);const t=TOP[T];
 const f=v=>v>=99?'a':String(v);const qs=(k,s)=>`#/p/${T}?k=${f(k)}&s=${s?1:0}`;
 const weakList=LIST.filter(x=>st(x.i)==='weak');
 const groups=[];P.C.forEach(id=>{const u=TOP[id];const key=BN[u.b]+' · '+u.k;let g=groups[groups.length-1];if(!g||g.key!==key){g={key,ids:[]};groups.push(g);}g.ids.push(id);});
 let n=0;const firstWeak=P.C.find(id=>st(id)==='weak'&&id!==T);
 APP.innerHTML=`<div class="view"><div class="card"><h2>从这里补起</h2>
 <div class="row" style="margin:4px 0 8px"><span class="muted small">目标：</span>${chip(T,{lab:1})}<button class="btn sm ghost" data-act="search" data-mode="path">换一个目标</button></div>
 ${weakList.length?`<div class="lab">他的薄弱点（点一个当目标）</div><div class="chips">${weakList.slice(0,24).map(x=>chip(x.i,{href:'#/p/'+x.i})).join('')}</div>`:''}
 <div class="gctl" style="margin-top:10px"><span class="lb">往回查</span><div class="seg">${[[1,'1层'],[2,'2层'],[3,'3层'],[99,'全部']].map(([k,l])=>`<button data-go="${qs(k,soft)}" class="${K===k?'on':''}">${l}</button>`).join('')}</div>
 <div class="seg"><button data-go="${qs(K,false)}" class="${!soft?'on':''}">只算硬先修</button><button data-go="${qs(K,true)}" class="${soft?'on':''}">含软先修</button></div></div>
 <div class="imp"><div><b>${P.A.size}</b><span>个先修在范围内</span></div><div><b style="color:var(--gr)">${P.okN}</b><span>实际答对过（跳过）</span></div><div><b style="color:var(--rd)">${P.wkN}</b><span>薄弱</span></div><div><b style="color:var(--muted)">${P.A.size-P.okN-P.wkN}</b><span>未验证</span></div></div>
 <p class="small" style="margin:10px 0 0">${firstWeak?`建议先补：<b style="color:var(--rd)">${esc(TOP[firstWeak].n)}</b>（排在最前面的薄弱点）。`:''}下面按 <b>从低年级到高年级</b>、先修在前的顺序排。答对过的点不出现；<b>未验证</b> 的点如果他确实会，点“会了”划掉，路径会马上变短。带 ◎ 的是这条路最底下的起点。</p>
 <div class="row" style="margin-top:8px"><a class="btn sm ghost" href="${gHash(T,Math.min(K,99),0,`hl=path&k=${f(K)}&s=${soft?1:0}`)}">在图谱里看这条路径</a></div></div>
 <div class="card"><div class="pth">${groups.map(g=>`<div class="gh"><span>${esc(g.key)}</span>${g.ids.some(i=>i!==T&&st(i)==='none')?`<button class="btn sm ghost" data-allok="${g.ids.filter(i=>i!==T&&st(i)==='none').join(',')}">这一册未验证的都会了</button>`:''}</div>${g.ids.map(id=>{n++;const u=TOP[id];const s=st(id);const uf=P.usedFor(id);const ls=lessons(id);const isT=id===T;
  return `<div class="st ${s} ${P.starts.has(id)?'start':''} ${isT?'tgt':''}"><div class="no">${n}</div><div class="bd"><div class="t">${P.starts.has(id)&&!isT?'◎ ':''}${esc(u.n)} ${stPill(id)}</div><small>${esc(gradeLabel(u))}${uf&&!isT?` · 用在「${esc(TOP[uf].n)}」`:''}${isT?' · 目标':''}</small>
  <div class="row" style="margin-top:6px">${ls.map(l=>`<a class="btn sm" href="${esc(l.url)}">去学 ▶</a>`).join('')}<a class="btn sm ghost" href="${gHash(id,1,1)}">看图</a><button class="btn sm ghost" data-act="detail" data-id="${id}">详情</button>${s!=='ok'?`<button class="btn sm ghost" data-man="ok" data-id="${id}">会了 ✓</button>`:''}</div></div></div>`;}).join('')}`).join('')}
 ${P.C.length===1&&st(T)!=='none'?'':''}${P.C.length?'':`<p>范围内的先修他都实际答对过，${esc(t.n)} 本身也答对过。</p>`}</div></div></div>`;}

// ---------- 我的进度 ----------
function showMe(){CUR='me';setNav('me');const man=Object.entries(OW.man);const auto=Object.keys(AUTO);
 APP.innerHTML=`<div class="view"><div class="card"><h2>进度从哪里来</h2><p class="small">${srcLine()}</p>
 <p class="small muted">小学补课的观看进度和七上的做题记录都保存在当前浏览器。进度码只带走图谱的做题记录和手动标记。</p>
 <div class="row"><button class="btn sm ghost" data-act="reload">重新读取</button></div></div>
 <div class="card"><h2>导出进度码</h2><p class="small muted" style="margin:0 0 6px">在有记录的设备上复制这段码，发到另一台设备，在那边“导入”。</p><textarea class="code" id="exc" readonly>${esc(exportCode())}</textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-act="copy">复制</button></div></div>
 <div class="card"><h2>导入进度码</h2><textarea class="code" id="imc" placeholder="把 SXTP1. 开头的码粘贴到这里"></textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-act="import">导入</button><span class="small" id="imr"></span></div></div>
 <div class="card"><h2>有做题记录的点（${auto.length}）</h2><div class="chips">${auto.sort((a,b)=>TORD[a]-TORD[b]).map(id=>chip(id,{lab:1})).join('')||'<span class="small muted">还没有</span>'}</div></div>
 <div class="card"><h2>手动标记（${man.length}）</h2><div class="chips">${man.map(([id])=>chip(id,{lab:1})).join('')||'<span class="small muted">还没有</span>'}</div>${man.length?'<div class="row" style="margin-top:8px"><button class="btn sm ghost" data-act="clrman">清除全部手动标记</button></div>':''}</div></div>`;}

// ---------- 搜索 ----------
let SMODE='g';
const norm=s=>String(s).toLowerCase().replace(/（/g,'(').replace(/）/g,')').replace(/\s+/g,'');
LIST.forEach(t=>{t._n=norm(t.n);t._c=norm(t.c);t._d=norm(t.d);});
function scoreOne(t,q){const n=t._n;if(n===q)return {s:1000,m:[...Array(q.length).keys()]};let i=n.indexOf(q);if(i>=0)return {s:800-i*4-(n.length-q.length),m:[...Array(q.length).keys()].map(k=>k+i)};
 let pos=-1,gaps=0,m=[];for(const ch of q){const j=n.indexOf(ch,pos+1);if(j<0){m=null;break;}if(pos>=0)gaps+=j-pos-1;m.push(j);pos=j;}if(m)return {s:500-gaps*10-m[0]*2,m};
 const hit=[...q].filter(c=>n.includes(c));if(q.length>=3&&hit.length/q.length>=.66)return {s:200+hit.length*10,m:[...n].map((c,k)=>q.includes(c)?k:-1).filter(k=>k>=0)};
 if(norm(t.k)===q||t._c.includes(q))return {s:150,m:[]};if(t._d.includes(q))return {s:100,m:[]};return null;}
function search(qq){const toks=String(qq).trim().split(/\s+/).map(norm).filter(Boolean);if(!toks.length)return [];const out=[];
 LIST.forEach(t=>{let s=0,m=new Set();for(const q of toks){const r=scoreOne(t,q);if(!r)return;s+=r.s;r.m.forEach(x=>m.add(x));}out.push({t,s,m});});
 out.sort((a,b)=>b.s-a.s||TORD[a.t.i]-TORD[b.t.i]);return out.slice(0,40);}
function hlName(t,m){const n=t.n;if(norm(n)!==t._n||!m.size)return esc(n);let o='';const arr=[...n.replace(/\s+/g,'')];// 位置按去空格后的名字算
 if(arr.length!==n.length)return esc(n);arr.forEach((c,k)=>{o+=m.has(k)?`<mark>${esc(c)}</mark>`:esc(c);});return o;}
function openSearch(mode){SMODE=mode||'g';$('#srch').classList.add('on');const i=$('#sq');i.value='';doSearch();setTimeout(()=>i.focus(),30);}
function closeSearch(){const s=$('#srch');if(s)s.classList.remove('on');}
function doSearch(){const q=$('#sq').value;const r=search(q);const go=id=>SMODE==='path'?'#/p/'+id:gHash(id,LASTU,LASTD);
 $('#sres').innerHTML=q.trim()?(r.length?`<div class="small muted" style="margin:4px 2px 8px">找到 ${r.length>=40?'40+':r.length} 个</div><div class="lst">${r.map(x=>`<a class="li" style="text-decoration:none;color:inherit" href="${go(x.t.i)}"><span class="band ${x.t.b}" style="margin-top:2px">${BN[x.t.b]}</span><span class="bd"><b><i class="dot ${st(x.t.i)}"></i> ${hlName(x.t,x.m)}</b>${lessons(x.t.i).length?' <span class="pill" style="background:#d45216;color:#fff;padding:0 6px">▶课</span>':''}<small>${esc(gradeLabel(x.t))} · ${esc(x.t.d.slice(0,46))}${x.t.d.length>46?'…':''}</small></span></a>`).join('')}</div>`:'<p class="muted">没找到。换个说法试试，比如只打两三个关键字。</p>'):`<p class="small muted">不用拼音，直接打汉字；字可以不连着，比如“有减”能找到“有理数的减法”。也能搜册次，比如“七上”。</p><div class="chips">${['减法','绝对值','通分','位值','代数式','配方法','勾股','一次函数'].map(w=>`<button class="tp" data-sq="${w}">${w}</button>`).join('')}</div>`;}

// ---------- 事件 ----------
document.addEventListener('click',e=>{if(e.target.closest('#sres a'))setTimeout(closeSearch,0);const a=e.target.closest('[data-act],[data-go],[data-man],[data-allok],[data-sq],[data-v]');if(!a)return;
 if(a.dataset.v!=null&&a.parentElement.dataset.seg){const k=a.parentElement.dataset.seg,v=lv(a.dataset.v);location.hash=gHash(GR.center,k==='u'?v:GR.u,k==='d'?v:GR.d,GR.hlq);return;}
 if(a.dataset.go){e.preventDefault();closeDetail();location.hash=a.dataset.go;return;}
 if(a.dataset.sq){$('#sq').value=a.dataset.sq;doSearch();return;}
 if(a.dataset.man){const id=a.dataset.id;setMan(id,a.dataset.man);toast(a.dataset.man==='auto'?'已改回按做题记录':'已手动标记：'+{ok:'会了',weak:'薄弱',none:'未验证'}[a.dataset.man]);if($('#sheet').classList.contains('on'))$('#sheetin').innerHTML=detailHTML($('#sheet').dataset.id);rerender();return;}
 if(a.dataset.allok){a.dataset.allok.split(',').forEach(id=>setMan(id,'ok'));toast('已标成“会了”（手动）');route();return;}
 const act=a.dataset.act;
 if(act==='search')openSearch(a.dataset.mode);else if(act==='closesearch')closeSearch();
 else if(act==='detail')openDetail(a.dataset.id||GR.center);else if(act==='closedetail'){if(performance.now()-(window._sheetT||0)>450)closeDetail();}
 else if(act==='qa')a.closest('.qa').classList.add('show');
 else if(act==='zi')zoomBy(1.25);else if(act==='zo')zoomBy(0.8);else if(act==='fit')fitNow();else if(act==='fs')toggleFS();
 else if(act==='back'){if(CRUMB.length>1){CRUMB.pop();const p=CRUMB.pop();location.hash=gHash(p,GR.u,GR.d);}else history.back();}
 else if(act==='reload'){loadAuto();route();toast('已重新读取');}
 else if(act==='copy'){const t=$('#exc');t.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('已复制'),()=>toast(ok?'已复制':'请长按选中后复制'));else toast(ok?'已复制':'请长按选中后复制');}
 else if(act==='import'){try{const r=importCode($('#imc').value);$('#imr').textContent=`导入了 ${r.n} 个点的记录、${r.m} 个手动标记 ✓`;toast('导入成功');setTimeout(route,700);}catch(err){$('#imr').textContent='✗ '+err.message;}}
 else if(act==='clrman'){if(confirm('清除全部手动标记？做题记录不受影响。')){OW.man={};saveOwn();route();}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();closeDetail();const w=$('.gw.fs');if(w)toggleFS();}
 if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='sq'){const f=$('#sres a.li');if(f)location.hash=f.getAttribute('href');}});
document.addEventListener('input',e=>{if(e.target.id==='sq')doSearch();});
let RZ=0;window.addEventListener('resize',()=>{clearTimeout(RZ);RZ=setTimeout(()=>{if(CUR==='g'&&GR.ly){sizeGW();const t=fitCam(GR.ly);GR.cam={s:t.s,tx:t.tx,ty:t.ty};applyCam();}},150);});
route();
</script>
